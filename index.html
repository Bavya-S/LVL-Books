  import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
    collection, doc, getDoc, getDocs, setDoc, deleteDoc, onSnapshot, writeBatch, query, where, runTransaction
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

<script>
/* ============ Firestore data layer (real-time, offline-capable) ============ */
/* Same async API as the single-device version (dbAll/dbGet/dbPut/dbDel/dbClear/dbIncrement), so the app
   logic is identical. Every collection is mirrored in an in-memory cache kept fresh by onSnapshot listeners:
   reads are free and instant, and every phone sees every change within about a second.
   Invoices, sessions and stock movements are loaded for the last 120 days only, so Firestore usage stays small
   for years (daily totals live forever in dailyRecords; older invoices are still fetched one-by-one when opened). */
function fb(){ return window.__fb; }
function waitForFirebase(){
  return new Promise((resolve)=>{
    if(window.__fbReady){ resolve(); return; }
    window.addEventListener('fb-ready', ()=>resolve(), {once:true});
    setTimeout(()=>resolve(), 10000);
  });
}
const KEYPATH = { customers:'mobile', bsessions:'id', invoices:'id', products:'id', expenses:'id', settings:'key', vendors:'id', purchases:'id',
  employees:'id', employeeTx:'id', accounts:'name', dailyRecords:'date', stations:'id', inventoryTx:'id', physical:'id' };
const AUTOINC = new Set(['bsessions','invoices','products','expenses','vendors','purchases','employees','employeeTx','stations','inventoryTx','physical']);
const WINDOWED = { invoices:{field:'date',days:120}, bsessions:{field:'startTime',days:120}, inventoryTx:{field:'date',days:120} };
const __cache = {}, __ready = {};
function clean(v){ return v===undefined ? v : JSON.parse(JSON.stringify(v)); }   // deep copy; also strips undefined (Firestore rejects it)
function writeAck(p){   // never let a missing signal freeze the UI: wait briefly for the server, then continue (the write is queued locally)
  p.catch(e=>{ console.error('Cloud write failed', e); try{ showToast('⚠️ A change could not be saved to the cloud: '+(e.code||e.message)); }catch(_){} });
  return Promise.race([p, new Promise(res=>setTimeout(res,3000))]);
}
async function nextId(store){
  const f = fb(); const ref = f.doc(f.db,'counters',store);
  try{ return await f.runTransaction(f.db, async t=>{ const snap=await t.get(ref); const n=(snap.exists()?(snap.data().n||0):0)+1; t.set(ref,{n}); return n; }); }
  catch(e){ return Math.floor(Date.now()/1000)*100 + Math.floor(Math.random()*100); }   // offline fallback: unique, not sequential
}
async function dbAll(store){
  if(__ready[store]) return clean([...__cache[store].values()]);
  const f = fb(); const snap = await f.getDocs(f.collection(f.db, store)); return snap.docs.map(d=>d.data());
}
async function dbGet(store, key){
  const k = String(key);
  if(__ready[store] && __cache[store].has(k)) return clean(__cache[store].get(k));
  if(__ready[store] && !WINDOWED[store]) return undefined;
  const f = fb(); const snap = await f.getDoc(f.doc(f.db, store, k)); return snap.exists() ? snap.data() : undefined;
}
async function dbPut(store, val){
  const f = fb(); const kp = KEYPATH[store] || 'id'; val = Object.assign(val, clean(val));   // strip undefined in place
  if(AUTOINC.has(store) && (val[kp]===undefined || val[kp]===null)) val[kp] = await nextId(store);
  const data = clean(val); const k = String(val[kp]);
  if(__ready[store]) __cache[store].set(k, data);   // write-through: visible to the very next read
  await writeAck(f.setDoc(f.doc(f.db, store, k), data));
  return val[kp];
}
async function dbDel(store, key){
  const f = fb(); const k = String(key); if(__ready[store]) __cache[store].delete(k);
  await writeAck(f.deleteDoc(f.doc(f.db, store, k)));
}
async function dbClear(store){
  const f = fb(); const snap = await f.getDocs(f.collection(f.db, store)); const docs = snap.docs;
  for(let i=0;i<docs.length;i+=400){ const b=f.writeBatch(f.db); docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await writeAck(b.commit()); }
  if(__ready[store]) __cache[store].clear();
}
async function dbIncrement(store, key, field){   // atomic across devices (so two phones can never issue the same invoice number)
  const f = fb(); const k = String(key); const ref = f.doc(f.db, store, k);
  try{
    const v = await f.runTransaction(f.db, async t=>{ const snap=await t.get(ref); const d=snap.exists()?snap.data():{}; const cur=d[field]||1; t.set(ref, Object.assign({}, d, {[field]:cur+1})); return cur; });
    if(__ready[store] && __cache[store].has(k)) __cache[store].get(k)[field] = v+1;
    return v;
  }catch(e){ const d=(await dbGet(store,key))||{}; const v=d[field]||1; d[field]=v+1; await dbPut(store,d); return v; }
}
async function dbUpdate(store, key, fn){   // read-modify-write as ONE atomic step, so concurrent edits from several phones are never lost
  const f = fb(), k = String(key), ref = f.doc(f.db, store, k);
  try{
    let out;
    const doc = await f.runTransaction(f.db, async t=>{
      const snap = await t.get(ref); const d = snap.exists() ? snap.data() : undefined;
      try{ out = fn(d); }catch(e){ e.__app = true; throw e; }
      t.set(ref, clean(d)); return d;
    });
    if(__ready[store]) __cache[store].set(k, clean(doc));
    return { doc, result:out };
  }catch(e){
    if(e && e.__app) throw e;
    const d = clean(await dbGet(store, key)); const result = fn(d); await dbPut(store, d); return { doc:d, result };   // offline: apply locally, Firestore syncs later
  }
}
let __renderTimer = null;
function scheduleRender(){   // debounced; never repaints while someone is typing in a form field
  clearTimeout(__renderTimer);
  __renderTimer = setTimeout(()=>{
    const a = document.activeElement, root = document.getElementById('root');
    if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && root.contains(a)){ scheduleRender(); return; }
    try{ render(); }catch(e){}
  }, 300);
}
function startSync(){
  const f = fb();
  return new Promise(resolveAll=>{
    let pending = ALL_STORES.length; const done = ()=>{ if(--pending===0) resolveAll(); };
    ALL_STORES.forEach(store=>{
      let first = true; const w = WINDOWED[store]; const col = f.collection(f.db, store);
      const q = w ? f.query(col, f.where(w.field, '>=', Date.now()-w.days*86400000)) : col;
      f.onSnapshot(q, snap=>{
        __cache[store] = new Map(snap.docs.map(d=>[d.id, d.data()])); __ready[store] = true;
        if(store==='bsessions') liveSessions = snap.docs.map(d=>d.data()).filter(x=>isOpenStatus(x.status));
        if(store==='settings'){ const m = __cache.settings.get('main'); if(m) state.settings = m; }
        if(first){ first=false; done(); } else scheduleRender();
      }, err=>{ console.error('Real-time sync error on', store, err); if(first){ first=false; done(); } });
    });
    setTimeout(()=>resolveAll(), 12000);
  });
}

/* ============ Static catalog / pricing data layer ============ */
const DEFAULT_STATIONS = [
  { code:'PS4_55',    label:'PS4',               category:'Gaming — PS4',               order:1, console:'PS4',     tv:'55" 4K TV',          type:'console', active:true, rates:{1:[120,60], 2:[190,95],  3:[260,130], 4:[340,170]} },
  { code:'PS5_55',    label:'PS5 55-inch',       category:'Gaming — PS5 55-inch',       order:2, console:'PS5',     tv:'55" 4K Neo QLED TV', type:'console', active:true, rates:{1:[140,70], 2:[230,115], 3:[320,160], 4:[420,210]} },
  { code:'PS5_65',    label:'PS5 65-inch',       category:'Gaming — PS5 65-inch',       order:3, console:'PS5',     tv:'65" 4K QLED TV',     type:'console', active:true, rates:{1:[160,80], 2:[270,135], 3:[380,190], 4:[500,250]} },
  { code:'PS5PRO_65', label:'PS5 Pro 65-inch',   category:'Gaming — PS5 Pro 65-inch',   order:4, console:'PS5 Pro', tv:'65" 4K QLED TV',     type:'console', active:true, rates:{1:[180,90], 2:[310,155], 3:[440,220], 4:[580,290]} },
];
/* A "gaming setup" is a configurable catalogue entry; its VARIANTS (one per player count, with its own hourly and
   30-minute rate) are what staff tap in the POS picker. New setups (e.g. a gaming PC) get their variants automatically. */
function setupLabel(st){ return st.label || st.console; }
function variantName(st, n){ return `${setupLabel(st)} — ${n} Player${n>1?'s':''}`; }
function setupPlayers(st){
  const ks = Object.keys(st.rates||{}).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
  const ord = (st.variantOrder||[]).map(Number).filter(n=>ks.includes(n)); return [...ord, ...ks.filter(n=>!ord.includes(n))];
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function fmtDur(mins){ mins=Math.round(mins||0); const h=Math.floor(mins/60), m=mins%60; return ((h?h+'h ':'') + (m?m+'m':'')).trim() || '0m'; }
function todayStr(){ return new Date().toDateString(); }
function isToday(ts){ return new Date(ts).toDateString()===todayStr(); }
function startOfWeek(){ const d=new Date(); const day=d.getDay(); d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d.getTime(); }
function startOfMonth(){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); }
function inRange(ts, range, custStart, custEnd){
  if(range==='today') return isToday(ts);
  if(range==='week') return ts>=startOfWeek();
  if(range==='month') return ts>=startOfMonth();
  if(range==='custom') return ts>=custStart && ts<=custEnd;
  return true;
}
function ymd(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function normMobile(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(d.length===12 && d.startsWith('91')) d = d.slice(2);
  else if(d.length===11 && d.startsWith('0')) d = d.slice(1);
  return /^[6-9]\d{9}$/.test(d) ? d : null;
}

/* Duration: integer minutes internally. Input may be minutes or decimal hours. */
function toMinutes(value, unit){ const v=Number(value); if(!isFinite(v)||v<=0) return NaN; return unit==='hours' ? Math.round(v*60) : Math.round(v); }
function durationPolicy(){ const s=state.settings||{}; return { custom:!!s.customDurationsEnabled, rules:s.customRules||[] }; }
function validateMinutes(min, pol){
  if(!Number.isInteger(min) || min<=0) return 'Enter a duration greater than zero.';
  if(!pol.custom && min%30!==0) return 'Custom durations are off. Use multiples of 30 minutes, or ask an admin to enable Custom Duration Rules in Settings.';
  return '';
}
/* Standard LVL policy: whole hours at the hourly rate + a 30-minute block at the half-hour rate.
   Only when custom durations are enabled: a configured rule for the leftover minutes wins,
   otherwise the leftover is charged proportionally to the hourly rate. */
function gamingCharge(min, hr, half, pol){
  const hours=Math.floor(min/60), rem=min%60; let total=hours*hr;
  if(rem===0) return total;
  if(rem===30) return total+half;
  const rule=(pol.rules||[]).find(r=>Number(r.minutes)===rem);
  if(rule) return total + (rule.mode==='flat' ? Math.round(Number(rule.value)) : Math.round(hr*Number(rule.value)/100));
  return total + Math.round(hr*rem/60);
}
/* Recomputes gross/total of one bill line from its own snapshot fields. Called only when the line
   is created or edited, so later price/policy changes never silently alter existing entries. */
function computeLine(l){
  const pol = l.policySnap || durationPolicy();
  if(l.kind==='gaming'){ l.unitPrice=l.hr; l.qty=1; l.unit='hour'; l.gross=gamingCharge(l.minutes, l.hr, l.half, pol); }
  else if(l.kind==='accompany'){ l.gross = l.free ? 0 : Math.round(l.qty*l.unitPrice*l.minutes/60); }
  else { l.gross = Math.round(l.qty*l.unitPrice); }
  const d = Math.min(100, Math.max(0, Number(l.discountPct)||0));
  l.total = Math.round(l.gross*(1-d/100));
  return l;
}
/* Bill totals. Discount % applies ONLY to gaming lines (food is never discounted at invoice level). */
function billTotals(lines, gamingDiscountPct, settings){
  const b={gaming:0,accompany:0,overtime:0,food:0,other:0};
  lines.forEach(l=>{ b[l.bucket||'other'] += l.total; });
  const subtotal = b.gaming+b.accompany+b.overtime+b.food+b.other;
  const pct = Math.min(100, Math.max(0, Number(gamingDiscountPct)||0));
  const discount = Math.round(b.gaming*pct/100);
  let tax = 0;
  if(settings.taxEnabled){
    const taxable = lines.filter(l=>l.taxable!==false).reduce((s,l)=>s+l.total,0);
    const gTaxable = lines.filter(l=>l.taxable!==false && l.bucket==='gaming').reduce((s,l)=>s+l.total,0);
    const dTax = b.gaming>0 ? discount*gTaxable/b.gaming : 0;
    tax = Math.round((taxable - dTax) * (Number(settings.taxRate)||0)/100);
  }
  return { ...b, subtotal, discountPct:pct, discount, tax, grand: subtotal - discount + tax };
}
function overtimeUnitLabel(s){
  if(s.overtimeMode==='occurrence') return 'occurrence';
  if(s.overtimeMode==='fixed') return 'fixed charge';
  if(s.overtimeMode==='custom') return s.overtimeCustomUnit||'unit';
  return (s.overtimeBlockMinutes||10)+'-min block';
}

function toCSV(rows){
  if(!rows || !rows.length) return 'no data\n';
  const headers = Object.keys(rows[0]);
  const esc = v=>{ if(v===undefined||v===null) return ''; v = typeof v==='object'? JSON.stringify(v): String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; };
  return [headers.join(','), ...rows.map(r=>headers.map(h=>esc(r[h])).join(','))].join('\n');
}
function downloadCSV(filename, rows){
  const blob = new Blob([toCSV(rows)], {type:'text/csv'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a');

async function loadSettingsAndSeed(){
  let s = await dbGet('settings','main');
  if(!s){ s = JSON.parse(JSON.stringify({ key:'main', ...DEFAULT_SETTINGS })); await dbPut('settings', s); }
  else { let ch=false; for(const [k,v] of Object.entries(DEFAULT_SETTINGS)){ if(s[k]===undefined){ s[k]=JSON.parse(JSON.stringify(v)); ch=true; } } if(ch) await dbPut('settings', s); }
  state.settings = s;
  let prods = await dbAll('products');
  if(prods.length===0){ for(const p of DEFAULT_PRODUCTS) await dbPut('products', { ...p }); prods = await dbAll('products'); }
  for(const sp of SPECIAL_PRODUCTS){ if(!prods.some(p=>p.type===sp.type)) await dbPut('products', { ...sp }); }
  for(const p of prods){   // upgrade catalogue rows created by older versions
    let ch=false;
    if(!p.type){ p.type = p.combo!==undefined ? 'combo' : (p.cat==='Beverages' ? 'beverage' : 'food'); ch=true; }
    if(p.unit===undefined){ p.unit = p.type==='beverage' ? 'bottle' : 'pc'; ch=true; }
    if(p.trackStock===undefined){ p.trackStock = p.type!=='combo'; ch=true; }
    if(p.active===undefined){ p.active=true; ch=true; }
    if(ch) await dbPut('products', p);
  }
  const accs = await dbAll('accounts');
  if(accs.length===0){ for(const a of DEFAULT_ACCOUNTS) await dbPut('accounts', { ...a }); }
  const sts = await dbAll('stations');
  if(sts.length===0){
    const old = await dbGet('settings','consoleRates');   // carry over rates edited in the previous version
    for(const d of DEFAULT_STATIONS){ const st = JSON.parse(JSON.stringify(d)); if(old && old.configs && old.configs[d.code] && old.configs[d.code].rates) st.rates = old.configs[d.code].rates; await dbPut('stations', st); }
  }
  let order=0; for(const st of await dbAll('stations')){   // upgrade setups created by older versions: label, POS category, order
    let ch=false; order++;
    const d=DEFAULT_STATIONS.find(x=>x.code===st.code);
    if(!st.label){ st.label = d ? d.label : st.console; ch=true; }
    if(!st.category){ st.category = d ? d.category : defaultCategory(st); ch=true; }
    if(st.order===undefined){ st.order = d ? d.order : 100+order; ch=true; }
    if(ch) await dbPut('stations', st);
  }
  liveSessions = (await dbAll('bsessions')).filter(x=>isOpenStatus(x.status));
}

function dateKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthKey(dateStr){ return dateStr.slice(0,7); } // YYYY-MM from a YYYY-MM-DD dailyRecords date
function weekKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
  return d.getFullYear()+'-W'+String(week).padStart(2,'0');
}
function aggregateDaily(records, keyFn, limit){
  const map = {};
  records.forEach(r=>{ const k=keyFn(r); if(!map[k]) map[k]={key:k, sales:0, expenses:0}; map[k].sales+=r.sales; map[k].expenses+=r.expenses; });
  return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key)).slice(-limit);
}
async function updateDailyRecord(dateStr){
  const invoices = (await dbAll('invoices')).filter(i=>dateKey(i.date)===dateStr);
  const expenses = (await dbAll('expenses')).filter(e=>!e.isTemplate && dateKey(e.date)===dateStr);
  const sales = invoices.reduce((s,i)=>s+i.grandTotal,0);
  const exp = expenses.reduce((s,e)=>s+e.amount,0);
  const gamingRev = invoices.reduce((s,i)=>s+(i.gamingAmount||0)+(i.accompanyAmount||0)+(i.overtimeAmount||0),0);
  const foodRev = invoices.reduce((s,i)=>s+i.foodAmount,0);
  await dbPut('dailyRecords', { date: dateStr, sales, expenses:exp, net: sales-exp, gamingRev, foodRev, invoiceCount: invoices.length, expenseCount: expenses.length, updatedAt: Date.now() });
}
async function rebuildDailyRecords(){
  const invoices = await dbAll('invoices'); const expenses = await dbAll('expenses');
  const days = new Set([...invoices.map(i=>dateKey(i.date)), ...expenses.filter(e=>!e.isTemplate).map(e=>dateKey(e.date))]);
  for(const d of days){ await updateDailyRecord(d); }
}
async function exportDayDetail(dateStr){
  const invoices = (await dbAll('invoices')).filter(i=>dateKey(i.date)===dateStr);
  const expenses = (await dbAll('expenses')).filter(e=>!e.isTemplate && dateKey(e.date)===dateStr);
  const sessions = (await dbAll('bsessions')).filter(s=>dateKey(s.startTime)===dateStr);
  const blob = new Blob([JSON.stringify({date:dateStr, invoices, expenses, sessions}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `LVL-Books-Day-${dateStr}.json`; a.click();
}

  return new Promise(resolve=>{
    const bg=document.createElement('div'); bg.className='dlg-bg'; bg.setAttribute('role','alertdialog'); bg.setAttribute('aria-modal','true');
    const box=document.createElement('div'); box.className='dlg';
    const p=document.createElement('p'); p.textContent=String(message); box.appendChild(p);
    const acts=document.createElement('div'); acts.className='acts';
    choices.forEach(c=>{ const b=document.createElement('button'); b.type='button'; b.className='btn '+(c.cls||''); b.textContent=c.label; b.onclick=()=>{ bg.remove(); resolve(c.value); }; acts.appendChild(b); });
    box.appendChild(acts); bg.appendChild(box);
    bg.addEventListener('click', e=>{ if(e.target===bg){ bg.remove(); resolve(null); } });
    dlgRoot().appendChild(bg);
    const f = acts.querySelector('.primary') || acts.lastChild; if(f && f.focus) f.focus();
  });
}
function askConfirm(message, okText, danger){
  if(window.__autoConfirm!==undefined){ window.__dialogLog.push(String(message)); return Promise.resolve(!!window.__autoConfirm); }

}
function tell(message){
  if(window.__autoConfirm!==undefined){ window.__dialogLog.push(String(message)); return Promise.resolve(); }
  return askChoice(message, [{label:'OK',value:true,cls:'primary'}]);
}

/* ============ Sessions (editable draft bills) ============ */
/* A SESSION is a master bill made of LINES. Gaming lines are independent SEGMENTS (any number, of any setup/player-count),
   each with its own start/end time or manual duration. Stays editable until finalized into ONE invoice. Store: 'bsessions'. */
let liveSessions = [];   // in-memory cache of open sessions for the 1-second timer ticker (no DB reads per tick)
function isOpenStatus(st){ return SESSION_OPEN.includes(st); }
function updateLiveCache(s){ liveSessions = liveSessions.filter(x=>x.id!==s.id); if(isOpenStatus(s.status)) liveSessions.push(s); }
async function createRecord(store, obj){ const id = await dbPut(store, obj); if(obj.id===undefined || obj.id===null) obj.id = id; return obj; }
function sesCode(s){ return (state.settings.sessionPrefix||'LVL-SES-') + String(s.id).padStart(6,'0'); }
function sesEditable(s){ return !!s && isOpenStatus(s.status); }
function isAdmin(){ try{ return localStorage.getItem('lvl_role')!=='staff'; }catch(e){ return true; } }
function can(key){ return isAdmin() || !!((state.settings.perm||{})[{editPrice:'staffEditPrice',discount:'staffDiscount',createItem:'staffCreateItem',deleteLines:'staffDeleteLines',cancelSession:'staffCancelSession',credit:'staffCredit'}[key]]); }
function needAdmin(){ if(isAdmin()) return true; tell('This needs Admin permission. Switch to Admin in Settings → Staff Permissions.'); return false; }

/* Every change to a session goes through mutateSession: it re-reads the LATEST stored session, applies the change and writes
   it back atomically (a Firestore transaction when online), one change at a time per session. A stale screen — or a second
   phone — can therefore never resurrect a deleted line or overwrite someone else's change. */
const __sesQueue = {};
function mutateSession(sid, fn){
  const run = async ()=>{
    const r = await dbUpdate('bsessions', sid, d=>{
      if(!d) throw new Error('This session no longer exists.');
      if(!sesEditable(d)) throw new Error(`This session is ${STATUS_LABEL[d.status]} and can't be edited. To correct a finalized bill use Credit / Refund on its invoice.`);
      const out = fn(d); d.updatedAt = Date.now(); return out;
    });
    updateLiveCache(r.doc); return r.result;
  };
  const p = (__sesQueue[sid]||Promise.resolve()).then(run, run);
  __sesQueue[sid] = p.catch(()=>{});
  return p;
}
async function act(promise){ try{ return await promise; }catch(e){ tell(e && e.message ? e.message : String(e)); return undefined; } }
function timeStr(ts){ return ts ? new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}) : '—'; }
function toLocalInput(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function lineElapsedMs(l){ return (l.elapsedMs||0) + (l.state==='running' && l.startedAt ? Date.now()-l.startedAt : 0); }
function stopLine(l){ if(l.kind!=='gaming'||l.state==='ended') return; l.elapsedMs=lineElapsedMs(l); l.state='ended'; l.endedAt=Date.now(); l.startedAt=null; }
function newLine(s, kind, props){
  const id = s.nextLineId || (Math.max(0,...s.lines.map(x=>x.id))+1);
  const l = Object.assign({ id, kind, name:'', category:'', itemId:null, qty:1, unit:'', unitPrice:0, discountPct:0, taxable:true, notes:'', bucket:'other', included:null, history:[], createdAt:Date.now() }, props);
  s.nextLineId = id+1; s.lines.push(l); return l;
}
function logHist(l, patch, fields){
  const by = isAdmin() ? 'Admin' : 'Staff'; l.history = l.history || [];
  fields.forEach(f=>{ if(patch[f]!==undefined && l[f]!==undefined && JSON.stringify(patch[f])!==JSON.stringify(l[f]))   /* fields an older line never had are defaults being filled in, not edits */ l.history.push({ t:Date.now(), by, field:f, from:l[f]===undefined?null:l[f], to:patch[f] }); });
}
const HIST_FIELDS = ['minutes','players','hr','half','unitPrice','qty','discountPct','free','physicalName','startTime','endedAt'];
function histText(h){ const f=v=>v===null||v===undefined?'—':(h.field==='minutes'?fmtDur(v):(h.field==='startTime'||h.field==='endedAt')?timeStr(v):String(v)); return `${new Date(h.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})} · ${h.by} · ${h.field}: ${f(h.from)} → ${f(h.to)}`; }
function sessionTotals(s){ return billTotals(s.lines, 0, state.settings); }
function openGamingLines(s){ return s.lines.filter(l=>l.kind==='gaming' && l.state!=='ended'); }
function gamingTitle(l){ return /Player/.test(l.name||'') ? l.name : `${l.name} · ${l.players}P`; }
/* A physical console may only be in ONE running segment at a time; many segments of the same MODEL are always fine. */
async function physicalBusy(physId, exceptSid, exceptLid){
  if(!physId) return null;
  const all = (await dbAll('bsessions')).filter(x=>isOpenStatus(x.status));
  for(const x of all) for(const l of x.lines) if(l.kind==='gaming' && l.physicalId===physId && l.state!=='ended' && !(x.id===exceptSid && l.id===exceptLid)) return { sid:x.id, lid:l.id, code:sesCode(x) };
  return null;
}

async function persistHeader(sid, quiet){
  const g=document.getElementById('sGroup'); if(!g) return true;
  const cur = await dbGet('bsessions', sid); if(!sesEditable(cur)) return true;
  const raw = document.getElementById('sCustMobile').value.trim();
  const mob = raw ? normMobile(raw) : '';
  if(raw && !mob && !quiet){ tell('Enter a valid 10-digit Indian mobile number (for example 98765 43210), or leave it blank for now.'); return false; }
  const vals = { groupName:g.value.trim(), notes:document.getElementById('sNotes').value.trim(), customerName:document.getElementById('sCustName').value.trim() };
  try{ await mutateSession(sid, s=>{ Object.assign(s, vals); if(!raw || mob) s.customerMobile = mob; }); }catch(e){ tell(e.message); return false; }
  return !(raw && !mob);
}

let __pk = null;   // data for the open picker (setups, products, bill snapshot); selection lives in state.pick

function pkAccRate(){ const p=(__pk&&__pk.products||[]).find(x=>x.type==='accompany'); return p ? p.price : 50; }
function pkAccAmount(){ const a=state.pick.acc; return a.free ? 0 : Math.round(a.persons*pkAccRate()*(Number(a.minutes)||0)/60); }
function pkOnBill(key){
  const s=__pk.s; if(!s) return 0;
  if(key.startsWith('g:')){ const [, sidr, pl]=key.split(':'); return s.lines.filter(l=>l.kind==='gaming' && l.stationId===Number(sidr) && l.players===Number(pl)).length; }
  if(key==='acc') return s.lines.filter(l=>l.kind==='accompany').reduce((a,l)=>a+l.qty,0);
  const id=Number(key.slice(2)); return s.lines.filter(l=>(l.kind==='item'||l.kind==='overtime') && l.itemId===id).reduce((a,l)=>a+l.qty,0);
}
function pkTotals(){
  const pk=state.pick; let types=0, units=0, amount=0; const items=[];
  Object.entries(pk.sel).forEach(([pid,q])=>{ if(q>0){ const p=__pk.products.find(x=>x.id===Number(pid)); if(p){ types++; units+=q; amount+=Math.round(p.price*q); items.push({p,qty:q}); } } });
  if(pk.acc.persons>0){ types++; units+=pk.acc.persons; amount+=pkAccAmount(); }

}

/* Add Selected Items: one atomic change; selection is only cleared after it succeeds; repeated taps are ignored */
async function pkCommit(){
  const pk=state.pick; if(!pk || pk.busy) return; const t=pkTotals(); if(!t.types) return;
  const acc = pk.acc.persons>0 ? { persons:pk.acc.persons, minutes:pk.acc.minutes, free:pk.acc.free } : null;
  if(acc){ const err=validateMinutes(Math.round(acc.minutes), durationPolicy()); if(err){ tell(err); return; } }
  pk.busy=true; pkBar();
  try{
    const accP=__pk.products.find(x=>x.type==='accompany');
    await mutateSession(pk.sid, s=>{
      t.items.forEach(x=>computeLine(addItemLine(s,x.p,null,x.qty)));
      if(acc && accP) computeLine(addAccompanyLine(s,accP,acc.persons,acc.minutes,acc.free));
    });
    pk.sel={}; pk.acc.persons=0; pk.acc.free=false;
    await pkRefresh(); showToast(`Added ${t.types} item type${t.types===1?'':'s'} (${t.units} unit${t.units===1?'':'s'}) · ${fmt(t.amount)}`);
  }catch(e){ tell(e.message||String(e)); }
  finally{ pk.busy=false; pkBar(); }
}

async function saveLineEdit(sid, lid){

  const ok = await act(mutateSession(sid, d=>{ const n=d.lines.length; d.lines=d.lines.filter(x=>x.id!==lid); if(d.lines.length===n) throw new Error('This line was already removed.'); return true; }));

/* Suggested billable time: time played rounded up to the next 30-minute block, with a 2-minute grace so a few seconds over never costs a whole extra block. Staff always confirm or change it. */
function suggestMinutes(l){ const em=lineElapsedMs(l)/60000; return Math.max(30, Math.ceil((em-2)/30)*30); }
async function switchLine(sid, lid){ state.afterEnd = { sid, lid, mode:'switch' }; await endLineModal(sid, lid); }

    o.innerHTML = err ? `<span style="color:var(--red)">${esc(err)}</span>` : `Charge for this segment: <b>${fmt(computeLine(Object.assign({},l,{minutes:min})).total)}</b>`; };
  window.__enPrev=prev; window.__enSet=(m)=>{ document.getElementById('enDur').value=m; document.getElementById('enUnit').value='minutes'; prev(); };
  const mode = state.afterEnd && state.afterEnd.sid===sid && state.afterEnd.lid===lid ? state.afterEnd.mode : null;
  openModal(`<button class="close" onclick="state.afterEnd=null;closeModal()">✕</button><h3>End segment — ${esc(gamingTitle(l))}</h3>
    <p class="muted" style="font-size:13px">Started ${timeStr(l.startTime||l.createdAt)} · ran <b>${fmtDur(el)}</b> · billed so far <b>${fmtDur(l.minutes)}</b>. Confirm what to bill for this segment — it will not keep growing after you end it.</p>
    <label>Billed duration</label><div class="row"><input id="enDur" type="number" step="any" min="0" value="${sug}" oninput="window.__enPrev()"><select id="enUnit" onchange="window.__enPrev()"><option value="minutes" selected>minutes</option><option value="hours">hours</option></select></div>
    <div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="btn sm" onclick="window.__enSet(${sug})">Time played, rounded up (${fmtDur(sug)})</button><button class="btn sm" onclick="window.__enSet(${l.minutes})">Keep ${fmtDur(l.minutes)}</button></div>
    <div id="enPrev" style="margin:10px 0;font-size:15px"></div>
    <div class="grid2"><button class="btn" onclick="state.afterEnd=null;closeModal()">Cancel</button><button class="btn primary" onclick="confirmEndLine(${sid},${lid})">${mode==='switch'?'End & pick replacement':mode==='players'?'End & set new player count':'End segment'}</button></div>`);

async function confirmEndLine(sid, lid){

    logHist(l,{minutes:min},['minutes']); l.minutes=min; computeLine(l); stopLine(l); return { setupId:l.stationId, physicalId:l.physicalId, physicalName:l.physicalName, players:l.players }; }));

/* ---- Live ticker & expiry alerts (per gaming segment; reads the in-memory cache, not the database) ---- */
const expiredAlerted = {};
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<2;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=800; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i*0.4;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t+0.03); g.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
      o.start(t); o.stop(t+0.32);
    }
    setTimeout(()=>ctx.close(), 1200);
  }catch(e){}
}
function fmtClock(totalSec){ const neg=totalSec<0; const a=Math.abs(totalSec); return (neg?'-':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0'); }
function showExpiryBanner(sid, l){
  const key = sid+'-'+l.id; if(document.getElementById('expiryBanner-'+key)) return;
  const el = document.createElement('div'); el.id='expiryBanner-'+key; el.className='banner'; el.setAttribute('role','alert');
  el.innerHTML = `<b>Time's up — ${esc(gamingTitle(l))}</b><div style="margin-top:8px;display:flex;gap:8px">
    <button class="btn sm" style="flex:1" onclick="extendLine(${sid},${l.id},30)">+30 min</button>
    <button class="btn sm" style="flex:1" onclick="extendLine(${sid},${l.id},60)">+1 hour</button>
    <button class="btn sm primary" style="flex:1" onclick="document.getElementById('expiryBanner-${key}').remove();endLineModal(${sid},${l.id})">End</button></div>`;
  document.body.appendChild(el);
}
function tickSessions(){
  const live = new Set();
  liveSessions.forEach(s=>{ s.lines.forEach(l=>{
    if(l.kind!=='gaming' || l.state!=='running') return;
    const key=s.id+'-'+l.id; live.add(key);
    const remaining = Math.floor(l.minutes*60 - lineElapsedMs(l)/1000);
    const el = document.getElementById('lt-'+key);
    if(el){
      if(remaining>=0){ el.innerHTML=`Time left: <b>${fmtClock(remaining)}</b> | Billed: ${fmtDur(l.minutes)}`; el.style.color = remaining<120?'var(--amber)':''; }
      else el.innerHTML=`<span style="color:var(--red);font-weight:600">Over by ${fmtClock(-remaining)}</span> | Billed: ${fmtDur(l.minutes)}`;
    }
    if(remaining>=0) delete expiredAlerted[key];
    else if(!expiredAlerted[key]){ expiredAlerted[key]=true; beep(); showExpiryBanner(s.id, l); }
  }); });
  document.querySelectorAll('[id^="expiryBanner-"]').forEach(b=>{ if(!live.has(b.id.replace('expiryBanner-',''))) b.remove(); });
}
setInterval(tickSessions, 1000);

/* ============ Checkout (final invoice review) ============ */
function addDaysStr(ds, n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d.getTime()); }
async function openCheckout(sid){
  if(!(await persistHeader(sid,false))) return;
  const s = await dbGet('bsessions', sid);
  if(!sesEditable(s)){ tell(s?`This session is ${STATUS_LABEL[s.status]} and can't be edited.`:'Session not found.'); return; }
  if(!s.lines.length){ tell('Add at least one line before checkout.'); return; }
  if(s.status!=='ready') await act(mutateSession(sid, d=>{ d.status='ready'; return true; }));
  const st = state.settings;
  state.ckForm = { sid, name:s.customerName||'', mobile:s.customerMobile||'', discountPct:0, date:ymd(Date.now()), terms:st.dueTermsDefault||'Due on receipt', orderNo:'', salesperson:st.salesperson||'', subject:'', notes:'', payments:[] };
  go('checkout');
}
function ckTotals(){ return billTotals(state.ckSession.lines, state.ckForm.discountPct, state.settings); }
function ckPaid(){ return state.ckForm.payments.reduce((a,p)=>a+Math.round(Number(p.amount)||0),0); }
function ckSummaryHtml(){
  const t = ckTotals(), paid = ckPaid(), st = state.settings;
  return `<table>
    <tr><td>Subtotal</td><td class="right">${fmt(t.subtotal)}</td></tr>
    <tr><td>Discount (${t.discountPct}% of gaming only)</td><td class="right">-${fmt(t.discount)}</td></tr>
    ${st.taxEnabled?`<tr><td>${esc(st.taxLabel||'Tax')} (${st.taxRate}%)</td><td class="right">${fmt(t.tax)}</td></tr>`:''}
    <tr class="total-row"><td>Grand total</td><td class="right">${fmt(t.grand)}</td></tr>
    <tr><td>Payments received</td><td class="right">${fmt(paid)}</td></tr>
    <tr class="total-row"><td>Balance due</td><td class="right" style="color:${t.grand-paid>0?'var(--amber)':'var(--green)'}">${fmt(t.grand-paid)}</td></tr></table>`;
}
function ckPayRowsHtml(){
  const f = state.ckForm;
  return f.payments.map((p,i)=>`<div class="row" style="gap:6px;margin-bottom:6px;align-items:center">
    <select onchange="ckPay(${i},'method',this.value)" style="flex:1.2">${PAY_METHODS.map(m=>`<option ${m===p.method?'selected':''}>${m}</option>`).join('')}</select>
    <input type="number" min="0" value="${p.amount}" oninput="ckPay(${i},'amount',this.value)" style="flex:1" placeholder="₹">
    <button class="btn sm" style="border-color:var(--red);color:var(--red)" onclick="ckRemovePay(${i})">✕</button></div>`).join('') || '<div class="muted" style="font-size:12px;margin-bottom:6px">No payment recorded yet — the balance stays due on the invoice.</div>';
}
function ckRefresh(){
  const a=document.getElementById('ckSummary'); if(a) a.innerHTML=ckSummaryHtml();
  const d=document.getElementById('ckDue'); if(d) d.textContent=addDaysStr(state.ckForm.date||ymd(Date.now()), DUE_TERMS[state.ckForm.terms]||0);
  const ft=document.getElementById('ckFootTotal'); if(ft){ const t=ckTotals(); ft.textContent=fmt(t.grand); const fb=document.getElementById('ckFootBal'); if(fb && !(state.ckSession&&openGamingLines(state.ckSession).length)) fb.textContent='Balance due '+fmt(t.grand-ckPaid()); }
}
function ck(field, v){ state.ckForm[field]=v; if(field==='mobile') ckLookup(); ckRefresh(); }
function ckPay(i, k, v){ state.ckForm.payments[i][k]=v; ckRefresh(); }
function ckRemovePay(i){ state.ckForm.payments.splice(i,1); document.getElementById('ckPays').innerHTML=ckPayRowsHtml(); ckRefresh(); }
function ckAddPay(method){ const bal=Math.max(0, ckTotals().grand-ckPaid()); state.ckForm.payments.push({method:method||'Cash', amount:bal}); document.getElementById('ckPays').innerHTML=ckPayRowsHtml(); ckRefresh(); }
function ckPayFull(method){ state.ckForm.payments=[{method, amount:ckTotals().grand}]; document.getElementById('ckPays').innerHTML=ckPayRowsHtml(); ckRefresh(); }
async function ckLookup(){
  const badge=document.getElementById('ckBadge'); if(!badge) return;
  const raw=state.ckForm.mobile.trim(); if(!raw){ badge.innerHTML=''; return; }
  const m=normMobile(raw);
  if(!m){ badge.innerHTML='<span class="pill red">Not a valid 10-digit Indian mobile yet</span>'; return; }
  const c = await dbGet('customers', m);
  if(c){ badge.innerHTML=`<div class="pill green" style="margin-top:4px">Existing customer ✓</div><div style="font-size:13px;margin-top:4px"><b>${esc(c.name)}</b> · ${c.visits} visit(s) · ${fmt(c.totalSpend)} lifetime · last ${new Date(c.lastVisit).toLocaleDateString('en-IN')}</div>${state.ckForm.name.trim()!==c.name?`<button class="btn sm" style="margin-top:6px" onclick="ckUseName('${m}')">Use saved name “${esc(c.name)}”</button>`:''}`;
    if(!state.ckForm.name.trim()){ state.ckForm.name=c.name; const n=document.getElementById('ckName'); if(n) n.value=c.name; } }
  else badge.innerHTML='<span class="pill neon">New customer — will be created after checkout</span>';
}
async function ckUseName(m){ const c=await dbGet('customers',m); if(!c) return; state.ckForm.name=c.name; document.getElementById('ckName').value=c.name; ckLookup(); }
async function screenCheckout(){
  const f = state.ckForm;
  if(!f) return `<div class="empty">Nothing to check out.</div><button class="btn" onclick="go('dashboard')">Back</button>`;
  const s = await dbGet('bsessions', f.sid);
  if(!s || !sesEditable(s)){ state.ckForm=null; return `<div class="empty">This session is no longer open.</div><button class="btn" onclick="go('dashboard')">Back</button>`; }
  state.ckSession = s;
  const st = state.settings; const nextNo = (st.invoicePrefix||'LVL-INV-')+String(st.nextInvoiceNo||1).padStart(6,'0');
  setTimeout(ckLookup,0);
  const open = openGamingLines(s);
  const grouped = ['gaming','accompany','overtime','food','other'].map(b=>[b, s.lines.filter(l=>l.bucket===b)]).filter(x=>x[1].length);
  const names = {gaming:'Gaming',accompany:'Accompanying persons',overtime:'Overtime',food:'Food & beverages',other:'Other'};
  return `<div class="row" style="justify-content:space-between;align-items:center"><button class="btn ghost sm" onclick="openSession(${s.id})">← Back to session</button><span class="pill green">${STATUS_LABEL[s.status]}</span></div>
    <h2>Checkout — ${sesCode(s)}</h2>
    ${open.length?`<div class="card" style="border-color:var(--amber)"><b>${open.length} gaming segment${open.length>1?'s are':' is'} still open</b><div class="muted" style="font-size:12px;margin:4px 0 8px">${open.map(l=>esc(gamingTitle(l))).join(', ')}. Segments must be ended explicitly so each is billed for its own duration.</div><button class="btn sm primary" onclick="endAllModal(${s.id})">End segments…</button></div>`:''}
    <div class="section-title">Customer Details</div>
    <div class="card">
      <label>Mobile number</label><input id="ckMobile" value="${esc(f.mobile)}" inputmode="numeric" placeholder="10-digit mobile (for WhatsApp)" oninput="ck('mobile',this.value)">
      <div id="ckBadge" style="margin:6px 0"></div>
      <label>Customer name</label><input id="ckName" value="${esc(f.name)}" placeholder="Customer or group name" oninput="ck('name',this.value)">
      <div class="muted" style="font-size:11px;margin-top:4px">Both are optional. Without a mobile number no WhatsApp bill can be opened and no customer record is created.</div>
    </div>
    <div class="section-title">Item Details</div>
    <div class="card">${grouped.map(([b,ls])=>`<div class="muted" style="font-size:11px;margin-top:6px;text-transform:uppercase">${names[b]}</div>`+ls.map(l=>`<div class="list-item"><span>${esc(l.name)}<br><span class="muted" style="font-size:12px">${lineDetail(l)}${l.discountPct?` · ${l.discountPct}% off`:''}</span></span><b>${fmt(l.total)}</b></div>`).join('')).join('')}
      <button class="btn sm" style="margin-top:8px" onclick="openSession(${s.id})">Edit bill</button></div>
    <div class="section-title">Invoice Details</div>
    <div class="card">
      <div class="grid2"><div><label>Invoice date</label><input type="date" value="${f.date}" onchange="ck('date',this.value)"></div>
      <div><label>Terms</label><select onchange="ck('terms',this.value)">${Object.keys(DUE_TERMS).map(k=>`<option ${k===f.terms?'selected':''}>${k}</option>`).join('')}</select></div></div>
      <div class="grid2"><div><label>Due date</label><div id="ckDue" style="padding:12px 0">${addDaysStr(f.date, DUE_TERMS[f.terms]||0)}</div></div>
      <div><label>Invoice number</label><div style="padding:12px 0"><b>${nextNo}</b><br><span class="muted" style="font-size:10px">assigned when finalized</span></div></div></div>
      <div class="grid2"><div><label>Order number (optional)</label><input value="${esc(f.orderNo)}" oninput="ck('orderNo',this.value)"></div>
      <div><label>Salesperson</label><input value="${esc(f.salesperson)}" oninput="ck('salesperson',this.value)"></div></div>
      <label>Subject / notes (optional)</label><input value="${esc(f.subject)}" oninput="ck('subject',this.value)">
      <label>Discount % — applies to gaming lines only, never food ${can('discount')?'':'<span class="muted">(needs permission)</span>'}</label>
      <input type="number" min="0" max="100" value="${f.discountPct}" ${can('discount')?'':'disabled'} oninput="ck('discountPct',this.value)">
    </div>
    <div class="section-title">Payment</div>
    <div class="card">
      <div id="ckPays">${ckPayRowsHtml()}</div>
      <div class="muted" style="font-size:11px;margin:4px 0">Pay in full:</div>
      <div>${PAY_METHODS.map(m=>`<span class="chip" onclick="ckPayFull('${m}')">${m}</span>`).join('')}</div>
      <button class="btn sm" style="margin-top:6px" onclick="ckAddPay('Cash')">+ Add split payment</button>
    </div>
    <div class="card" id="ckSummary">${ckSummaryHtml()}</div>
    <div class="footbar"><div class="inner"><div class="sum"><b id="ckFootTotal">${fmt(ckTotals().grand)}</b><div class="muted" style="font-size:11px" id="ckFootBal">${open.length?'End running segments first':'Balance due '+fmt(ckTotals().grand-ckPaid())}</div></div><button class="btn primary" id="ckFinalize" ${open.length?'disabled':''} onclick="finalizeCheckout()">Finalize Invoice</button></div></div>`;
}
async function finalizeCheckout(){
  if(state.finalizing) return; state.finalizing=true;
  const btn=document.getElementById('ckFinalize'); if(btn){ btn.disabled=true; btn.style.opacity='.5'; }
  try{
    const f=state.ckForm; const s=await dbGet('bsessions', f.sid);
    const t = billTotals(s.lines, f.discountPct, state.settings); const paid = ckPaid();
    if(t.grand-paid>0 && !(await askConfirm(`Balance of ${fmt(t.grand-paid)} will remain due on this invoice. Finalize anyway?`))) throw {silent:true};
    const inv = await finalizeSessionCore(f);
    state.ckForm=null; state.ckSession=null; state.invoiceId=inv.id;
    go('dashboard'); showInvoiceDone(inv);
  }catch(e){ if(!e.silent) tell(e.message||String(e)); }
  finally{ state.finalizing=false; const b=document.getElementById('ckFinalize'); if(b){ b.disabled=false; b.style.opacity='1'; } }
}
async function dbLogInv(p, qty, reason, ref, date){
  try{ await createRecord('inventoryTx', { productId:p.id, name:p.name, qty, reason, ref:ref||'', stockAfter:p.stock, date:date||Date.now() }); }catch(e){ console.error('inventory log failed', e); }
}
/* The ONE place an invoice is created. Used by checkout and by demo data. */
async function finalizeSessionCore(f, opts){
  opts = opts||{};
  const s = await dbGet('bsessions', f.sid);
  if(!s) throw new Error('Session not found.');
  if(!isOpenStatus(s.status) || s.invoiceId) throw new Error(`This session is already ${STATUS_LABEL[s.status]||'billed'} — it can't be invoiced twice.`);
  if(!s.lines.length) throw new Error('Add at least one line before finalizing.');
  const settings = (await dbGet('settings','main')) || state.settings;
  const mobRaw=(f.mobile||'').trim(); const mob = mobRaw ? normMobile(mobRaw) : '';
  if(mobRaw && !mob) throw new Error('Enter a valid 10-digit Indian mobile number, or leave it blank.');
  const name=(f.name||'').trim();
  const date = opts.date || Date.now();
  const stillOpen = openGamingLines(s);
  if(stillOpen.length) throw new Error(`End ${stillOpen.length} gaming segment${stillOpen.length>1?'s':''} before finalizing (${stillOpen.map(l=>gamingTitle(l)).join(', ')}). Each segment is billed for its own confirmed duration, not for the time until the invoice is finalized.`);
  const t = billTotals(s.lines, f.discountPct, settings);
  const payments = (f.payments||[]).map(p=>({ method:p.method, amount:Math.round(Number(p.amount)||0), date })).filter(p=>p.amount>0);
  const paid = payments.reduce((a,p)=>a+p.amount,0);
  if(paid>t.grand) throw new Error(`Payments (${fmt(paid)}) are more than the invoice total (${fmt(t.grand)}).`);
  const n = await dbIncrement('settings','main','nextInvoiceNo');
  state.settings.nextInvoiceNo = n+1;
  const number = (settings.invoicePrefix||'LVL-INV-') + String(n).padStart(6,'0');
  const invDate = f.date || ymd(date);
  const lines = s.lines.map(l=>JSON.parse(JSON.stringify(l)));
  const gl = lines.filter(l=>l.kind==='gaming');
  const inv = { number, date, invoiceDate:invDate, dueTerms:f.terms||'Due on receipt', dueDate:addDaysStr(invDate, DUE_TERMS[f.terms]||0),
    orderNo:f.orderNo||'', salesperson:f.salesperson||'', subject:f.subject||'', notes:f.notes||'',
    sessionId:s.id, sessionCode:sesCode(s), groupName:s.groupName||'', customerName:name||'Walk-in Customer', customerMobile:mob,
    lines, gamingAmount:t.gaming, accompanyAmount:t.accompany, overtimeAmount:t.overtime, foodAmount:t.food, otherAmount:t.other,
    subtotal:t.subtotal, discountPercent:t.discountPct, discount:t.discount, tax:t.tax, taxLabel:settings.taxEnabled?`${settings.taxLabel||'Tax'} ${settings.taxRate}%`:'',
    grandTotal:t.grand, payments, adjustments:[], paymentMethod:payments.map(p=>p.method).join(' + ')||'Unpaid',
    durationMins:gl.reduce((a,l)=>a+l.minutes,0), status:'finalized' };
  inv.status = invoiceBalance(inv)<=0 ? 'paid' : 'finalized';
  const fresh = await dbGet('bsessions', f.sid);
  if(!fresh || fresh.updatedAt!==s.updatedAt) throw new Error('This session was changed (possibly on another device) while you were checking out. Go back, review the bill, and finalize again.');
  await createRecord('invoices', inv);
  // Mark the session billed immediately so a retry/double-tap can never create a second invoice.
  await mutateSession(f.sid, d=>{ if(d.invoiceId) throw new Error('This session already has an invoice.'); d.status=inv.status; d.invoiceId=inv.id; d.invoiceNumber=number; d.finalizedAt=date; return true; });
  const soft = async (fn)=>{ try{ await fn(); }catch(e){ console.error('post-invoice step failed', e); } };
  await soft(async()=>{
    if(!mob) return;
    const nowIso = new Date(date).toISOString();
    let c = await dbGet('customers', mob);
    if(!c) c = { mobile:mob, name:name||'Walk-in Customer', email:'', address:'', joined:nowIso, visits:0, gamingSessions:0, gamingHours:0, gamingSpend:0, foodSpend:0, totalSpend:0, lastVisit:nowIso, invoiceIds:[] };
    if(name) c.name=name;
    c.visits+=1; c.gamingSessions+=gl.length; c.gamingHours+=inv.durationMins/60;
    c.gamingSpend+=t.gaming+t.accompany+t.overtime; c.foodSpend+=t.food; c.totalSpend+=t.grand; c.lastVisit=nowIso; c.invoiceIds.push(inv.id);
    await dbPut('customers', c);
  });
  await soft(async()=>{
    const names = [];
    for(const l of lines){ if(l.kind==='item' && l.itemId){ const p=await dbGet('products', l.itemId); if(isTracked(p)){ p.stock=Math.max(0,p.stock-l.qty); await dbPut('products',p); await dbLogInv(p,-l.qty,'sale',number,date); } }
      if(l.included) l.included.forEach(b=>names.push(b)); }
    if(names.length){ const prods=await dbAll('products'); for(const b of names){ const p=prods.find(x=>x.name===b && isTracked(x)); if(p){ const fresh=await dbGet('products',p.id); fresh.stock=Math.max(0,fresh.stock-1); await dbPut('products',fresh); await dbLogInv(fresh,-1,'combo drink',number,date); } } }
  });
  await soft(async()=>{ for(const p of payments) await creditAccount(p.method, p.amount); });
  await soft(async()=>{ await updateDailyRecord(dateKey(date)); });
  return inv;
}

/* ============ Invoices ============ */
function invoicePaid(inv){ if(!inv.payments) return inv.grandTotal; return inv.payments.reduce((s,p)=>s+p.amount,0); }
function invoiceCredits(inv){ return (inv.adjustments||[]).filter(a=>a.type==='credit').reduce((s,a)=>s+a.amount,0); }
function invoiceBalance(inv){ return Math.round(inv.grandTotal - invoiceCredits(inv) - invoicePaid(inv)); }
function invoiceStatusPill(inv){ const b=invoiceBalance(inv); return b<=0 ? '<span class="pill green">Paid</span>' : '<span class="pill amber">Due '+fmt(b)+'</span>'; }
function invoiceSegments(inv){   // gaming segments, for reports — understands every invoice shape ever produced
  if(inv.lines) return inv.lines.filter(l=>l.kind==='gaming').map(l=>({ console:l.setupLabel||l.console||l.name, tv:l.tv||'', players:l.players, durationMins:l.minutes, charge:l.total }));
  if(inv.segments && inv.segments.length) return inv.segments;
  if(inv.console) return [{ console:inv.console, tv:inv.tv, players:inv.players, durationMins:inv.durationMins, charge:inv.gamingAmount }];
  return [];
}
function invoiceFoodItems(inv){
  if(inv.lines) return inv.lines.filter(l=>l.bucket==='food').map(l=>({ name:l.name, qty:l.qty }));
  return (inv.items||[]).map(i=>({ name:i.name, qty:i.qty }));
}
function lineText(l){
  if(l.kind==='gaming') return `${gamingTitle(l)} · ${fmtDur(l.minutes)}${l.physicalName?' · '+l.physicalName:''}`;
  if(l.kind==='accompany') return `Accompanying × ${l.qty} · ${fmtDur(l.minutes)}${l.free?' (free)':''}`;
  if(l.kind==='overtime') return `${l.name} × ${l.qty} ${l.unit||''}`.trim();
  return `${l.name} × ${l.qty}${l.included&&l.included.length?' ('+l.included.join(' + ')+')':''}`;
}
function invoiceLines(inv){   // normalized [{bucket,text,amount}]
  if(inv.lines) return inv.lines.map(l=>({ bucket:l.bucket, text:lineText(l)+(l.discountPct?` (-${l.discountPct}%)`:''), amount:l.total }));
  const out = invoiceSegments(inv).map(sg=>({ bucket:'gaming', text:`${sg.console} ${sg.tv||''} · ${sg.players}P · ${fmtDur(sg.durationMins)}`.replace('  ',' '), amount:sg.charge }));
  (inv.items||[]).forEach(i=>out.push({ bucket:'food', text:`${i.name} × ${i.qty}`, amount:i.price*i.qty }));
  if(inv.accompanyAmount) out.push({ bucket:'accompany', text:`Accompanying × ${inv.accompanyCount||''}`, amount:inv.accompanyAmount });
  return out;
}
const BUCKET_TITLE = { gaming:'🎮 GAMING', accompany:'👥 ACCOMPANYING PERSONS', overtime:'⏱ OVERTIME', food:'🍟 FOOD & BEVERAGES', other:'🛍 OTHER' };
function invoiceText(inv){
  const st = state.settings; const L = invoiceLines(inv);
  const out = [`🎮 ${st.businessName}`, '', `Invoice: ${inv.number}`, `Date: ${new Date(inv.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}`, `Customer: ${inv.customerName}${inv.customerMobile?' ('+inv.customerMobile+')':''}`];
  ['gaming','accompany','overtime','food','other'].forEach(b=>{ const ls=L.filter(x=>x.bucket===b); if(!ls.length) return; out.push('', BUCKET_TITLE[b]); ls.forEach(x=>out.push(`${x.text} — ${fmt(x.amount)}`)); });
  out.push('', `Subtotal: ${fmt(inv.subtotal)}`);
  if(inv.discount) out.push(`Discount${inv.discountPercent?' ('+inv.discountPercent+'% on gaming)':''}: -${fmt(inv.discount)}`);
  if(inv.tax) out.push(`${inv.taxLabel||'Tax'}: ${fmt(inv.tax)}`);
  out.push(`TOTAL: ${fmt(inv.grandTotal)}`);
  const pays = (inv.payments||[]).filter(p=>p.amount>0).map(p=>`${p.method} ${fmt(p.amount)}`);
  if(inv.payments) out.push(`Paid: ${pays.join(' + ')||fmt(0)}`, `Balance due: ${fmt(Math.max(0,invoiceBalance(inv)))}`); else out.push(`Payment: ${inv.paymentMethod}`);
  out.push('', st.footer||''); return out.join('\n');
}
function pdfSafe(t){ return String(t).replace(/₹/g,'Rs.').replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[·×]/g,m=>m==='×'?'x':'-').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').replace(/([\\()])/g,'\\$1'); }
function buildPdf(lines){
  const per=54, pages=[]; for(let i=0;i<lines.length;i+=per) pages.push(lines.slice(i,i+per)); if(!pages.length) pages.push(['']);
  const objs=[]; objs[1]='<< /Type /Catalog /Pages 2 0 R >>'; objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>';
  let n=4; const kids=[];
  pages.forEach(pg=>{ const pid=n++, cid=n++; kids.push(pid+' 0 R');
    let st='BT /F1 10 Tf 40 802 Td 14 TL\n'; pg.forEach(l=>{ st+='('+pdfSafe(l)+') Tj T*\n'; }); st+='ET';
    objs[pid]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${cid} 0 R >>`;
    objs[cid]=`<< /Length ${st.length} >>\nstream\n${st}\nendstream`; });
  objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n'; const off=[];
  for(let i=1;i<n;i++){ off[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
  const x=out.length; out+=`xref\n0 ${n}\n0000000000 65535 f \n`; for(let i=1;i<n;i++) out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out],{type:'application/pdf'});
}
function invoicePdfLines(inv){
  const st=state.settings, W=62; const row=(a,b)=>{ const r=String(b); const room=W-r.length-1; const out=[]; let t=String(a);
    do{ const chunk=t.slice(0,room); t=t.slice(room); out.push(out.length? '  '+chunk : chunk.padEnd(room)+' '+r); }while(t.length); if(out.length>1){ const first=out.shift(); out.unshift(first); } return out; };
  const rule='-'.repeat(W); const o=[st.businessName, st.address||'', (st.phone?'Phone: '+st.phone:'')+(st.gstin?'  GSTIN: '+st.gstin:''), rule,
    `INVOICE ${inv.number}`, `Date: ${new Date(inv.date).toLocaleDateString('en-IN')}   Due: ${inv.dueDate||'on receipt'}`, `Customer: ${inv.customerName}${inv.customerMobile?'  ('+inv.customerMobile+')':''}`];
  if(inv.sessionCode) o.push(`Session: ${inv.sessionCode}${inv.groupName?'  Group: '+inv.groupName:''}`);
  o.push(rule); const L=invoiceLines(inv);

async function confirmCreditRefund(id){
  const inv = await dbGet('invoices', id); const type=document.getElementById('crType').value; const amt=Math.round(Number(document.getElementById('crAmt').value)); const reason=document.getElementById('crReason').value.trim(); const method=document.getElementById('crMethod').value;
  if(!(amt>0)){ tell('Enter an amount greater than zero.'); return; } if(!reason){ tell('Please enter a reason — it is kept in the audit trail.'); return; }
  inv.adjustments = inv.adjustments||[]; inv.payments = inv.payments||[];
  if(type==='credit'){ const room = inv.grandTotal - invoiceCredits(inv); if(amt>room){ tell(`A credit note can be at most ${fmt(room)}.`); return; } }
  else { const refundable = invoicePaid(inv) - Math.max(0, inv.grandTotal - invoiceCredits(inv)); if(amt>refundable){ tell(`Only ${fmt(Math.max(0,refundable))} can be refunded (money paid beyond what is owed). Issue a credit note first if the customer is owed money.`); return; } }
  inv.adjustments.push({ type, amount:amt, reason, date:Date.now(), by:isAdmin()?'Admin':'Staff' });
  if(type==='refund'){ inv.payments.push({ method, amount:-amt, date:Date.now(), type:'refund', reason }); await debitAccount(method, amt); }
  inv.status = invoiceBalance(inv)<=0?'paid':'finalized';
  await dbPut('invoices', inv); await syncSessionStatusForInvoice(inv); closeModal(); showToast('Saved to the invoice audit trail'); render();
}

async function addExpense(){
  const category = document.getElementById('expCat').value;
  const desc = document.getElementById('expDesc').value;
  const amount = Number(document.getElementById('expAmt').value);
  const payMethod = document.getElementById('expPay').value;
  const recurring = document.getElementById('expRecurring').checked;
  if(!amount) return tell('Enter a valid amount.');
  if(recurring){
    const freq = document.getElementById('expFreq').value;
    const next = new Date(); if(freq==='Monthly') next.setMonth(next.getMonth()+1); else next.setDate(next.getDate()+7);
    await dbPut('expenses', { category, desc, amount, frequency:freq, isTemplate:true, nextDue: next.getTime(), date: Date.now() });
  } else {
    await dbPut('expenses', { category, desc, amount, date:Date.now(), payMethod });
    await debitAccount(payMethod, amount);
    await updateDailyRecord(dateKey(Date.now()));
  }
  render();
}
async function logRecurring(templateId){
  const t = await dbGet('expenses', templateId);
  await dbPut('expenses', { category:t.category, desc:t.desc+' (recurring)', amount:t.amount, date:Date.now(), payMethod:'Cash' });
  await debitAccount('Cash', t.amount);
  const next = new Date(t.nextDue); if(t.frequency==='Monthly') next.setMonth(next.getMonth()+1); else next.setDate(next.getDate()+7);
  t.nextDue = next.getTime(); await dbPut('expenses', t);
  await updateDailyRecord(dateKey(Date.now()));
  render();
}

async function confirmPurchaseLine(){

  const p = await dbGet('products', pid);
  const qty = Number(document.getElementById('lineQty').value)||1;

async function savePurchase(){
  if(!purchaseCart.length) return tell('Add at least one item.');
  const vendorId = Number(document.getElementById('pVendor').value);
  const invoiceNo = document.getElementById('pInvNo').value || ('PUR-'+Date.now());
  const tax = Number(document.getElementById('pTax').value)||0;
  const paymentStatus = document.getElementById('pStatus').value;
  const payMethod = document.getElementById('pPayMethod').value;
  const subtotal = purchaseCart.reduce((s,i)=>s+i.qty*i.rate,0);
  const total = subtotal + subtotal*tax/100;
  for(const item of purchaseCart){ const p = await dbGet('products', item.productId); p.stock += item.qty; await dbPut('products', p); await dbLogInv(p, item.qty, 'purchase', invoiceNo, Date.now()); }
  await dbPut('purchases', { vendorId, invoiceNo, date:Date.now(), items:purchaseCart, subtotal, tax, total, paymentStatus });
  if(paymentStatus==='Paid') await debitAccount(payMethod, total);
  purchaseCart = [];
  render();
}

async function screenReports(){
  const range = state.reportRange;
  const invoicesAll = await dbAll('invoices');
  const expensesAll = (await dbAll('expenses')).filter(e=>!e.isTemplate);
  const invoices = invoicesAll.filter(i=>inRange(i.date, range, state.reportStart, state.reportEnd));
  const expenses = expensesAll.filter(e=>inRange(e.date, range, state.reportStart, state.reportEnd));
  const salesTotal = invoices.reduce((s,i)=>s+i.grandTotal,0);
  const expTotal = expenses.reduce((s,e)=>s+e.amount,0);
  const gamingRev = invoices.reduce((s,i)=>s+(i.gamingAmount||0)+(i.accompanyAmount||0)+(i.overtimeAmount||0),0);
  const foodRev = invoices.reduce((s,i)=>s+i.foodAmount,0);
  const netProfit = salesTotal - expTotal;

  const expByCat = {}; expenses.forEach(e=>{ expByCat[e.category]=(expByCat[e.category]||0)+e.amount; });
  const consoleRev = {}; invoices.forEach(i=>{ invoiceSegments(i).forEach(sg=>{ consoleRev[sg.console]=(consoleRev[sg.console]||0)+sg.charge; }); });
  const playerRev = {}; invoices.forEach(i=>{ invoiceSegments(i).forEach(sg=>{ playerRev[sg.players+'P']=(playerRev[sg.players+'P']||0)+sg.charge; }); });
  const gamingHours = invoices.reduce((s,i)=>s+invoiceSegments(i).reduce((a,sg)=>a+(sg.durationMins||0),0),0)/60;

  const foodQty = {}; invoices.forEach(i=>invoiceFoodItems(i).forEach(it=>{ foodQty[it.name]=(foodQty[it.name]||0)+it.qty; }));
  const bestSellers = Object.entries(foodQty).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const products = await dbAll('products');
  const invValue = products.filter(isTracked).reduce((s,p)=>s+p.stock*p.price,0);
  const lowStock = products.filter(p=>isTracked(p) && p.stock<=p.min);

  const bar = (obj, total)=>Object.entries(obj).map(([k,v])=>`<div class="bar-row"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${k}</span><span>${fmt(v)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${total?Math.round(v/total*100):0}%"></div></div></div>`).join('');

  const dailyRecords = (await dbAll('dailyRecords')).sort((a,b)=>b.date.localeCompare(a.date));
  const monthly = aggregateDaily(dailyRecords, r=>monthKey(r.date), 12);
  const weekly = aggregateDaily(dailyRecords, r=>weekKey(r.date), 12);
  const periodBars = (periods)=>{
    if(!periods.length) return '<div class="muted">Not enough history yet — this fills in as you record sales and expenses each day.</div>';
    const max = Math.max(1, ...periods.map(p=>Math.max(p.sales,p.expenses)));
    return periods.map(p=>`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px"><b>${p.key}</b><span>Income ${fmt(p.sales)} · Expense ${fmt(p.expenses)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(p.sales/max*100)}%;background:var(--green)"></div></div>
      <div class="bar-track" style="margin-top:3px"><div class="bar-fill" style="width:${Math.round(p.expenses/max*100)}%;background:var(--red)"></div></div>
    </div>`).join('');
  };
  const revenueBars = (periods)=>{
    if(!periods.length) return '<div class="muted">No revenue history yet.</div>';
    const max = Math.max(1, ...periods.map(p=>p.sales));
    return periods.map(p=>`<div class="bar-row"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${p.key}</span><span>${fmt(p.sales)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(p.sales/max*100)}%"></div></div></div>`).join('');
  };

  return `<h2>Reports</h2>
  <div style="margin-bottom:10px">
    ${['today','week','month','custom'].map(r=>`<span class="chip ${range===r?'sel':''}" onclick="setReportRange('${r}')">${r[0].toUpperCase()+r.slice(1)}</span>`).join('')}
  </div>
  ${range==='custom'?`<div class="card"><label>Start</label><input type="date" id="rStart" onchange="setCustomRange()"><label>End</label><input type="date" id="rEnd" onchange="setCustomRange()"></div>`:''}

  <div class="section-title">Sales Report</div>
  <div class="grid2">
    <div class="stat"><div class="v">${fmt(salesTotal)}</div><div class="l">Total Sales</div></div>
    <div class="stat"><div class="v">${invoices.length}</div><div class="l">Invoices</div></div>
  </div>

  <div class="section-title">Profit & Loss</div>
  <div class="card"><table>
    <tr><td>Revenue</td><td class="right">${fmt(salesTotal)}</td></tr>
    <tr><td>Expenses</td><td class="right">-${fmt(expTotal)}</td></tr>
    <tr class="total-row"><td>Net Profit</td><td class="right">${fmt(netProfit)}</td></tr>
  </table></div>

  <div class="section-title">Monthly Income vs Expense</div>
  <div class="card">${periodBars(monthly)}</div>

  <div class="section-title">Weekly Revenue</div>
  <div class="card">${revenueBars(weekly)}</div>

  <div class="section-title">Monthly Revenue</div>
  <div class="card">${revenueBars(monthly)}</div>

  <div class="section-title">Expense Report</div>
  <div class="card">${Object.keys(expByCat).length?bar(expByCat, expTotal):'<div class="muted">No expenses in this range.</div>'}</div>

  <div class="section-title">Gaming Report</div>
  <div class="card">
    <div class="grid2" style="margin-bottom:10px">
      <div class="stat"><div class="v">${invoices.length}</div><div class="l">Sessions Billed</div></div>
      <div class="stat"><div class="v">${gamingHours.toFixed(1)}h</div><div class="l">Gaming Hours</div></div>
      <div class="stat"><div class="v">${fmt(gamingRev)}</div><div class="l">Gaming Revenue</div></div>
      <div class="stat"><div class="v">${fmt(foodRev)}</div><div class="l">Food Revenue</div></div>
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:4px">Revenue by Console</div>${bar(consoleRev, gamingRev)}
    <div class="muted" style="font-size:12px;margin:10px 0 4px">Revenue by Player Count</div>${bar(playerRev, gamingRev)}
  </div>

  <div class="section-title">Food Report — Best Sellers</div>
  <div class="card">${bestSellers.length? bestSellers.map(([n,q])=>`<div class="list-item"><span>${n}</span><span>${q} sold</span></div>`).join('') : '<div class="muted">No food sales in this range.</div>'}</div>

  <div class="section-title">Inventory Report</div>
  <div class="card"><div class="list-item"><span>Inventory Value</span><span>${fmt(invValue)}</span></div>
  <div class="list-item"><span>Low Stock Items</span><span>${lowStock.length}</span></div></div>

  <div class="section-title">Daily Backup Log</div>
  <div class="card">${dailyRecords.length ? dailyRecords.slice(0,60).map(r=>`
    <div class="list-item"><div><b>${r.date}</b><br><span class="muted">${r.invoiceCount} invoice(s) · ${r.expenseCount||0} expense(s)</span></div>
    <div class="right">${fmt(r.sales)} / -${fmt(r.expenses)}<br><button class="btn sm" style="margin-top:4px" onclick="exportDayDetail('${r.date}')">Export Day</button></div></div>
  `).join('') : '<div class="muted">No daily records yet — these build up automatically as you take payments.</div>'}</div>

  <button class="btn primary" style="margin:12px 0" onclick="exportAllCSV()">Export All Data (CSV)</button>
  `;
}

async function moveSetup(id, dir){
  if(!needAdmin()) return; const sts=(await dbAll('stations')).sort((a,b)=>(a.order||0)-(b.order||0)); const i=sts.findIndex(x=>x.id===id), k=i+dir; if(i<0||k<0||k>=sts.length) return;
  sts.forEach((x,ix)=>{ x.order=ix+1; }); const t=sts[i].order; sts[i].order=sts[k].order; sts[k].order=t;
  await dbPut('stations',sts[i]); await dbPut('stations',sts[k]); render();
}
async function moveVariant(id, n, dir){
  if(!needAdmin()) return; const st=await dbGet('stations',id); const arr=setupPlayers(st); const i=arr.indexOf(n), k=i+dir; if(i<0||k<0||k>=arr.length) return;
  [arr[i],arr[k]]=[arr[k],arr[i]]; st.variantOrder=arr; await dbPut('stations',st); render();
}
async function toggleVariant(id, n){
  if(!needAdmin()) return; const st=await dbGet('stations',id); st.variantOff=st.variantOff||{}; if(st.variantOff[n]) delete st.variantOff[n]; else st.variantOff[n]=true; await dbPut('stations',st); render();

async function saveStation(id){
  if(!needAdmin()) return; const g=x=>document.getElementById(x); const name=g('seName').value.trim(); if(!name){ tell('Enter a name for this setup.'); return; }
  const max=Number(g('seMax').value); const rates={};
  for(let n=1;n<=max;n++){ const h=Number(g(`seR${n}h`).value), f=Number(g(`seR${n}f`).value); if(!(h>=0)||!(f>=0)||g(`seR${n}h`).value===''){ tell('Enter valid rates for every player count.'); return; } rates[n]=[h,f]; }
  const all = await dbAll('stations'); const st = id ? await dbGet('stations', id) : { code:'ST'+Date.now(), order:Math.max(0,...all.map(x=>x.order||0))+1 };
  Object.assign(st, { label:name, console:g('seConsole').value.trim()||name, tv:g('seTv').value.trim(), type:g('seType').value, active:g('seActive').checked, rates });
  st.category = g('seCat').value.trim() || defaultCategory(st);
  if(st.variantOff) Object.keys(st.variantOff).forEach(k=>{ if(Number(k)>max) delete st.variantOff[k]; });
  if(st.variantOrder) st.variantOrder = st.variantOrder.filter(n=>n<=max);
  await dbPut('stations', st); closeModal(); showToast('Setup saved'); render();
}
async function setupInUse(id){ return (await dbAll('bsessions')).some(x=>isOpenStatus(x.status) && x.lines.some(l=>l.kind==='gaming' && l.stationId===id && l.state!=='ended')); }
async function deleteStation(id){
  if(!needAdmin()) return;

  if(!(await askConfirm('Delete this setup and all its variants? Past invoices keep their own snapshot. To hide it temporarily, edit it and turn Active off instead.','Delete',true))) return;

}

/* ---- Staff permissions ---- */
async function hashPin(p){
  try{ if(window.crypto && crypto.subtle){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lvl:'+p)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  let h=5381; const t='lvl:'+p; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return 'x'+(h>>>0).toString(16);
}
function screenSetPerm(){
  const s=state.settings, pm=s.perm||{}; const row=(k,l)=>`<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="pm_${k}" type="checkbox" style="width:auto" ${pm[k]?'checked':''}> ${l}</label>`;
  return setBack('Staff Permissions') + `<div class="card"><div class="list-item"><span>Current mode</span><b>${isAdmin()?'Admin':'Staff'}</b></div>
    <div class="grid2" style="margin-top:8px"><button class="btn" onclick="switchRole('staff')">Switch to Staff</button><button class="btn primary" onclick="switchRole('admin')">Switch to Admin</button></div>
    <div class="muted" style="font-size:11px;margin-top:6px">${s.adminPinHash?'Admin mode needs the PIN.':'No Admin PIN is set — anyone can switch to Admin. Set a PIN below to protect it.'} This is a convenience lock on this device, not bank-grade security.</div></div>
    <div class="card"><b>What Staff mode may do</b>
      ${row('staffEditPrice','Edit unit prices / rates on bill lines')}${row('staffDiscount','Give line or invoice discounts')}${row('staffCreateItem','Create new items from the picker')}${row('staffDeleteLines','Delete bill lines')}${row('staffCancelSession','Cancel sessions')}${row('staffCredit','Issue credit notes / refunds')}
      <div class="muted" style="font-size:11px">Catalogue, pricing, tax, numbering and business settings always need Admin.</div>
      <label>Set / change Admin PIN (4+ digits)</label><input id="pmPin" type="password" inputmode="numeric" placeholder="leave blank to keep as is">
      <div class="grid2" style="margin-top:8px"><button class="btn primary" onclick="savePerms()">Save</button><button class="btn" onclick="clearPin()">Remove PIN</button></div></div>`;
}
async function switchRole(role){
  if(role==='staff'){ localStorage.setItem('lvl_role','staff'); showToast('Staff mode'); render(); return; }
  const h = state.settings.adminPinHash;
  if(!h){ localStorage.setItem('lvl_role','admin'); showToast('Admin mode'); render(); return; }
  openModal(`<button class="close" onclick="closeModal()">✕</button><h3>Admin PIN</h3><input id="rolePin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn primary" style="margin-top:10px" onclick="confirmAdminPin()">Unlock</button>`);
}
async function confirmAdminPin(){
  const v=document.getElementById('rolePin').value; if((await hashPin(v))!==state.settings.adminPinHash){ tell('Wrong PIN.'); return; }
  localStorage.setItem('lvl_role','admin'); closeModal(); showToast('Admin mode'); render();
}
async function savePerms(){
  if(!needAdmin()) return; const perm={}; ['staffEditPrice','staffDiscount','staffCreateItem','staffDeleteLines','staffCancelSession','staffCredit'].forEach(k=>perm[k]=document.getElementById('pm_'+k).checked);
  const patch={perm}; const pin=document.getElementById('pmPin').value.trim();
  if(pin){ if(!/^\d{4,}$/.test(pin)){ tell('The PIN must be at least 4 digits.'); return; } patch.adminPinHash=await hashPin(pin); }
  await patchSettings(patch); showToast('Permissions saved'); render();
}
async function clearPin(){ if(!needAdmin()) return; await patchSettings({adminPinHash:''}); showToast('PIN removed'); render(); }

/* ============ Backup & Restore ============ */
function screenBackup(){
  return `<button class="btn ghost" style="width:auto;margin-bottom:8px" onclick="go('more')">← Back</button>
  <h2>Backup & Restore</h2>
  <div class="card">
    <button class="btn primary" onclick="doBackup()">Backup Data</button>
    <p class="muted" style="font-size:12px;margin-top:6px">On Android/iPhone this opens your Share menu — pick Google Drive, Files, or email to save it off your phone. If sharing isn't available it downloads the file directly.</p>
    <label style="margin-top:14px">Restore from File</label>
    <input type="file" id="restoreFile" accept=".json">
    <button class="btn" style="margin-top:8px" onclick="doRestore()">Restore Data</button>
    <button class="btn" style="margin-top:14px;border-color:var(--red);color:var(--red)" onclick="doClearAll()">Clear All Data</button>
  </div>
  <div class="card">
    <div class="section-title">Keeping data for years</div>
    <p class="muted" style="font-size:13px">This app stores everything on your phone's browser storage, and it requests "persistent" storage so Android/iOS is less likely to clear it automatically. Even so, no on-device storage is 100% permanent — back up weekly (or daily using the export below) and keep a copy in Google Drive or email so nothing is ever lost.</p>
  </div>`;
}
async function doBackup(){
  const data = {};
  for(const store of ALL_STORES){ data[store] = await dbAll(store); }
  const json = JSON.stringify(data,null,2);
  const d = new Date().toISOString().slice(0,10);
  const filename = `LVL-Books-Backup-${d}.json`;
  const blob = new Blob([json], {type:'application/json'});
  try{
    const file = new File([blob], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'LVL Books Backup', text:`LVL Books backup — ${d}`});
      return;
    }
  }catch(e){ /* user cancelled share or share unsupported — fall back to direct download below */ }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  await recordBackupTime();
}
async function recordBackupTime(){ await patchSettings({ lastBackupAt: Date.now() }); state.showBackupReminder = false; }
async function maybeAutoBackup(){
  const s = state.settings;
  const TWO_WEEKS = 14*24*60*60*1000;
  state.showBackupReminder = !s.lastBackupAt || (Date.now() - s.lastBackupAt) >= TWO_WEEKS;
}
function dismissBackupReminder(){ state.showBackupReminder = false; render(); }
async function doRestore(){
  const file = document.getElementById('restoreFile').files[0];
  if(!file) return tell('Choose a backup file first.');
  if(!(await askConfirm('This will replace all current data. Continue?'))) return;
  const data = JSON.parse(await file.text());
  for(const store of Object.keys(data)){ if(!ALL_STORES.includes(store)) continue; await dbClear(store); for(const row of data[store]){ await dbPut(store, row); } }
  await loadSettingsAndSeed();
  await rebuildDailyRecords();
  tell('Data restored.'); go('dashboard');
}
async function doClearAll(){
  if(!(await askConfirm('This will permanently delete ALL data. Are you sure?'))) return;
  if(!(await askConfirm('Really sure? This cannot be undone.'))) return;
  for(const store of ALL_STORES){ await dbClear(store); }
  liveSessions=[]; await loadSettingsAndSeed(); go('dashboard');
}
