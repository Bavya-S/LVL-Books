async function clearPin(){ if(!needAdmin()) return; await patchSettings({adminPinHash:''}); showToast('PIN removed'); render(); }

/* ============ Backup & Restore ============ */
async function screenBackup(){
  const snap = await recoveryLoad('preRestore');
  const secBtn = Object.entries(BACKUP_SECTIONS).map(([k,[l]])=>`<button class="btn sm" onclick="downloadBackup('${k}')">${l}</button>`).join('');
  return `<button class="btn ghost" style="width:auto;margin-bottom:8px" onclick="goBack('more')">← Back</button>
  <h2>Backup & Restore</h2>
  ${state.restorePending ? `<div class="card" style="border-color:var(--red)"><b>A restore did not finish</b><p class="muted" style="font-size:12px;margin:6px 0">Use “Roll back to snapshot” below to return to the data you had before.</p></div>` : ''}
  ${state.showBackupReminder ? `<div class="card" style="border-color:var(--amber)"><b>Time for your backup</b><p class="muted" style="font-size:12px;margin:6px 0">It's been 2+ weeks since your last backup (or you haven't made one yet).</p></div>` : ''}
  <div class="card">
    <div class="section-title" style="margin-top:0">Back up</div>
    <p style="margin:0 0 10px" id="bkLast">${backupLine()}</p>
    <div class="grid2"><button class="btn primary" onclick="downloadBackup()">Download full backup</button><button class="btn" onclick="shareBackup()">Share / save to Drive</button></div>
    <p class="muted" style="font-size:12px;margin-top:8px">The full file holds everything: customers, sessions, invoices and the archive, memberships, the loyalty &amp; financial ledger, payments, audit history, settings and the data-format (schema) version, with checksums so damage is detected before a restore.</p>
    <div class="muted" style="font-size:11px;margin:10px 0 4px;text-transform:uppercase">Section files (for accounting / reference)</div><div style="display:flex;flex-wrap:wrap;gap:6px">${secBtn}</div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-top:0">Restore</div>
    <label for="restoreFile">Full backup file (.json)</label>
    <input type="file" id="restoreFile" accept=".json,application/json" onchange="previewRestore()">
    <div id="restorePreview" class="muted" style="font-size:13px;margin-top:8px"></div>
    <button class="btn" id="restoreBtn" style="margin-top:8px" onclick="doRestore()" disabled>Restore Data</button>
    <button class="btn" style="margin-top:14px;border-color:var(--red);color:var(--red)" onclick="doClearAll()">Clear All Data</button>
  </div>
  <div class="card"><div class="section-title" style="margin-top:0">Recovery</div>
    ${snap?`<p class="muted" style="font-size:13px;margin:0 0 8px">Safety snapshot saved on this phone before the last restore: <b>${new Date(snap.createdAt).toLocaleString('en-IN')}</b>.</p><div class="grid2"><button class="btn" id="rbBtn" onclick="recoveryRollback()">Roll back to snapshot</button><button class="btn" onclick="recoveryDownload()">Download snapshot</button></div>`:'<p class="muted" style="font-size:13px;margin:0">Before every restore a safety snapshot is saved on this phone and the restore is rolled back automatically if anything fails.</p>'}</div>
  <div class="card">
    <div class="section-title">Keeping data for years</div>
    <p class="muted" style="font-size:13px">LVL Books saves everything on this phone first and syncs to your cloud database whenever there is a signal, so it keeps working offline. Even so, no storage is 100% permanent. Download a backup file every few weeks and keep it somewhere safe, such as Google Drive.</p>
  </div>`;
}
async function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }
async function recordBackupTime(){ await patchSettings({ lastBackupAt: Date.now() }); state.showBackupReminder = false; renderNav(); }
async function maybeAutoBackup(){
  const s = state.settings;
  const TWO_WEEKS = 14*24*60*60*1000;
  state.showBackupReminder = !s.lastBackupAt || (Date.now() - s.lastBackupAt) >= TWO_WEEKS;
}
function dismissBackupReminder(){ state.showBackupReminder = false; renderNav(); render(); }
/* ============ Backup & Restore (v13: sections, schema version, checksums, relationship checks, all-or-nothing restore with rollback) ============ */
const BACKUP_SECTIONS = { customers:['Customers',['customers']], invoices:['Invoices + archive',['invoices','archivedInvoices','deletedInvoices']], memberships:['Memberships',['memberships']], loyalty:['Loyalty & financial ledger',['loyaltyTx','ledger']], payments:['Payment transactions',null], audit:['Audit history',['auditLog']], settings:['Settings & schema version',['settings','accounts']] };
const BACKUP_LABELS = { customers:'Customers', bsessions:'Gaming sessions', invoices:'Invoices', archivedInvoices:'Archived invoices', deletedInvoices:'Deleted invoices (restorable)', products:'Items', stations:'Gaming setups', expenses:'Expenses', purchases:'Purchases', inventoryTx:'Old stock records', vendors:'Vendors', employees:'Employees', employeeTx:'Employee payments', accounts:'Cash & bank', settings:'Settings', memberships:'Memberships', loyaltyTx:'Loyalty transactions', ledger:'Ledger entries', auditLog:'Audit log', dailyRecords:'Daily totals', physical:'Physical stations' };
function fnvHex(s){ return hex8(hash32(s))+hex8(hash32(s,0x9747b28c)); }
async function readStoreFull(store){ try{ return await withTimeout(dbAllFresh(store), 15000); }catch(e){ return await dbAll(store); } }
async function paymentRows(){
  const rows = []; const inv = [...(await readStoreFull('invoices')), ...(await readStoreFull('archivedInvoices'))];
  inv.forEach(i=>(i.payments||(PAY_TO_ACCOUNT[i.paymentMethod]&&i.grandTotal>0?[{method:i.paymentMethod,amount:i.grandTotal,date:i.date}]:[])).forEach((p,k)=>rows.push({ kind:'invoice', invoiceId:i.id, number:i.number, customerId:i.customerId||'', method:p.method, amount:p.amount, date:p.date, n:k })));
  (await readStoreFull('memberships')).forEach(m=>{ if(m.payment) rows.push({ kind:'membership', membershipId:m.id, receipt:m.receiptNo, customerId:m.customerId||'', method:m.payment.method, amount:m.payment.amount, date:m.payment.date }); });
  return rows;
}
async function buildBackup(section){
  const full = !section; const stores = full ? BACKUP_STORES : (BACKUP_SECTIONS[section][1]||[]);
  const data = { __meta:{ app:'LVL Books', format:3, schemaVersion:SCHEMA_VERSION, kind:full?'full':'section', section:section||null, createdAt:Date.now(), counts:{}, checksums:{} } };
  for(const store of stores){ const rows = await readStoreFull(store); data[store] = rows; data.__meta.counts[store] = rows.length; data.__meta.checksums[store] = fnvHex(JSON.stringify(rows)); }
  if(section==='payments'){ const rows = await paymentRows(); data.payments = rows; data.__meta.counts.payments = rows.length; data.__meta.checksums.payments = fnvHex(JSON.stringify(rows)); }
  return data;
}
function backupFileName(section){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `LVL-Books-${section?'Section-'+section+'-':'Backup-'}${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; }
function saveBlobFile(data, name){ const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); }
async function downloadBackup(section){
  try{ const data = await buildBackup(section); saveBlobFile(data, backupFileName(section)); if(!section){ await recordBackupTime(); } showToast(section?'Section file downloaded':'Backup file downloaded'); if(state.screen==='backup') render(); }
  catch(e){ console.error(e); tell('Backup failed: '+(e && e.message ? e.message : e)); }
}
async function shareBackup(){
  try{
    const data = await buildBackup(); const name = backupFileName(); const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'}); const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'LVL Books Backup', text:'LVL Books backup'}); await recordBackupTime(); showToast('Backup shared'); if(state.screen==='backup') render(); return; }
      catch(e){ if(e && e.name==='AbortError') return; }
    }
    saveBlobFile(data, name); await recordBackupTime(); showToast('Backup file downloaded'); if(state.screen==='backup') render();
  }catch(e){ console.error(e); tell('Backup failed: '+(e && e.message ? e.message : e)); }
}
/* In-memory upgrade of an older (v12 or earlier) file so it passes the same checks and restores with customer IDs. */
function upgradeBackupData(d){
  const ver = Number(d.__meta && d.__meta.schemaVersion)||0; if(ver>=SCHEMA_VERSION) return d;
  const byMob = {}; (d.customers||[]).forEach(c=>{ if(!c.cid) c.cid = cidForMobile(c.mobile); byMob[c.mobile] = c.cid; });
  const link = (s,f)=>(d[s]||[]).forEach(r=>{ if(!r.customerId && r[f] && byMob[r[f]]) r.customerId = byMob[r[f]]; });
  link('memberships','mobile'); link('loyaltyTx','mobile'); link('invoices','customerMobile'); link('deletedInvoices','customerMobile');
  return d;
}
/* Everything is checked BEFORE anything is touched. errors block the restore; warnings are shown. */
function backupDeepCheck(d){
  const errors = [], warnings = []; const rows = s=>Array.isArray(d[s])?d[s]:[]; const meta = d.__meta||{};
  if(Number(meta.schemaVersion)>SCHEMA_VERSION) errors.push(`This file was made by a newer version of LVL Books (schema ${meta.schemaVersion}). Update the app first.`);
  if(meta.kind==='section') errors.push('This is a partial (section) file for reference or accounting. Restoring only needs a FULL backup, so a half-restore can never break balances.');
  if(meta.checksums) for(const s of Object.keys(meta.checksums)){ const have = s==='payments'?d.payments:d[s]; if(Array.isArray(have) && fnvHex(JSON.stringify(have))!==meta.checksums[s]) errors.push(`The “${s}” section does not match its checksum — the file was edited or damaged.`); }
  for(const s of BACKUP_STORES){ if(!Array.isArray(d[s])) continue; const kp = KEYPATH[s]||'id'; const seen = new Set(), dups = []; d[s].forEach(r=>{ const k = String(r[kp]); if(seen.has(k)) dups.push(k); seen.add(k); }); if(dups.length) errors.push(`Duplicate ${s==='ledger'?'transaction':'record'} IDs in “${s}”: ${dups.slice(0,5).join(', ')}${dups.length>5?' …':''}`); }
  const nums = {}; [...rows('invoices'), ...rows('archivedInvoices')].forEach(i=>{ (nums[i.number]=nums[i.number]||new Set()).add(i.id); }); const dn = Object.entries(nums).filter(([,s])=>s.size>1).map(([n])=>n); if(dn.length) errors.push(`Duplicate invoice numbers: ${dn.slice(0,5).join(', ')}`);
  const aIds = new Set(rows('archivedInvoices').map(i=>i.id)); const both = rows('invoices').filter(i=>aIds.has(i.id)).map(i=>i.number); if(both.length) errors.push(`Invoices present both as active and archived: ${both.slice(0,5).join(', ')}`);
  const cids = new Set(rows('customers').map(c=>c.cid).filter(Boolean)), mobs = new Set(rows('customers').map(c=>c.mobile)); const dc = rows('customers').filter(c=>c.cid); if(new Set(dc.map(c=>c.cid)).size!==dc.length) errors.push('Two customers share the same customer ID.');
  const custOk = r=>r.customerId ? cids.has(r.customerId) : mobs.has(r.mobile||r.customerMobile);
  const mm = rows('memberships').filter(m=>!custOk(m)).map(m=>m.receiptNo||m.id); if(mm.length) errors.push(`${mm.length} membership(s) belong to a customer that is not in the file: ${mm.slice(0,4).join(', ')}`);
  const lm = rows('loyaltyTx').filter(t=>!custOk(t)).map(t=>t.id); if(lm.length) errors.push(`${lm.length} loyalty transaction(s) belong to a customer that is not in the file: ${lm.slice(0,4).join(', ')}`);
  const im = [...rows('invoices'),...rows('archivedInvoices')].filter(i=>i.customerMobile && !custOk(i)).map(i=>i.number); if(im.length) warnings.push(`${im.length} invoice(s) refer to customers not in the file: ${im.slice(0,4).join(', ')}`);
  const known = new Set([...rows('invoices'),...rows('archivedInvoices'),...rows('deletedInvoices')].map(i=>i.id)); rows('ledger').filter(l=>l.type==='invoice_purge').forEach(l=>known.add(l.invoiceId));
  const lr = rows('loyaltyTx').filter(t=>t.invoiceId && !known.has(t.invoiceId)).length + rows('ledger').filter(l=>l.invoiceId && !known.has(l.invoiceId)).length; if(lr) warnings.push(`${lr} loyalty/ledger row(s) refer to invoices that are not in the file. Run the Data Integrity Check after restoring.`);
  return { errors, warnings };
}
function validateBackup(obj){
  if(!obj || typeof obj!=='object' || Array.isArray(obj)) return { ok:false, error:'This file is not an LVL Books backup.' };
  const counts = {}; let known = 0;
  for(const store of BACKUP_STORES){
    if(obj[store]===undefined) continue;
    if(!Array.isArray(obj[store])) return { ok:false, error:`The “${store}” section of this file is damaged.` };
    const kp = KEYPATH[store] || 'id';
    if(obj[store].some(r=>!r || typeof r!=='object' || r[kp]===undefined || r[kp]===null)) return { ok:false, error:`Some records in “${store}” are damaged (missing ${kp}).` };
    counts[store] = obj[store].length; known++;
  }
  if(!known) return { ok:false, error:'No LVL Books data was found in this file.' };
  const wasOld = !(obj.__meta && obj.__meta.schemaVersion>=SCHEMA_VERSION); upgradeBackupData(obj);
  const deep = backupDeepCheck(obj); if(deep.errors.length) return { ok:false, error:deep.errors.join('\n'), warnings:deep.warnings };
  return { ok:true, data:obj, counts, when:(obj.__meta && obj.__meta.createdAt) || null, warnings:deep.warnings, upgraded:wasOld, schema:(obj.__meta&&obj.__meta.schemaVersion)||2 };
}
async function previewRestore(){
  const box = document.getElementById('restorePreview'), btn = document.getElementById('restoreBtn'); window.__restore = null; btn.disabled = true;
  const file = document.getElementById('restoreFile').files[0]; if(!file){ box.textContent=''; return; }
  try{
    const v = validateBackup(JSON.parse(await file.text()));
    if(!v.ok){ box.innerHTML = `<span style="color:var(--red)">${esc(v.error).replace(/\n/g,'<br>')}</span>`; return; }
    window.__restore = v; btn.disabled = false;
    box.innerHTML = `<b style="color:var(--green,inherit)">Valid backup — all checks passed</b>${v.when?` · made ${new Date(v.when).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})}`:''}${v.upgraded?` · older format (v${v.schema}) will be upgraded`:''}<br>` +
      Object.keys(BACKUP_LABELS).filter(k=>v.counts[k]!==undefined).map(k=>`${BACKUP_LABELS[k]}: ${v.counts[k]}`).join(' · ') + (v.warnings&&v.warnings.length?`<br><span style="color:var(--amber)">${v.warnings.map(esc).join('<br>')}</span>`:'');
  }catch(e){ box.innerHTML = `<span style="color:var(--red)">Couldn't read this file — it isn't valid backup data.</span>`; }
}
/* ---- recovery snapshot kept in the phone's IndexedDB (separate from the cloud database) ---- */
function recoveryDb(){ return new Promise((res,rej)=>{ const r = indexedDB.open('lvl-recovery',1); r.onupgradeneeded = ()=>r.result.createObjectStore('snap'); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
async function recoverySave(key, val){ const db = await recoveryDb(); return new Promise((res,rej)=>{ const t = db.transaction('snap','readwrite'); t.objectStore('snap').put(val,key); t.oncomplete = ()=>{ db.close(); res(); }; t.onerror = ()=>rej(t.error); }); }
async function recoveryLoad(key){ try{ const db = await recoveryDb(); return await new Promise((res,rej)=>{ const q = db.transaction('snap').objectStore('snap').get(key); q.onsuccess = ()=>{ db.close(); res(q.result); }; q.onerror = ()=>rej(q.error); }); }catch(e){ return null; } }
/* Safe housekeeping: only temporary data is touched — never a business record. */
async function recoveryDelete(key){ try{ const db = await recoveryDb(); await new Promise(res=>{ const t = db.transaction('snap','readwrite'); t.objectStore('snap').delete(key); t.oncomplete = ()=>{ db.close(); res(); }; t.onerror = ()=>res(); }); }catch(e){} }
async function housekeeping(){
  try{
    const r = await recoveryLoad('pre-cleanup'); if(r && r.when && Date.now()-r.when > 90*864e5) await recoveryDelete('pre-cleanup');   // the downloaded backup file is the long-term copy
    for(const k in __lw) if(Date.now()-__lw[k] > 10000) delete __lw[k];
    for(const st of AUTOINC){ const b = lsGet('lvl_idblk_'+st); if(Array.isArray(b)){ const keep = b.filter(x=>x.end>=x.next); if(keep.length!==b.length) lsSet('lvl_idblk_'+st, keep); } }
  }catch(e){ console.warn('housekeeping', e); }
}
/* Write-first-then-prune: every row of the file is written BEFORE anything not in the file is removed, so at no point is data missing. The ledger is append-only and is only ever added to. */
async function applyDataset(data){
  for(const store of BACKUP_STORES){
    if(data[store]===undefined) continue; const kp = KEYPATH[store]||'id'; const rows = data[store];
    if(store==='ledger'){ const have = new Set((await dbAllFresh('ledger')).map(r=>r.id)); await putMany('ledger', rows.filter(r=>!have.has(r.id))); continue; }
    await putMany(store, rows);
    const keep = new Set(rows.map(r=>String(r[kp]))); const stale = (await dbAllFresh(store)).filter(r=>!keep.has(String(r[kp])));
    for(let i=0;i<stale.length;i+=400) await dbBatch(stale.slice(i,i+400).map(r=>({ del:[store, r[kp]] })));
  }
}
async function verifyDataset(data){
  for(const store of BACKUP_STORES){ if(data[store]===undefined) continue; const n = (await dbAllFresh(store)).length; if(store==='ledger'? n<data[store].length : n!==data[store].length) throw new Error(`Verification failed for ${BACKUP_LABELS[store]||store}: expected ${data[store].length}, found ${n}.`); }
}
async function doRestore(){
  const v = window.__restore; if(!v){ tell('Choose a valid backup file first.'); return; }
  const summary = Object.keys(BACKUP_LABELS).filter(k=>v.counts[k]!==undefined).map(k=>`${BACKUP_LABELS[k]} ${v.counts[k]}`).join(', ');
  if(!(await askConfirm(`Restore this backup${v.when?' from '+new Date(v.when).toLocaleString('en-IN'):''}?\n\nIt replaces current data with: ${summary}.\n\nA safety snapshot of today's data is saved on this phone first, and the restore is rolled back automatically if anything fails. The ledger is never erased — missing entries are added.`,'Restore',true))) return;
  const btn = document.getElementById('restoreBtn'); if(btn){ btn.disabled=true; btn.textContent='Restoring…'; }
  let snap = null;
  try{
    snap = await buildBackup(); await recoverySave('preRestore', { createdAt:Date.now(), data:snap });   // safety net FIRST
    try{ localStorage.setItem('lvl_restore_pending','1'); }catch(e){}
    try{
      await applyDataset(v.data); await verifyDataset(v.data); await reseedCounters(); await loadSettingsAndSeed();
      if(!state.settings.schemaVersion || state.settings.schemaVersion<SCHEMA_VERSION) await runMigrations();
      await rebuildDailyRecords(); await maybeAutoBackup();
      await ledgerPost({ type:'restore', description:`Backup restored (${Object.values(v.counts).reduce((a,b)=>a+b,0)} records)`, reason:'Restore from backup' });
    }catch(e){
      console.error('restore failed — rolling back', e);
      try{ await applyDataset(snap); await verifyDataset(snap); await reseedCounters(); await loadSettingsAndSeed(); try{ localStorage.removeItem('lvl_restore_pending'); }catch(_){} tell('Restore failed and was rolled back — your data is exactly as it was before.\n\nReason: '+(e&&e.message?e.message:e)); }
      catch(e2){ console.error('rollback failed', e2); tell('Restore failed and the automatic rollback could not finish.\n\nYour data is safe in the recovery snapshot on this phone: open Backup & Restore → Recovery and tap “Roll back to snapshot”.'); }
      if(btn){ btn.disabled=false; btn.textContent='Restore Data'; } return;
    }
    try{ localStorage.removeItem('lvl_restore_pending'); }catch(e){}
    window.__restore = null; tell('Data restored and verified.'); go('dashboard');
  }catch(e){ console.error(e); tell('Restore did not start: '+(e&&e.message?e.message:e)+'\nNothing was changed.'); if(btn){ btn.disabled=false; btn.textContent='Restore Data'; } }
}
async function recoveryRollback(){
  const s = await recoveryLoad('preRestore'); if(!s){ tell('No recovery snapshot found on this phone.'); return; }
  if(!(await askConfirm(`Roll back to the snapshot saved ${new Date(s.createdAt).toLocaleString('en-IN')}?`,'Roll back',true))) return;
  try{ await applyDataset(s.data); await verifyDataset(s.data); await reseedCounters(); await loadSettingsAndSeed(); try{ localStorage.removeItem('lvl_restore_pending'); }catch(e){} state.restorePending=false; tell('Rolled back to the snapshot.'); go('dashboard'); }
  catch(e){ tell('Rollback failed: '+(e.message||e)+'\nThe snapshot is still saved — you can download it and try again.'); }
}
async function recoveryDownload(){ const s = await recoveryLoad('preRestore'); if(!s){ tell('No recovery snapshot found.'); return; } saveBlobFile(s.data, 'LVL-Books-Recovery-Snapshot.json'); }
async function reseedCounters(){   // so new invoice / session numbers continue after the restored ones (archived invoices count too)
  const f = fb();
  for(const store of AUTOINC){
    try{
      const rows = await dbAllFresh(store); const kp = KEYPATH[store]||'id'; let max = rows.reduce((m,r)=>Math.max(m, Number(r[kp])||0), 0);
      if(store==='invoices'){ (await dbAllFresh('archivedInvoices')).forEach(r=>{ max = Math.max(max, Number(r.id)||0); }); }
      const ref = f.doc(f.db,'counters',store); const snap = await f.getDoc(ref); const cur = snap.exists() ? (snap.data().n||0) : 0;
      if(max>cur) await writeAck(f.setDoc(ref,{n:max}));
    }catch(e){ console.warn('counter reseed', store, e); }
  }
}
async function doClearAll(){
  if(!(await askConfirm('This will permanently delete ALL data (the append-only ledger is kept). Are you sure?'))) return;
  if(!(await askConfirm('Really sure? This cannot be undone. Download a backup first.'))) return;
  for(const store of BACKUP_STORES){ if(store==='ledger') continue; await dbClear(store); }
  liveSessions=[]; await loadSettingsAndSeed(); go('dashboard');
}
async function screenBackupAsync(){ return screenBackup(); }

boot();
