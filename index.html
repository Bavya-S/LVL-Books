const rnd2 = v=>Math.round((Number(v)||0)*100)/100;
const fdate = ts=>new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fdt = ts=>new Date(ts).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
const fpts = v=>{ v=rnd2(v); return Number.isInteger(v)?String(v):v.toFixed(2); };

/* ---------- Loyalty ---------- */
function loyaltyPointsFor(amount, cfg){ cfg=cfg||loyaltyCfg(); const sp=Number(cfg.spend)||0; if(!(sp>0)||!(amount>0)) return 0; return rnd2(Math.floor(amount/sp)*(Number(cfg.points)||0)); }
function loyaltySummary(txs){
  let earned=0, redeemed=0, expired=0, bal=0;
  txs.forEach(t=>{ bal+=t.points; if(t.type==='earn'||t.type==='reverse_earn') earned+=t.points; else if(t.type==='redeem'||t.type==='reverse_redeem') redeemed-=t.points; else if(t.type==='expire') expired-=t.points; });
  return { earned:rnd2(earned), redeemed:rnd2(redeemed), expired:rnd2(expired), balance:rnd2(bal) };
}
async function loyaltyTxs(mobile){ const a=dbAllRO('loyaltyTx'); return clean(mobile?a.filter(t=>t.mobile===mobile):a).sort((x,y)=>x.ts-y.ts||(x.id-y.id)); }   // only this customer's rows are copied
async function loyaltyExpireSweep(mobile){
  const cfg=loyaltyCfg(); if(!cfg.enabled || !(Number(cfg.expiryDays)>0) || !mobile) return;
  const txs=await loyaltyTxs(mobile), cutoff=Date.now()-cfg.expiryDays*864e5;
  const oldEarn = txs.filter(t=>t.type==='earn'&&t.ts<cutoff).reduce((z,t)=>z+t.points,0);
  const used = txs.filter(t=>t.type==='redeem'||t.type==='expire').reduce((z,t)=>z-t.points,0);
  const due = Math.min(rnd2(oldEarn-used), loyaltySummary(txs).balance);
  if(due>0) await loyaltyPost(mobile,'expire',-due,null,`Points older than ${cfg.expiryDays} days expired`);
}
async function loyaltyAccount(mobile){
  const cfg=loyaltyCfg(); const txs=await loyaltyTxs(mobile); const s=loyaltySummary(txs);
  return Object.assign(s,{ txs, cfg, value:rnd2(s.balance*cfg.rupeePerPoint), lifetimeValue:rnd2(s.earned*cfg.rupeePerPoint) });
}
async function loyaltyPost(mobile, type, points, inv, note, extra){
  extra = extra||{}; const bal = loyaltySummary(await loyaltyTxs(mobile)).balance; const cid = await cidOfMobile(mobile);
  const led = await ledgerPost({ type:'loyalty_'+type, customerId:cid, mobile, invoiceId:inv?inv.id:null, invoiceNumber:inv?inv.number:'', points:rnd2(points), originalRef:extra.originalRef||null, description:note||'', reason:extra.reason||'' });
  return createRecord('loyaltyTx', { ts:Date.now(), mobile, customerId:cid, type, points:rnd2(points), invoiceId:inv?inv.id:null, invoiceNumber:inv?inv.number:'', balanceAfter:rnd2(bal+points), note:note||'', ledgerRef:led.id, originalRef:extra.originalRef||null });

/* Points are earned only when a PAID invoice (nothing owing) is finalised, once per invoice. */
async function loyaltyAward(inv){
  const cfg=loyaltyCfg(); if(!cfg.enabled || !inv || !inv.customerMobile) return null;
  if(invoiceBalance(inv)>0 || !(inv.grandTotal>0)) return null;
  const txs=(await dbAll('loyaltyTx')).filter(t=>t.invoiceId===inv.id && (t.type==='earn'));
  if(txs.length) return null;   // never twice
  const pts=loyaltyPointsFor(inv.grandTotal-invoiceCredits(inv), cfg); if(!(pts>0)) return null;
  return loyaltyPost(await invMobile(inv),'earn',pts,inv,`Earned on ${inv.number} (${fmt(inv.grandTotal)} spent)`);

async function loyaltyReverseForCredit(inv, amount){
  if(!inv.customerMobile) return;
  const mine=(await dbAll('loyaltyTx')).filter(t=>t.invoiceId===inv.id && (t.type==='earn'||t.type==='reverse_earn'));
  const have=mine.reduce((z,t)=>z+t.points,0); if(!(have>0)) return;
  const orig = mine.filter(t=>t.type==='earn').pop();
  const pts=Math.min(have, loyaltyPointsFor(amount)); if(pts>0) await loyaltyPost(await invMobile(inv),'reverse_earn',-pts,inv,`Credit/refund of ${fmt(amount)} on ${inv.number}`,{ originalRef:orig?orig.ledgerRef:null });
}
/* Invoice deletion: put back exactly what THIS invoice took or gave — loyalty points (earned and redeemed), free hours, member discounts —
   and nothing else. Every reversal is a new, linked ledger entry; running it twice changes nothing. Returns a snapshot so Restore can re-apply it. */
async function benefitsReverse(inv){
  const snap={ mobile:await invMobile(inv), earn:0, redeem:0, usage:[], discount:0 };
  if(snap.mobile){
    const mine=(await dbAll('loyaltyTx')).filter(t=>t.invoiceId===inv.id);
    snap.earn = rnd2(mine.filter(t=>t.type==='earn'||t.type==='reverse_earn').reduce((z,t)=>z+t.points,0));
    snap.redeem = rnd2(-mine.filter(t=>t.type==='redeem'||t.type==='reverse_redeem').reduce((z,t)=>z+t.points,0));
    const lastRef = ty=>{ const t=mine.filter(x=>x.type===ty).pop(); return t?t.ledgerRef||null:null; };
    if(snap.earn!==0) await loyaltyPost(snap.mobile,'reverse_earn',-snap.earn,inv,`Invoice ${inv.number} deleted`,{ originalRef:lastRef('earn'), reason:'Invoice deleted' });
    if(snap.redeem!==0) await loyaltyPost(snap.mobile,'reverse_redeem',snap.redeem,inv,`Invoice ${inv.number} deleted — points returned`,{ originalRef:lastRef('redeem'), reason:'Invoice deleted' });
  }
  for(const m of await dbAll('memberships')){
    const hit=(m.usage||[]).filter(u=>u.invoiceId===inv.id && !u.reversed); if(!hit.length) continue;
    for(const u of hit){
      const e = await ledgerPost({ type:'membership_hours_restored', customerId:m.customerId||'', mobile:m.mobile, invoiceId:inv.id, invoiceNumber:inv.number, membershipId:m.id, hours:rnd2(u.minutes/60), originalRef:u.ledgerRef||null, description:`Invoice ${inv.number} deleted — free hours restored`, reason:'Invoice deleted' });
      u.reversed=true; u.reversedNote=`Invoice ${inv.number} deleted`; u.reversalRef=e.id; snap.usage.push({ mid:m.id, uid:u.id });
    }
    await dbPut('memberships', m);
  }
  // member discounts: reverse each ledger entry of this invoice that has not been reversed yet
  let led = []; try{ led = await ledgerQuery('invoiceId', inv.id); }catch(e){ console.warn('ledger lookup failed', e); }
  const done = new Set(led.filter(l=>l.type==='membership_discount_reversed').map(l=>l.originalRef));
  for(const l of led.filter(x=>x.type==='membership_discount' && !done.has(x.id))){
    await ledgerPost({ type:'membership_discount_reversed', customerId:l.customerId, mobile:l.mobile, invoiceId:inv.id, invoiceNumber:inv.number, membershipId:l.membershipId, amount:-l.amount, originalRef:l.id, description:`Invoice ${inv.number} deleted — member discount reversed`, reason:'Invoice deleted' });
    snap.discount = rnd2(snap.discount + l.amount);
  }
  return snap;
}
async function benefitsReapply(inv, snap){
  const mob = (await invMobile(inv)) || snap.mobile;
  if(mob && snap.earn>0) await loyaltyPost(mob,'earn',snap.earn,inv,`Invoice ${inv.number} restored`);
  if(mob && snap.redeem>0) await loyaltyPost(mob,'redeem',-snap.redeem,inv,`Invoice ${inv.number} restored`);
  for(const r of (snap.usage||[])){ const m=await dbGet('memberships',r.mid); const u=m&&(m.usage||[]).find(x=>x.id===r.uid);
    if(u){ await ledgerPost({ type:'membership_hours_used', customerId:m.customerId||'', mobile:m.mobile, invoiceId:inv.id, invoiceNumber:inv.number, membershipId:m.id, hours:-rnd2(u.minutes/60), originalRef:u.reversalRef||null, description:`Invoice ${inv.number} restored — free hours used again` });
      delete u.reversed; delete u.reversedNote; delete u.reversalRef; await dbPut('memberships',m); } }
  if(snap.discount>0){ const m = await activeMembership(mob); await ledgerPost({ type:'membership_discount', customerId:inv.customerId||'', mobile:mob, invoiceId:inv.id, invoiceNumber:inv.number, membershipId:m?m.id:(inv.membership&&inv.membership.id)||null, amount:snap.discount, description:`Invoice ${inv.number} restored — member discount applied again` }); }
}
/* Full cascade: the session, its gaming segments / lines (stored inside it) and any other session that points at this invoice. Never touches other sessions of the same customer. */
async function deleteSessionCascade(inv, s){
  const ids=new Set([inv.sessionId]);
  (await dbAll('bsessions')).forEach(x=>{ if(x.invoiceId===inv.id) ids.add(x.id); });
  const gone=[];
  for(const sid of ids){
    const sess = sid===s.id ? s : await dbGet('bsessions', sid); if(!sess) continue;
    if(sid!==s.id && sess.invoiceId!==inv.id) continue;
    await dbDel('bsessions', sid); liveSessions = liveSessions.filter(x=>x.id!==sid);
    gone.push({ id:sid, code:sesCode(sess), lines:(sess.lines||[]).length, prevStatus:sess.status });
  }
  if(state.sessionId && ids.has(state.sessionId)) state.sessionId=null;
  return { mode:'delete', removed:gone };
}
function invBenefitRows(inv){
  const r=[]; const m=inv.membership;
  if(inv.memFree) r.push([`Membership free hours (${fmtDur(m&&m.freeMinutes||0)})`,'-'+fmt(inv.memFree)]);

  if(inv.memFood) r.push([`Member snacks & drinks discount${m&&m.foodDiscount?' ('+m.foodDiscount+'%)':''}`,'-'+fmt(inv.memFood)]);
  if(inv.loyaltyValue) r.push([`Loyalty points redeemed (${fpts(inv.loyaltyPoints||0)})`,'-'+fmt(inv.loyaltyValue)]);
  return r;
}

/* ---------- Membership ---------- */
function addMonths(ts,n){ const d=new Date(ts), day=d.getDate(); d.setMonth(d.getMonth()+n); if(d.getDate()!==day) d.setDate(0); return d.getTime(); }
function endOfDay(ts){ const d=new Date(ts); d.setHours(23,59,59,999); return d.getTime(); }
function memStatus(m, now){ now=now||Date.now(); if(m.cancelledAt) return 'Cancelled'; if(now>m.expiryDate) return 'Expired'; if(m.startDate>now) return 'Scheduled'; return 'Active'; }
function memUsedMin(m){ return (m.usage||[]).filter(u=>!u.reversed).reduce((z,u)=>z+(Number(u.minutes)||0),0); }
function memRemainMin(m){ return Math.max(0, Math.round((Number(m.freeHours)||0)*60) - memUsedMin(m)); }
function memHours(min){ return rnd2(min/60)+'h'; }
async function activeMembership(mobile){ if(!mobile) return null; const c = await dbGet('customers', mobile); const m = dbAllRO('memberships').filter(m=>belongsTo(m,c,mobile) && memStatus(m)==='Active').sort((a,b)=>b.startDate-a.startDate)[0]; return m ? clean(m) : null; }
async function membershipPurchase(o){
  if(!isAdmin()) throw new Error('Only an administrator can sell or assign a membership.');
  const plan = memPlans().find(p=>p.id===o.planId); if(!plan) throw new Error('Choose a membership plan.');
  const comp = !!o.complimentary;
  if(comp){ await admAuthorize(o.pin); if(!String(o.reason||'').trim()) throw new Error('Enter the reason for the complimentary activation.'); }
  else if(!PAY_METHODS.includes(o.method)) throw new Error('Choose how the membership was paid.');
  let c, created = false;

/* THE benefit calculation — one pure function used by the checkout screen and by the invoice engine, so they can never disagree.
   f: { discountPct, memOn, memOwner:{lineId:true}, redeemPts }.  Free hours are measured in the OWNER's own minutes:
   a group line's player count never multiplies the deduction, and only the owner's per-player share of the price is made free. */
function benefitPlan(lines, f, settings, mem, acct, fin){
  const memOn = !!(f.memOn===true && mem && memStatus(mem)==='Active');
  let remain = memOn ? memRemainMin(mem) : 0; const items=[]; let memFree=0, memDisc=0, freeMin=0;
  if(memOn) lines.filter(l=>l.kind==='gaming' && f.memOwner && f.memOwner[l.id]).forEach(l=>{
    const mins=Number(l.minutes)||0, players=Math.max(1,Number(l.players)||1), share=(Number(l.total)||0)/players;
    const fm=Math.min(mins, remain); remain-=fm; const fv=mins>0 ? Math.round(share*fm/mins) : 0;
    const paidShare=Math.max(0, share-fv), disc=Math.round(paidShare*(Number(mem.gamingDiscount)||0)/100);
    freeMin+=fm; memFree+=fv; memDisc+=disc; items.push({ lineId:l.id, name:l.name, minutes:mins, players, freeMin:fm, paidMin:mins-fm, freeValue:fv, discount:disc, share:Math.round(share) });
  });
  const foodTotal = lines.filter(l=>l.bucket==='food').reduce((z,l)=>z+(Number(l.total)||0),0);
  const memFood = memOn ? Math.round(foodTotal*(Number(mem.foodDiscount)||0)/100) : 0;
  const pct = memOn ? 0 : (Number(f.discountPct)||0);   // no stacking: the manual discount is off while membership benefits apply
  const base = Object.assign({}, fin||{}, { memFree, memDisc, memFood });
  let t = billTotals(lines, pct, settings, base), lpts=0, lval=0; const cfg=loyaltyCfg();
  const want = Math.floor(Number(f.redeemPts)||0);
  if(cfg.enabled && acct && want>0 && cfg.rupeePerPoint>0){
    const rate=Number(cfg.rupeePerPoint); let lim=Math.min(want, Math.floor(acct.balance), Math.floor(Math.max(0,t.grand)/rate));
    if(cfg.maxRedeemPerInvoice>0) lim=Math.min(lim, Math.floor(cfg.maxRedeemPerInvoice/rate));
    if(acct.balance < (Number(cfg.minRedeem)||0)) lim=0;
    if(lim>0){ lpts=lim; lval=Math.round(lim*rate); t=billTotals(lines, pct, settings, Object.assign({}, base, { loyalty:lval })); }
  }
  return { t, memOn, mem:memOn?mem:null, items, freeMin, memFree, memDisc, memFood, loyaltyPts:lpts, loyaltyValue:lval };
}
/* Called by the invoice engine right after the invoice exists. */
async function applyBenefitsToInvoice(inv, plan, mobile){
  if(plan.memOn && plan.mem){
    const m=await dbGet('memberships', plan.mem.id);
    if(m && plan.freeMin>0){
      const led = await ledgerPost({ type:'membership_hours_used', customerId:m.customerId||inv.customerId||'', mobile:m.mobile, invoiceId:inv.id, invoiceNumber:inv.number, membershipId:m.id, hours:-rnd2(plan.freeMin/60), amount:inv.memFree||0, description:`Free gaming hours used on ${inv.number}` });
      m.usage=m.usage||[]; m.usage.push({ id:Date.now()+'-'+m.usage.length, ts:Date.now(), invoiceId:inv.id, invoiceNumber:inv.number, kind:'free', minutes:plan.freeMin, ledgerRef:led.id, lines:plan.items.filter(i=>i.freeMin>0).map(i=>({ lineId:i.lineId, name:i.name, minutes:i.freeMin, players:i.players })), note:'Free gaming hours used (owner\'s own time only)' }); await dbPut('memberships', m);
    }
    const disc=(inv.memDisc||0)+(inv.memFood||0);
    if(m && disc>0) await ledgerPost({ type:'membership_discount', customerId:m.customerId||inv.customerId||'', mobile:m.mobile, invoiceId:inv.id, invoiceNumber:inv.number, membershipId:m.id, amount:disc, description:`Member discount on ${inv.number}`, meta:{ gaming:inv.memDisc||0, food:inv.memFood||0 } });
  }
  if(mobile && plan.loyaltyPts>0) await loyaltyPost(mobile,'redeem',-plan.loyaltyPts,inv,`Redeemed on ${inv.number} (${fmt(plan.loyaltyValue)} off)`);
  await loyaltyAward(inv);
}

/* ============================================================================
   v13 — Lifetime data integrity
   • SCHEMA_VERSION + migrations      • stable customer IDs (cid) that survive name / mobile changes
   • append-only financial LEDGER      • invoice ARCHIVE (separate, indexed, paginated collection)
   • all-or-nothing batch writes       • Admin Data Integrity Check with audited repairs
   Cloud database = Firestore (one document per record, saved on the phone in IndexedDB by the Firestore SDK, so everything works offline).
   'ledger' and 'archivedInvoices' are NOT mirrored into memory: they are read on demand with indexed, paginated queries.
   ============================================================================ */
const SCHEMA_VERSION = 13;
function hash32(str, seed){ let h = (seed===undefined?0x811c9dc5:seed)>>>0; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619)>>>0; } return h>>>0; }
const hex8 = n=>('00000000'+(n>>>0).toString(16)).slice(-8);
function cidForMobile(mobile){ const s=String(mobile); return 'C-'+hex8(hash32(s)).toUpperCase()+hex8(hash32(s,0x9747b28c)).toUpperCase(); }   // deterministic: two phones migrating the same customer produce the same ID
function newCid(){ return 'C-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase(); }   // brand-new customers: random, never reused
async function customerByCid(cid){ if(!cid) return null; const c = dbAllRO('customers').find(c=>c.cid===cid); return c ? clean(c) : null; }
async function ensureCid(c){ if(c && !c.cid){ c.cid = cidForMobile(c.mobile); await dbPut('customers', c); } return c ? c.cid : ''; }
async function cidOfMobile(mob){ if(!mob) return ''; const c = await dbGet('customers', mob); return c ? ensureCid(c) : ''; }
function belongsTo(rec, c, mobile){ return (c && c.cid && rec.customerId) ? rec.customerId===c.cid : (rec.mobile||rec.customerMobile)===mobile; }
async function invMobile(inv){   // the customer's CURRENT mobile (it may have changed since the invoice was made)
  if(inv.customerId){ const c = await customerByCid(inv.customerId); if(c) return c.mobile; }
  return inv.customerMobile||'';
}

/* ---------- all-or-nothing writes ---------- */
async function dbBatch(ops){   // ops: [{put:[store,val]} | {del:[store,key]}] — one Firestore batch: every change is saved or none is
  const f = fb(); const b = f.writeBatch(f.db);
  const prepared = ops.map(o=>{ if(o.put){ const [store,val]=o.put, kp=KEYPATH[store]||'id'; if(val[kp]===undefined||val[kp]===null) throw new Error('A batched record has no ID.'); return { store, key:String(val[kp]), data:clean(val) }; } const [store,key]=o.del; return { store, key:String(key), del:true }; });
  prepared.forEach(p=>{ const ref=f.doc(f.db,p.store,p.key); if(p.del) b.delete(ref); else b.set(ref,p.data); });
  const touched = new Set();
  prepared.forEach(p=>{ markLocal(p.store,p.key); touched.add(p.store); if(__ready[p.store]){ if(p.del) __cache[p.store].delete(p.key); else __cache[p.store].set(p.key, clean(p.data)); } });
  touched.forEach(bumpRev);
  await writeAck(b.commit());
}

/* ---------- the append-only ledger ---------- */
function ledgerId(){ return 'TX-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase(); }
function ledgerRow(e, id){
  const row = Object.assign({ ts:Date.now(), type:'', customerId:'', mobile:'', invoiceId:null, invoiceNumber:'', membershipId:null, amount:0, points:0, hours:0, originalRef:null, reversalRef:null, description:'', reason:'', by:isAdmin()?'Admin':'Staff', schema:SCHEMA_VERSION }, e);
  row.id = id || ledgerId(); row.txId = row.id; return row;
}
async function ledgerPost(e, fixedId){
  const row = ledgerRow(e, fixedId);
  try{ await dbPut('ledger', row); }catch(err){ console.error('ledger write failed', err); try{ showToast('⚠️ A ledger entry could not be saved'); }catch(_){} }
  return row;
}
async function ledgerQuery(field, value){   // indexed equality query (Firestore single-field index) — never loads the whole ledger
  const f = fb(); const snap = await f.getDocs(f.query(f.collection(f.db,'ledger'), f.where(field,'==',value)));
  return snap.docs.map(d=>d.data()).sort((a,b)=>a.ts-b.ts||String(a.id).localeCompare(String(b.id)));
}
const LEDGER_LABEL = { invoice_create:'Invoice created', invoice_payment:'Payment received', invoice_credit:'Credit note', invoice_refund:'Refund', invoice_archive:'Invoice archived', invoice_unarchive:'Invoice un-archived', invoice_delete:'Invoice deleted', invoice_payment_reversal:'Payment reversed', invoice_restore:'Invoice restored', invoice_purge:'Invoice permanently removed',
  loyalty_earn:'Points earned', loyalty_redeem:'Points redeemed', loyalty_reverse_earn:'Points earned — reversed', loyalty_reverse_redeem:'Points redeemed — returned', loyalty_expire:'Points expired',
  membership_purchase:'Membership purchase', membership_complimentary:'Complimentary membership', membership_activation:'Membership activated', membership_cancel:'Membership cancelled', membership_hours_used:'Free hours used', membership_hours_restored:'Free hours restored', membership_discount:'Member discount given', membership_discount_reversed:'Member discount reversed',
  customer_purge:'Customer removed (test data)', adjustment:'Adjustment', customer_update:'Customer details changed', restore:'Backup restored', migration:'Schema migration' };

/* ---------- customers ---------- */
async function customerCreate(o){
  const mob = normMobile(String(o.mobile||'').trim()); if(!mob) throw new Error('Enter a valid 10-digit mobile number.');
  const name = String(o.name||'').trim(); if(!name) throw new Error("Enter the customer's name.");
  const ex = await dbGet('customers', mob);   // one mobile = one customer: never create a second record
  if(ex){ await ensureCid(ex); return { customer:ex, existed:true }; }
  const now = new Date().toISOString();
  const c = { mobile:mob, cid:newCid(), name, email:String(o.email||'').trim(), address:String(o.address||'').trim(), birthday:o.birthday||'', notes:String(o.notes||'').trim(), joined:now, visits:0, gamingSessions:0, gamingHours:0, gamingSpend:0, foodSpend:0, totalSpend:0, lastVisit:now, invoiceIds:[] };
  await dbPut('customers', c); return { customer:c, existed:false };
}
async function customerUpdate(cid, o){
  if(!isAdmin()) throw new Error('Only an administrator can change customer details.');
  const c = await customerByCid(cid); if(!c) throw new Error('Customer not found.');
  const name = String(o.name===undefined?c.name:o.name).trim(); if(!name) throw new Error("Enter the customer's name.");
  const newMob = o.mobile===undefined ? c.mobile : normMobile(String(o.mobile).trim()); if(!newMob) throw new Error('Enter a valid 10-digit mobile number.');
  const before = { name:c.name, mobile:c.mobile };
  const upd = Object.assign({}, c, { name, email:o.email===undefined?c.email:String(o.email).trim(), address:o.address===undefined?c.address:String(o.address).trim(), birthday:o.birthday===undefined?c.birthday:o.birthday, notes:o.notes===undefined?c.notes:String(o.notes).trim() });
  const old = c.mobile;
  if(newMob!==old){
    if(await dbGet('customers', newMob)) throw new Error('Another customer already uses that mobile number. Open that customer instead — customers are never merged automatically.');
    upd.mobile = newMob; upd.previousMobiles = [...(c.previousMobiles||[]), old];
    await dbBatch([{ put:['customers',upd] }, { del:['customers',old] }]);   // atomic: the customer is never missing and never duplicated
  } else await dbPut('customers', upd);
  // re-point the copies of name / mobile kept on linked records (the permanent link is the customer ID, so nothing is ever orphaned)
  for(const m of await dbAllFresh('memberships')){ if(m.customerId===cid || (!m.customerId && m.mobile===old)){ m.customerId=cid; m.mobile=newMob; m.customerName=name; await dbPut('memberships', m); } }
  if(newMob!==old) for(const t of await dbAllFresh('loyaltyTx')){ if(t.customerId===cid || (!t.customerId && t.mobile===old)){ t.customerId=cid; t.mobile=newMob; await dbPut('loyaltyTx', t); } }
  for(const s of (await dbAll('bsessions'))){ if(s.customerMobile===old && newMob!==old && isOpenStatus(s.status)){ await dbUpdate('bsessions', s.id, d=>{ d.customerMobile=newMob; if(name) d.customerName=name; return true; }); } }
  if(before.name!==name || newMob!==old) await ledgerPost({ type:'customer_update', customerId:cid, mobile:newMob, description:`Customer details changed: ${before.name} (${before.mobile}) → ${name} (${newMob})`, reason:'Edited by admin' });
  return upd;
}

/* ---------- archive helpers ---------- */
async function getInvoiceAny(id){ const a = await dbGet('invoices', id); if(a) return a; return await dbGet('archivedInvoices', id); }
const ARCHIVE_FIELDS = ['archivedAt','archivedBy','archiveReason','archived'];
function stripArchive(rec){ const o = clean(rec); ARCHIVE_FIELDS.forEach(k=>delete o[k]); return o; }
function invSnapshot(inv){ return { number:inv.number, date:inv.date, customerName:inv.customerName||'', customerMobile:inv.customerMobile||'', customerId:inv.customerId||'', grandTotal:inv.grandTotal, paid:invoicePaid(inv), gaming:(inv.gamingAmount||0)+(inv.accompanyAmount||0)+(inv.overtimeAmount||0), food:inv.foodAmount||0, discount:inv.discount||0, memFree:inv.memFree||0, memDisc:inv.memDisc||0, memFood:inv.memFood||0, loyaltyValue:inv.loyaltyValue||0, payments:(inv.payments||[]).map(p=>({ method:p.method, amount:p.amount, date:p.date })), sessionCode:inv.sessionCode||'', lines:(inv.lines||[]).length }; }

async function archiveInvoicesCore(ids, o){
  o = o||{}; await admAuthorize(o.pin);
  const done = [], skipped = [];
  if(!state.settings.hasArchive) await patchSettings({ hasArchive:true });   // set BEFORE the first move so reports always look in the archive too
  for(const id of ids){
    const inv = await dbGet('invoices', id);
    if(!inv){ skipped.push({ id, why:'not found (already archived or deleted)' }); continue; }
    if(invoiceBalance(inv)>0){ skipped.push({ id, number:inv.number, why:'balance still due' }); continue; }
    if(inv.sessionId){ const s = await dbGet('bsessions', inv.sessionId); if(s && isOpenStatus(s.status)){ skipped.push({ id, number:inv.number, why:'its gaming session is still open' }); continue; } }
    const cid = inv.customerId || await cidOfMobile(inv.customerMobile);
    const rec = Object.assign(stripArchive(inv), { customerId:cid||'', archived:true, archivedAt:Date.now(), archivedBy:'Admin', archiveReason:o.reason||'Archived', schema:SCHEMA_VERSION });
    const led = ledgerRow({ type:'invoice_archive', customerId:cid||'', mobile:inv.customerMobile||'', invoiceId:inv.id, invoiceNumber:inv.number, amount:inv.grandTotal, description:`Archived ${inv.number}`, reason:o.reason||'Archived', meta:invSnapshot(inv) });
    await dbBatch([{ put:['archivedInvoices',rec] }, { del:['invoices',inv.id] }, { put:['ledger',led] }]);   // one atomic step: copy to archive + remove from active + ledger entry
    done.push(inv.id);
  }
  if(done.length){ try{ await createRecord('auditLog', { ts:Date.now(), action:'invoice_archive', invoiceId:null, number:`${done.length} invoice(s)`, amount:0, by:'Admin', reason:o.reason||'Archived', ids:done }); }catch(e){} }
  return { done, skipped };
}
async function unarchiveInvoiceCore(id, o){
  o = o||{}; await admAuthorize(o.pin);
  const rec = await dbGet('archivedInvoices', id); if(!rec) throw new Error('Archived invoice not found.');
  if(await dbGet('invoices', id)) throw new Error(`${rec.number} is already in the active list.`);
  const inv = stripArchive(rec);
  const led = ledgerRow({ type:'invoice_unarchive', customerId:rec.customerId||'', mobile:rec.customerMobile||'', invoiceId:rec.id, invoiceNumber:rec.number, amount:rec.grandTotal, description:`Un-archived ${rec.number}`, reason:o.reason||'Returned to the active list' });
  await dbBatch([{ put:['invoices',inv] }, { del:['archivedInvoices',id] }, { put:['ledger',led] }]);
  return inv;
}
async function archivedOnDay(dateStr){
  if(!state.settings.hasArchive) return [];
  const [y,m,d] = dateStr.split('-').map(Number); const t0 = new Date(y,m-1,d).getTime(), t1 = t0+864e5-1; const f = fb();
  const snap = await f.getDocs(f.query(f.collection(f.db,'archivedInvoices'), f.where('date','>=',t0), f.where('date','<=',t1)));
  return snap.docs.map(x=>x.data());
}
async function archivedSince(start){
  if(!state.settings.hasArchive) return [];
  const f = fb(); const snap = await f.getDocs(f.query(f.collection(f.db,'archivedInvoices'), f.where('date','>=',start)));
  return snap.docs.map(x=>x.data());
}

/* ---------- schema migrations (idempotent; safe to run again after an interruption) ---------- */
async function putMany(store, rows){ for(let i=0;i<rows.length;i+=400) await dbBatch(rows.slice(i,i+400).map(r=>({ put:[store,r] }))); }
async function runMigrations(){
  const st = (await dbGet('settings','main')) || state.settings; if(!st) return { ran:false };
  const cur = Number(st.schemaVersion)||0; if(cur>=SCHEMA_VERSION) return { ran:false, from:cur };
  const report = { from:cur, to:SCHEMA_VERSION, customers:0, linked:0, ledger:0 };
  // 1) stable customer IDs
  const custs = await dbAllFresh('customers'); const byMob = {};
  const toFix = []; custs.forEach(c=>{ if(!c.cid){ c.cid = cidForMobile(c.mobile); toFix.push(c); } byMob[c.mobile] = c.cid; });
  if(toFix.length){ await putMany('customers', toFix); report.customers = toFix.length; }
  // 2) customerId on every linked record
  const link = async(store, mobField)=>{ const rows = await dbAllFresh(store); const fix = rows.filter(r=>!r.customerId && r[mobField] && byMob[r[mobField]]); fix.forEach(r=>{ r.customerId = byMob[r[mobField]]; }); if(fix.length) await putMany(store, fix); report.linked += fix.length; return rows; };
  const mems = await link('memberships','mobile'); const lts = await link('loyaltyTx','mobile'); const invs = await link('invoices','customerMobile');
  const dels = await dbAllFresh('deletedInvoices'); const dfix = dels.filter(r=>!r.customerId && r.customerMobile && byMob[r.customerMobile]); dfix.forEach(r=>{ r.customerId = byMob[r.customerMobile]; if(r.invoice && !r.invoice.customerId) r.invoice.customerId = r.customerId; }); if(dfix.length) await putMany('deletedInvoices', dfix);
  // 3) back-fill the ledger for everything that happened before v13 (fixed IDs, so a re-run or a second phone never duplicates)
  const have = new Set((await dbAllFresh('ledger')).map(r=>r.id)); const out = [];
  const add = (id, e)=>{ if(!have.has(id)){ have.add(id); out.push(ledgerRow(Object.assign({ by:'System', reason:'Back-filled when upgrading to v13' }, e), id)); } };
  lts.forEach(t=>add('MIG-LT-'+t.id, { ts:t.ts, type:'loyalty_'+t.type, customerId:t.customerId||byMob[t.mobile]||'', mobile:t.mobile, invoiceId:t.invoiceId||null, invoiceNumber:t.invoiceNumber||'', points:t.points, description:t.note||'' }));
  mems.forEach(m=>{
    const cid = m.customerId||byMob[m.mobile]||''; const amt = m.payment?m.payment.amount:0;
    add('MIG-MP-'+m.id, { ts:m.createdAt||m.startDate, type:amt>0?'membership_purchase':'membership_complimentary', customerId:cid, mobile:m.mobile, membershipId:m.id, amount:amt, description:`${m.period||''} ${m.planName||''} membership ${m.receiptNo||''}`.trim() });
    add('MIG-MA-'+m.id, { ts:(m.createdAt||m.startDate)+1, type:'membership_activation', customerId:cid, mobile:m.mobile, membershipId:m.id, hours:Number(m.freeHours)||0, description:`Activated — ${rnd2(m.freeHours)}h free gaming hours` });
    (m.usage||[]).forEach(u=>{ add('MIG-MU-'+m.id+'-'+u.id, { ts:u.ts, type:'membership_hours_used', customerId:cid, mobile:m.mobile, invoiceId:u.invoiceId||null, invoiceNumber:u.invoiceNumber||'', membershipId:m.id, hours:-rnd2(u.minutes/60), description:u.note||'Free gaming hours used' });
      if(u.reversed) add('MIG-MR-'+m.id+'-'+u.id, { ts:u.ts+1, type:'membership_hours_restored', customerId:cid, mobile:m.mobile, invoiceId:u.invoiceId||null, invoiceNumber:u.invoiceNumber||'', membershipId:m.id, hours:rnd2(u.minutes/60), originalRef:'MIG-MU-'+m.id+'-'+u.id, description:u.reversedNote||'Invoice deleted — hours restored' }); });
    if(m.cancelledAt) add('MIG-MC-'+m.id, { ts:m.cancelledAt, type:'membership_cancel', customerId:cid, mobile:m.mobile, membershipId:m.id, description:'Membership cancelled', reason:m.cancelReason||'' });
  });
  invs.forEach(i=>{
    const cid = i.customerId||byMob[i.customerMobile]||'';
    add('MIG-INV-'+i.id, { ts:i.date, type:'invoice_create', customerId:cid, mobile:i.customerMobile||'', invoiceId:i.id, invoiceNumber:i.number, amount:i.grandTotal, description:`Invoice ${i.number} created`, meta:invSnapshot(i) });
    const pays = i.payments ? i.payments : (PAY_TO_ACCOUNT[i.paymentMethod] && i.grandTotal>0 ? [{ method:i.paymentMethod, amount:i.grandTotal, date:i.date }] : []);
    pays.forEach((p,k)=>add('MIG-PAY-'+i.id+'-'+k, { ts:p.date||i.date, type:p.amount<0?'invoice_refund':'invoice_payment', customerId:cid, mobile:i.customerMobile||'', invoiceId:i.id, invoiceNumber:i.number, amount:p.amount, description:`${p.amount<0?'Refund':'Payment'} by ${p.method}`, meta:{ method:p.method } }));
    (i.adjustments||[]).filter(a=>a.type==='credit').forEach((a,k)=>add('MIG-CR-'+i.id+'-'+k, { ts:a.date||i.date, type:'invoice_credit', customerId:cid, mobile:i.customerMobile||'', invoiceId:i.id, invoiceNumber:i.number, amount:a.amount, description:'Credit note', reason:a.reason||'' }));
  });
  dels.forEach(r=>add('MIG-DEL-'+r.id, { ts:r.deletedAt, type:'invoice_delete', customerId:r.customerId||byMob[r.customerMobile]||'', mobile:r.customerMobile||'', invoiceId:r.id, invoiceNumber:r.number, amount:r.amount, description:`Invoice ${r.number} deleted`, reason:r.reason||'', meta:r.invoice?invSnapshot(r.invoice):null }));
  for(let i=0;i<out.length;i+=400) await dbBatch(out.slice(i,i+400).map(r=>({ put:['ledger',r] })));
  report.ledger = out.length;
  await patchSettings({ schemaVersion:SCHEMA_VERSION, migratedAt:Date.now() });
  try{ await createRecord('auditLog', { ts:Date.now(), action:'schema_migration', invoiceId:null, number:`v${cur} → v${SCHEMA_VERSION}`, amount:0, by:'System', details:report }); }catch(e){}
  return Object.assign({ ran:true }, report);
}

/* ============ Data Integrity Check ============ */
/* Read-only scan. Every finding lists the affected IDs, a safe recommendation and — where a repair is safe — a button that needs the Admin PIN.
   Repairs only ADD correcting entries or fix links/flags; suspicious financial records are never deleted. Every repair is audited. */
let __integ = null;
async function integrityScan(){
  const names = ['invoices','archivedInvoices','deletedInvoices','bsessions','customers','memberships','loyaltyTx','ledger'];
  const [inv, arc, del, ses, cus, mem, lts, led] = await Promise.all(names.map(dbAllFresh));
  const issues = []; const add = (code, sev, title, items, recommend)=>{ if(items.length) issues.push({ code, sev, title, recommend, items }); };
  const invIds = new Set([...inv.map(i=>i.id), ...arc.map(i=>i.id)]), delIds = new Set(del.map(r=>r.id)), purged = new Set(led.filter(l=>l.type==='invoice_purge').map(l=>l.invoiceId));
  const known = id=>invIds.has(id)||delIds.has(id)||purged.has(id);
  const cids = new Set(cus.map(c=>c.cid).filter(Boolean)), mobs = new Set(cus.map(c=>c.mobile));
  const custOk = r=>r.customerId ? cids.has(r.customerId) : mobs.has(r.mobile||r.customerMobile);
  // duplicate invoice numbers
  const byNum = {}; [...inv, ...arc].forEach(i=>{ (byNum[i.number]=byNum[i.number]||[]).push(i); });
  add('dup_number','error','Duplicate invoice numbers', Object.entries(byNum).filter(([,l])=>l.length>1).map(([n,l])=>({ ref:n, text:`${n} is used by invoice IDs ${l.map(x=>x.id).join(', ')}` })), 'Open each invoice and compare. Do not delete either one: issue a Credit note on the wrong one, or ask your accountant. Report only — nothing is changed automatically.');
  // archived invoices still in the active list
  const arcMap = new Map(arc.map(a=>[a.id,a]));
  add('arch_active','error','Archived invoices also showing in the active list', inv.filter(i=>arcMap.has(i.id)).map(i=>{ const a=arcMap.get(i.id); const same = JSON.stringify(stripArchive(a))===JSON.stringify(stripArchive(i)) || (i.payments||[]).length===(a.payments||[]).length && i.grandTotal===a.grandTotal;
    return { ref:i.number, text:`${i.number} (ID ${i.id}) exists in both the active list and the archive`, fix:same?{ kind:'drop_active_copy', id:i.id }:null, note:same?'':'The two copies differ — review manually.' }; }), 'Safe repair: remove the active copy (the archive copy keeps everything). Not offered when the two copies differ.');
  // sessions
  const stIdx = new Set(ses.filter(s=>isOpenStatus(s.status)).map(s=>s.id));
  add('orphan_session','error','Gaming sessions linked to an invoice that does not exist', ses.filter(s=>s.invoiceId && !invIds.has(s.invoiceId) && !delIds.has(s.invoiceId)).map(s=>({ ref:sesCode(s), text:`Session ${sesCode(s)} points to missing invoice ID ${s.invoiceId}`, fix:{ kind:'session_unlink', id:s.id } })), 'Safe repair: unlink the session and reopen it so it can be billed again. Check that the customer was not already billed.');
  add('orphan_session2','warn','Billed sessions with no invoice link', ses.filter(s=>['finalized','paid'].includes(s.status) && !s.invoiceId).map(s=>({ ref:sesCode(s), text:`Session ${sesCode(s)} is "${s.status}" but has no invoice`, fix:{ kind:'session_unlink', id:s.id } })), 'Safe repair: reopen the session so it can be billed.');
  add('deleted_linked','error','Deleted invoices still linked to sessions', ses.filter(s=>s.invoiceId && delIds.has(s.invoiceId) && !invIds.has(s.invoiceId)).map(s=>({ ref:sesCode(s), text:`Session ${sesCode(s)} is still linked to deleted invoice ID ${s.invoiceId}`, fix:{ kind:'session_unlink', id:s.id } })), 'Safe repair: unlink the session (it is reopened for billing).');
  // customers
  const miss = []; const seen = new Set();
  const noteMissing = (kind, r, mob, name)=>{ const k=(r.customerId||'')+'|'+mob; if(seen.has(k)) return; seen.add(k); miss.push({ ref:mob||r.customerId, text:`${kind} refers to customer ${r.customerId||''} ${mob?'('+mob+')':''} who does not exist`, fix:(mob?{ kind:'create_customer', mobile:mob, name:name||'Customer '+mob, cid:r.customerId||cidForMobile(mob) }:null) }); };
  [...inv,...arc].forEach(i=>{ if(i.customerMobile && !custOk(i)) noteMissing('Invoice '+i.number, i, i.customerMobile, i.customerName); });
  mem.forEach(m=>{ if(!custOk(m)) noteMissing('Membership '+(m.receiptNo||m.id), m, m.mobile, m.customerName); });
  lts.forEach(t=>{ if(!custOk(t)) noteMissing('Loyalty transaction '+t.id, t, t.mobile, ''); });
  add('missing_customer','error','References to customers that do not exist', miss, 'Safe repair: re-create the customer record from the information on the transaction (nothing else changes).');
  // missing invoice references
  const mref = [];
  lts.forEach(t=>{ if(t.invoiceId && !known(t.invoiceId)) mref.push({ ref:'loyaltyTx '+t.id, text:`Loyalty transaction ${t.id} (${t.ledgerRef||'no ledger ref'}) refers to missing invoice ID ${t.invoiceId}` }); });
  mem.forEach(m=>(m.usage||[]).forEach(u=>{ if(u.invoiceId && !known(u.invoiceId)) mref.push({ ref:'usage '+u.id, text:`Free-hours usage ${u.id} of membership ${m.receiptNo||m.id} refers to missing invoice ID ${u.invoiceId}` }); }));
  led.forEach(l=>{ if(l.invoiceId && !known(l.invoiceId) && !String(l.type).startsWith('invoice_purge')) mref.push({ ref:l.id, text:`Ledger ${l.id} (${l.type}) refers to missing invoice ID ${l.invoiceId}` }); });
  add('missing_invoice','error','Missing invoice references', mref, 'Report only. Find out whether the invoice was removed outside the app. Never delete the transaction — post an Adjustment instead if needed.');
  // loyalty: running balance + duplicate awards + ledger drift
  const byCust = {}; lts.forEach(t=>{ (byCust[t.customerId||t.mobile]=byCust[t.customerId||t.mobile]||[]).push(t); });
  const lb = [];
  Object.entries(byCust).forEach(([k,list])=>{ list.sort((a,b)=>a.ts-b.ts||(a.id-b.id)); let run=0; const bad=[]; list.forEach(t=>{ run=rnd2(run+t.points); if(Math.abs((t.balanceAfter||0)-run)>0.005) bad.push(t.id); });
    if(bad.length) lb.push({ ref:k, text:`Customer ${k}: running balance is wrong on loyalty transactions ${bad.slice(0,8).join(', ')}${bad.length>8?'…':''} (true balance ${fpts(run)})`, fix:{ kind:'loyalty_rebalance', key:k } });
    if(run<-0.005) lb.push({ ref:k+'-neg', text:`Customer ${k} has a NEGATIVE loyalty balance (${fpts(run)})` }); });
  add('loyalty_balance','error','Loyalty balance mismatches', lb, 'Safe repair recalculates the running-balance column from the saved transactions. A negative balance needs a manual look.');
  const dupE = []; const cfg = loyaltyCfg(); const allInv = new Map([...inv,...arc].map(i=>[i.id,i]));
  const perInv = {}; lts.forEach(t=>{ if(t.invoiceId && (t.type==='earn'||t.type==='reverse_earn')) (perInv[t.invoiceId]=perInv[t.invoiceId]||[]).push(t); });
  Object.entries(perInv).forEach(([id,list])=>{ const i=allInv.get(Number(id)); if(!i) return; const net=rnd2(list.reduce((z,t)=>z+t.points,0)); const exp=invoiceBalance(i)>0?0:loyaltyPointsFor(i.grandTotal-invoiceCredits(i), cfg); const afterCredits=Math.max(exp,0);
    if(net>afterCredits+0.005 && list.filter(t=>t.type==='earn').length>1) dupE.push({ ref:id, text:`Invoice ${i.number}: points earned ${fpts(net)} but only ${fpts(afterCredits)} are due — duplicate award in loyalty transactions ${list.filter(t=>t.type==='earn').map(t=>t.id).join(', ')}`, fix:{ kind:'loyalty_dup_earn', invoiceId:i.id, excess:rnd2(net-afterCredits) } }); });
  add('dup_earn','error','Duplicate loyalty awards', dupE, 'Safe repair posts one correcting "reverse earn" entry for the excess points. The original entries stay.');
  const ledPts = {}; led.forEach(l=>{ if(String(l.type).startsWith('loyalty_')) ledPts[l.customerId||l.mobile] = rnd2((ledPts[l.customerId||l.mobile]||0)+l.points); });
  const drift = []; Object.entries(byCust).forEach(([k,list])=>{ const s=rnd2(list.reduce((z,t)=>z+t.points,0)); const l=ledPts[k]||0; if(Math.abs(s-l)>0.005) drift.push({ ref:k, text:`Customer ${k}: loyalty rows total ${fpts(s)} points but the ledger totals ${fpts(l)}`, fix:{ kind:'ledger_adjust_points', key:k, delta:rnd2(s-l) } }); });
  add('ledger_loyalty','warn','Loyalty ledger does not match loyalty balances', drift, 'Safe repair appends an Adjustment entry to the ledger so it agrees with the customer balance.');
  // memberships: free hours
  const hm = [], du = [];
  const ledHrs = {}; led.forEach(l=>{ if(l.membershipId && (l.type==='membership_activation'||l.type==='membership_hours_used'||l.type==='membership_hours_restored')) ledHrs[l.membershipId]=rnd2((ledHrs[l.membershipId]||0)+l.hours); });
  mem.forEach(m=>{
    const used = memUsedMin(m)/60, cap = Number(m.freeHours)||0;
    if(used>cap+0.01) hm.push({ ref:'over-'+m.id, text:`Membership ${m.receiptNo||m.id}: ${rnd2(used)}h used but the plan only includes ${rnd2(cap)}h` });
    const expect = rnd2(cap-used), got = ledHrs[m.id]; if(got===undefined || Math.abs(expect-got)>0.01) hm.push({ ref:'led-'+m.id, text:`Membership ${m.receiptNo||m.id}: ${rnd2(expect)}h left by usage rows but the ledger shows ${got===undefined?'no entries':rnd2(got)+'h'}`, fix:{ kind:'ledger_adjust_hours', mid:m.id, delta:rnd2(expect-(got||0)) } });
    const byI = {}; (m.usage||[]).filter(u=>!u.reversed).forEach(u=>{ (byI[u.invoiceId]=byI[u.invoiceId]||[]).push(u); });
    Object.entries(byI).forEach(([iid,l])=>{ if(l.length>1){ const sig = {}; l.forEach(u=>{ const k=u.minutes+'|'+JSON.stringify((u.lines||[]).map(x=>x.lineId)); (sig[k]=sig[k]||[]).push(u); });
      Object.values(sig).forEach(g=>{ if(g.length>1) g.slice(1).forEach(u=>du.push({ ref:'dup-'+u.id, text:`Membership ${m.receiptNo||m.id}: usage ${u.id} duplicates ${g[0].id} on invoice ${u.invoiceNumber||iid} (${fmtDur(u.minutes)})`, fix:{ kind:'usage_dup', mid:m.id, uid:u.id } })); }); } });
  });
  add('hours_balance','error','Membership free-hour balance mismatches', hm, 'Safe repair appends an Adjustment entry so the ledger agrees with the usage history. Over-usage needs a manual look.');
  add('dup_usage','error','Duplicate membership usage transactions', du, 'Safe repair marks the duplicate as reversed and restores its hours (the entry itself is kept).');
  // payments
  const pm = []; [...inv,...arc].forEach(i=>{ const bal=invoiceBalance(i); const paidFlag=i.status==='paid';
    if(bal<0) pm.push({ ref:i.number, text:`${i.number}: paid ${fmt(invoicePaid(i))} but the invoice (after credits) is only ${fmt(i.grandTotal-invoiceCredits(i))}` });
    else if(paidFlag && bal>0) pm.push({ ref:i.number, text:`${i.number}: marked paid but ${fmt(bal)} is still owed`, fix:{ kind:'invoice_status', id:i.id, store:arcMap.has(i.id)&&!inv.some(x=>x.id===i.id)?'archivedInvoices':'invoices' } });
    else if(!paidFlag && bal<=0 && i.status!=='paid' && i.status!==undefined) pm.push({ ref:i.number, text:`${i.number}: nothing is owed but it is not marked paid`, fix:{ kind:'invoice_status', id:i.id, store:arcMap.has(i.id)&&!inv.some(x=>x.id===i.id)?'archivedInvoices':'invoices' } });
    const lp = led.filter(l=>l.invoiceId===i.id && (l.type==='invoice_payment'||l.type==='invoice_refund')).reduce((z,l)=>z+l.amount,0);
    if(led.some(l=>l.invoiceId===i.id) && Math.abs(lp-invoicePaid(i))>0.5) pm.push({ ref:i.number+'-led', text:`${i.number}: payments on the invoice ${fmt(invoicePaid(i))} ≠ payments in the ledger ${fmt(lp)}` });
  });
  add('payment_total','error','Payment totals that do not match invoice totals', pm, 'Status flags can be repaired safely. For amount differences compare the invoice with the ledger and post a Credit/Refund or Adjustment — never edit or delete the payment.');
  const order = { error:0, warn:1 }; issues.sort((a,b)=>order[a.sev]-order[b.sev]);
  let n = 0; issues.forEach(g=>g.items.forEach(it=>{ it.idx = n++; }));
  return { at:Date.now(), counts:{ invoices:inv.length, archived:arc.length, deleted:del.length, sessions:ses.length, customers:cus.length, memberships:mem.length, loyalty:lts.length, ledger:led.length }, issues };
}
/* Repairs: Admin + PIN. Each one only appends correcting records or fixes a link / flag, and writes an audit-log row. */
async function integrityRepairCore(fix, o){
  o = o||{}; await admAuthorize(o.pin); const audit = async(extra)=>{ await createRecord('auditLog', Object.assign({ ts:Date.now(), action:'integrity_repair', invoiceId:null, number:fix.kind, amount:0, by:'Admin' }, extra)); };
  switch(fix.kind){
    case 'loyalty_rebalance': {
      const rows = (await dbAllFresh('loyaltyTx')).filter(t=>(t.customerId||t.mobile)===fix.key).sort((a,b)=>a.ts-b.ts||(a.id-b.id)); let run=0; const ch=[];
      rows.forEach(t=>{ run=rnd2(run+t.points); if(Math.abs((t.balanceAfter||0)-run)>0.005){ ch.push({ id:t.id, was:t.balanceAfter, now:run }); t.balanceAfter=run; } });
      for(const t of rows) if(ch.some(c=>c.id===t.id)) await dbPut('loyaltyTx', t);
      await audit({ reason:'Loyalty running balances recalculated', details:{ customer:fix.key, changed:ch } }); return `Recalculated ${ch.length} running balance(s).`; }
    case 'loyalty_dup_earn': {
      const i = await getInvoiceAny(fix.invoiceId); const mob = i ? await invMobile(i) : ''; if(!i||!mob) throw new Error('Invoice or customer not found.');
      const orig = (await dbAllFresh('loyaltyTx')).filter(t=>t.invoiceId===i.id && t.type==='earn').pop();
      const r = await loyaltyPost(mob,'reverse_earn',-fix.excess,i,`Integrity repair: duplicate award on ${i.number}`,{ originalRef:orig?orig.ledgerRef:null, reason:'Integrity repair' });
      await audit({ reason:'Duplicate loyalty award corrected', details:{ invoice:i.number, excess:fix.excess, loyaltyTx:r.id } }); return `Reversed ${fpts(fix.excess)} duplicate point(s).`; }
    case 'ledger_adjust_points': {
      const c = (await dbAllFresh('customers')).find(x=>x.cid===fix.key||x.mobile===fix.key);
      const e = await ledgerPost({ type:'adjustment', customerId:c?c.cid:(String(fix.key).startsWith('C-')?fix.key:''), mobile:c?c.mobile:'', points:fix.delta, description:'Integrity repair: ledger brought in line with loyalty balance', reason:'Integrity repair' });
      await audit({ reason:'Ledger adjustment (points)', details:{ customer:fix.key, points:fix.delta, ledger:e.id } }); return `Ledger adjusted by ${fpts(fix.delta)} point(s).`; }
    case 'ledger_adjust_hours': {
      const m = await dbGet('memberships', fix.mid); if(!m) throw new Error('Membership not found.');
      const e = await ledgerPost({ type:'adjustment', customerId:m.customerId||'', mobile:m.mobile, membershipId:m.id, hours:fix.delta, description:'Integrity repair: ledger brought in line with free-hour usage', reason:'Integrity repair' });
      await audit({ reason:'Ledger adjustment (hours)', details:{ membership:m.id, hours:fix.delta, ledger:e.id } }); return `Ledger adjusted by ${rnd2(fix.delta)}h.`; }
    case 'usage_dup': {
      const m = await dbGet('memberships', fix.mid); const u = m && (m.usage||[]).find(x=>x.id===fix.uid); if(!m||!u) throw new Error('Usage entry not found.'); if(u.reversed) return 'Already reversed.';
      const e = await ledgerPost({ type:'membership_hours_restored', customerId:m.customerId||'', mobile:m.mobile, invoiceId:u.invoiceId||null, invoiceNumber:u.invoiceNumber||'', membershipId:m.id, hours:rnd2(u.minutes/60), originalRef:u.ledgerRef||null, description:'Integrity repair: duplicate usage reversed', reason:'Integrity repair' });
      u.reversed = true; u.reversedNote = 'Integrity repair: duplicate'; u.reversalRef = e.id; await dbPut('memberships', m);
      await audit({ reason:'Duplicate free-hour usage reversed', details:{ membership:m.id, usage:u.id, hours:rnd2(u.minutes/60), ledger:e.id } }); return `Restored ${fmtDur(u.minutes)}.`; }
    case 'session_unlink': {
      const s = await dbGet('bsessions', fix.id); if(!s) throw new Error('Session not found.'); const was = { invoiceId:s.invoiceId, status:s.status };
      await dbUpdate('bsessions', s.id, d=>{ d.invoiceId=null; delete d.invoiceNumber; delete d.finalizedAt; if(['finalized','paid'].includes(d.status)) d.status='ready'; d.updatedAt=Date.now(); return true; });
      updateLiveCache(await dbGet('bsessions', s.id)); await audit({ reason:'Session unlinked from a missing/deleted invoice', details:{ session:sesCode(s), was } }); return `Session ${sesCode(s)} unlinked.`; }
    case 'drop_active_copy': {
      const a = await dbGet('archivedInvoices', fix.id), i = await dbGet('invoices', fix.id); if(!a||!i) throw new Error('Both copies must exist.');
      await dbDel('invoices', fix.id); await audit({ reason:'Duplicate active copy of an archived invoice removed (archive copy kept)', details:{ invoice:a.number, id:a.id } }); return `Removed the active copy of ${a.number}.`; }
    case 'create_customer': {
      if(await dbGet('customers', fix.mobile)) return 'Customer already exists.';
      const now = new Date().toISOString();
      await dbPut('customers', { mobile:fix.mobile, cid:fix.cid, name:fix.name, email:'', address:'', joined:now, visits:0, gamingSessions:0, gamingHours:0, gamingSpend:0, foodSpend:0, totalSpend:0, lastVisit:now, invoiceIds:[], notes:'Re-created by integrity repair' });
      await audit({ reason:'Missing customer re-created', details:{ mobile:fix.mobile, cid:fix.cid } }); return `Customer ${fix.mobile} re-created.`; }
    case 'invoice_status': {
      const i = await dbGet(fix.store||'invoices', fix.id); if(!i) throw new Error('Invoice not found.'); const was=i.status; i.status = invoiceBalance(i)<=0?'paid':'finalized'; await dbPut(fix.store||'invoices', i);
      await audit({ reason:'Invoice paid/unpaid flag corrected', details:{ invoice:i.number, was, now:i.status } }); return `${i.number}: status ${was} → ${i.status}.`; }
  }
  throw new Error('Unknown repair.');
}

const ARCH_PAGE = 25;
async function archFetch(F, cursor){
  const f = fb(), col = f.collection(f.db,'archivedInvoices'); const q = (F.q||'').trim();
  const t0 = F.from ? new Date(F.from+'T00:00:00').getTime() : null, t1 = F.to ? new Date(F.to+'T23:59:59.999').getTime() : null;
  const inR = r=>(!t0||r.date>=t0)&&(!t1||r.date<=t1);
  if(/^TX-/i.test(q)){ const e = await dbGet('ledger', q.toUpperCase()); if(!e||!e.invoiceId) return { rows:[], done:true }; const r = await dbGet('archivedInvoices', e.invoiceId); return { rows:r&&inR(r)?[r]:[], done:true }; }
  if(q){
    const prefix = state.settings.invoicePrefix||'LVL-INV-'; const up = q.toUpperCase(); const forms = new Set([up]); if(/^\d{1,6}$/.test(q)) forms.add(prefix.toUpperCase()+q.padStart(6,'0'));
    const rows = new Map();
    for(const s of forms){ const snap = await f.getDocs(f.query(col, f.where('number','>=',s), f.where('number','<=',s+''), f.limit(50))); snap.docs.forEach(d=>rows.set(d.data().id, d.data())); }
    const lq = q.toLowerCase(), dg = q.replace(/\D/g,'');
    const custs = (await dbAll('customers')).filter(c=>c.name.toLowerCase().includes(lq) || (dg.length>=3 && c.mobile.includes(dg))).slice(0,8);
    for(const c of custs){ const cid = await ensureCid(c); const snap = await f.getDocs(f.query(col, f.where('customerId','==',cid))); snap.docs.forEach(d=>rows.set(d.data().id, d.data())); }
    return { rows:[...rows.values()].filter(inR).sort((a,b)=>b.date-a.date), done:true };
  }
  const qs = []; if(t0) qs.push(f.where('date','>=',t0)); if(t1) qs.push(f.where('date','<=',t1)); qs.push(f.orderBy('date','desc')); if(cursor!=null) qs.push(f.startAfter(cursor)); qs.push(f.limit(ARCH_PAGE));
  const snap = await f.getDocs(f.query(col, ...qs)); const rows = snap.docs.map(d=>d.data());
  return { rows, cursor:rows.length?rows[rows.length-1].date:cursor, done:rows.length<ARCH_PAGE };
}
function archRowsHtml(rows){ return rows.map(i=>`<div class="card" style="cursor:pointer" onclick="archivedInvoiceModal(${i.id})"><div class="list-item"><div><b>${esc(i.number)}</b> <span class="pill">Archived</span><br><span class="muted" style="font-size:12px">${esc(i.customerName||'')} · ${new Date(i.date).toLocaleDateString('en-IN')}</span></div><div style="text-align:right"><b>${fmt(i.grandTotal)}</b></div></div></div>`).join(''); }

/* ============================================================================
   Production clean-up — reviews and removes the records left behind by the old demo-data generator (that generator no longer exists).
   SAFETY: nothing is ever classified by a name or an amount alone. A record is removed only when it matches the generator's complete
   fingerprint (several independent fields), is tied to the demo run by the records it links to / the time it was made, and nothing
   genuine depends on it. Anything that looks test-like but cannot be proven is FLAGGED for Admin review and left untouched.
   A complete backup is made (and verified) before the first deletion.
   ============================================================================ */
const DEMO_NAMES = ['Arun Kumar','Divya S','Rahul M','Priya R','Karthik V'];
const demoMobile = k=>'90000000'+(10+k);
const demoPair = (name, mob)=>{ const k = DEMO_NAMES.indexOf(name); return k>=0 && mob===demoMobile(k); };
const TESTY = /\b(demo|test|sample|dummy)\b/i;
function demoInvoiceMatches(i, s){
  const p = i.payments||[];
  return demoPair(i.customerName, i.customerMobile) && i.sessionId===s.id && !(i.adjustments&&i.adjustments.length) && !i.notes && !i.orderNo && !i.salesperson && !i.subject
    && p.length===1 && ['UPI','Cash'].includes(p[0].method) && (p[0].amount===i.grandTotal || (p[0].method==='Cash' && p[0].amount===Math.floor(i.grandTotal/2))) && !i.discount && !i.membership && !i.loyaltyValue;
}
async function cleanupScan(){
  const [ses, inv, arc, cus, ven, pur, exp, emp, empTx, mem, lts] = await Promise.all(['bsessions','invoices','archivedInvoices','customers','vendors','purchases','expenses','employees','employeeTx','memberships','loyaltyTx'].map(dbAllFresh));
  const kept = new Set((state.settings && state.settings.cleanupKept) || []);
  const C = { sessions:[], invoices:[], customers:[], vendors:[], purchases:[], expenses:[], employees:[], loyaltyTx:[] }, flagged = [];
  const flag = (store, id, label, reason)=>{ if(!kept.has(store+':'+id) && !flagged.some(f=>f.store===store && String(f.id)===String(id))) flagged.push({ store, id, label, reason }); };
  const allInv = [...inv, ...arc];
  // 1) gaming sessions that carry the generator's marker, confirmed against the invoice they produced
  const demoSes = new Set(), demoInv = new Set(), runTimes = [];
  for(const s of ses){
    if(!(s.notes==='Demo' || s.groupName==='Demo group')) continue;
    let ok = false, i = null;
    if(s.groupName==='Demo group' && !s.notes && !s.invoiceId && isOpenStatus(s.status) && !s.customerName && !s.customerMobile) ok = true;
    else if(s.notes==='Demo' && !s.groupName && s.invoiceId){ i = allInv.find(x=>x.id===s.invoiceId); ok = !!i && demoInvoiceMatches(i, s); }
    if(ok){ demoSes.add(s.id); if(i) demoInv.add(i.id); runTimes.push(s.updatedAt||s.startTime||0); C.sessions.push({ id:s.id, label:sesCode(s) }); if(i) C.invoices.push({ id:i.id, label:i.number+' · '+fmt(i.grandTotal) }); }
    else flag('bsessions', s.id, sesCode(s), 'Carries the demo marker, but its invoice or contents differ from what the demo generator made (edited, other customer or payment).');
  }
  const run = demoSes.size>0; const nearRun = t=>runTimes.some(r=>Math.abs(r-t) < 3*3600*1000);
  // 2) customers: demo phone + name pair, and every record tied to them came from the demo run

async function cleanupRun(pin){
  await admAuthorize(pin);
  const R = await cleanupScan(); const C = R.confirmed;
  if(!R.total) return { removed:{}, backup:null, issues:0, nothing:true };
  // ---- 1. complete backup first; nothing is deleted unless it was built, verified and saved ----
  const data = await buildBackup();
  const check = validateBackup(JSON.parse(JSON.stringify(data)));
  if(!check.ok) throw new Error('The safety backup could not be verified, so nothing was deleted. '+check.error);
  const name = backupFileName().replace('Backup','PreCleanup-Backup');
  await recoverySave('pre-cleanup', { when:Date.now(), name, data });
  saveBlobFile(data, name); await recordBackupTime();
  // ---- 2. delete dependents before the things they depend on ----
  const removed = { invoices:0, sessions:0, loyaltyTx:0, purchases:0, vendors:0, expenses:0, employees:0, customers:0 }; const days = new Set(); const problems = [];
  const step = async(label, fn)=>{ try{ await fn(); }catch(e){ console.error('cleanup step failed', label, e); problems.push(label+': '+(e&&e.message||e)); } };
  for(const x of C.invoices){ await step('invoice '+x.label, async()=>{
    const inv = await getInvoiceAny(x.id); if(!inv) return; days.add(dateKey(inv.date));
    await deleteInvoiceCore(x.id, { pin, reason:'Test-data cleanup', sessionMode:'delete', reverseAccounts:true }); await purgeInvoiceCore(x.id, { pin, reason:'Test-data cleanup' }); removed.invoices++; }); }
  for(const x of C.sessions){ await step('session '+x.label, async()=>{ const s = await dbGet('bsessions', x.id); if(!s) return; if(s.invoiceId && await getInvoiceAny(s.invoiceId)) return; await dbDel('bsessions', x.id); liveSessions = liveSessions.filter(y=>y.id!==x.id); removed.sessions++; }); }
  // loyalty rows of the removed customers — re-read now, because deleting their invoices just posted reversal rows too
  const gone = new Set(C.customers.map(x=>x.id));
  await step('loyalty', async()=>{ for(const t of await dbAllFresh('loyaltyTx')){ if(gone.has(t.mobile)){ await dbDel('loyaltyTx', t.id); removed.loyaltyTx++; } } });
  for(const x of C.purchases){ await step('purchase', async()=>{ await dbDel('purchases', x.id); removed.purchases++; }); }
  for(const x of C.vendors){ await step('vendor', async()=>{ await dbDel('vendors', x.id); removed.vendors++; }); }
  for(const x of C.expenses){ await step('expense', async()=>{ const e = await dbGet('expenses', x.id); if(!e) return; days.add(dateKey(e.date)); await creditAccount(e.payMethod, e.amount); await dbDel('expenses', x.id); removed.expenses++; }); }
  for(const x of C.employees){ await step('employee', async()=>{ await dbDel('employees', x.id); removed.employees++; }); }
  for(const x of C.customers){ await step('customer', async()=>{ const c = await dbGet('customers', x.id); if(!c) return; await dbDel('customers', x.id); removed.customers++;
    await ledgerPost({ type:'customer_purge', customerId:c.cid||'', mobile:c.mobile, description:`Customer ${c.name} removed — confirmed test data`, reason:'Test-data cleanup' }); }); }
  // ---- 3. recalculate what was derived from the removed records, drop cached summaries ----
  await step('daily totals', async()=>{ for(const d of days){ await updateDailyRecord(d); const r = await dbGet('dailyRecords', d); if(r && !r.invoiceCount && !r.expenseCount) await dbDel('dailyRecords', d); } });
  for(const k in __repCache) delete __repCache[k];
  // ---- 4. orphan check ----
  let issues = 0; await step('orphan check', async()=>{ const scan = await integrityScan(); issues = scan.issues.reduce((a,g)=>a+g.items.length,0); __integ = scan; });
  const rest = await cleanupScan();
  const summary = { at:Date.now(), removed, backup:name, issues, problems, flagged:rest.flagged.length };
  await patchSettings({ cleanupDone: summary });
  await createRecord('auditLog', { ts:Date.now(), action:'test_data_cleanup', invoiceId:null, number:'cleanup', amount:0, by:'Admin', reason:'Removed confirmed test data ('+Object.entries(removed).filter(([,n])=>n).map(([k,n])=>n+' '+k).join(', ')+'); backup '+name, removed, problems, flagged:rest.flagged.length });
  return summary;
}

function ledgerPaint(){

async function ledgerMore(){ if(__led.busy||__led.done) return; __led.busy = true; try{ const r = await ledgerFetch(); __led.rows = __led.rows.concat(r.rows); __led.cursor = r.cursor; __led.done = r.done; }catch(e){ tell('Could not read the ledger: '+(e.message||e)); } __led.busy = false; ledgerPaint(); }

async function addExpense(){
  const category = document.getElementById('expCat').value;
  const desc = document.getElementById('expDesc').value;
  const amount = Number(document.getElementById('expAmt').value);
  const payMethod = document.getElementById('expPay').value;
  const recurring = document.getElementById('expRecurring').checked;
  if(!amount) return tell('Enter a valid amount.');
  if(recurring){
    const freq = document.getElementById('expFreq').value;
    const next = new Date(); if(freq==='Monthly') next.setMonth(next.getMonth()+1); else next.setDate(next.getDate()+7);
    await dbPut('expenses', { category, desc, amount, frequency:freq, isTemplate:true, nextDue: next.getTime(), date: Date.now() });
  } else {
    await dbPut('expenses', { category, desc, amount, date:Date.now(), payMethod, vendor:(document.getElementById('expVendor')||{value:''}).value.trim(), receipt:(document.getElementById('expReceipt')||{value:''}).value.trim() });
    await debitAccount(payMethod, amount);
    await updateDailyRecord(dateKey(Date.now()));
  }
  render();
}
async function logRecurring(templateId){
  const t = await dbGet('expenses', templateId);
  await dbPut('expenses', { category:t.category, desc:t.desc+' (recurring)', amount:t.amount, date:Date.now(), payMethod:'Cash' });
  await debitAccount('Cash', t.amount);
  const next = new Date(t.nextDue); if(t.frequency==='Monthly') next.setMonth(next.getMonth()+1); else next.setDate(next.getDate()+7);
  t.nextDue = next.getTime(); await dbPut('expenses', t);
  await updateDailyRecord(dateKey(Date.now()));
  render();
}

  if(!(total>0)) return '<div class="muted rp-empty">No data for this selection.</div>';

      segs.push(`<path d="${d}" fill="${it.color}" stroke="var(--panel)" stroke-width="1.5" tabindex="0" ${tipAttr(tip)}><title>${esc(tip.replace(/\|/g,' · '))}</title></path>`);
    }

  });
  const mid = o.donut ? `<text x="100" y="97" text-anchor="middle" style="fill:var(--muted);font-size:10px">${esc(o.centerLabel||'Total')}</text><text x="100" y="114" text-anchor="middle" style="fill:var(--text);font-size:14px;font-weight:600">${fmt(total)}</text>` : '';
  const legend = items.map(it=>`<div class="rp-lg" ${tipAttr(it.label+'|'+fmt(it.value)+'|'+(total>0?(it.value/total*100).toFixed(1):'0.0')+'% of total')}><i style="background:${it.color}"></i><span class="n">${esc(it.label)}</span><span class="v">${fmt(it.value)}</span><span class="p">${total>0?(it.value/total*100).toFixed(1):'0.0'}%</span></div>`).join('');
  return `<div class="rp-pie"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(o.label||'Chart')}">${segs.join('')}${mid}</svg><div class="rp-legend">${legend}</div></div>`;
}
function axisSvg(W, H, m, sc, gridFmt){
  let s=''; for(let v=sc.lo; v<=sc.hi+sc.step/2; v+=sc.step){ const y = m.t + (H-m.t-m.b)*(1-(v-sc.lo)/(sc.hi-sc.lo)); s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="${v===0?1.2:.6}"/><text x="${m.l-5}" y="${(y+3).toFixed(1)}" text-anchor="end" style="fill:var(--muted);font-size:9px">${gridFmt(v)}</text>`; }
  return s;
}
function xLabels(B, W, m, every){ const bw=(W-m.l-m.r)/B.length; return B.map((b,i)=> i%every===0 ? `<text x="${(m.l+bw*(i+.5)).toFixed(1)}" y="${m.b2}" text-anchor="middle" style="fill:var(--muted);font-size:9px">${esc(b.label)}</text>` : '').join(''); }
function barsSvg(B, series, o){   // grouped vertical bars; series:[{name,color,vals}]
  o = o||{}; const n=B.length, ns=series.length, H=o.h||210, m={l:42,r:8,t:10,b:30,b2:H-12};
  const bw = Math.max(ns*9+8, 18), W = Math.max(320, m.l+m.r+n*bw), every = Math.max(1, Math.ceil(n/Math.floor((W-m.l-m.r)/44)));
  const max = Math.max(0,...series.flatMap(s=>s.vals)), sc = niceScale(0,max), slot=(W-m.l-m.r)/n, gw=Math.min(slot*0.78, ns*22), bwid=gw/ns;

function lineSvg(B, series, o){   // series:[{name,color,vals}]; handles negatives

    s.vals.forEach((v,i)=>{ const t=B[i].title+'|'+series.map(z=>z.name+': '+fmt(z.vals[i])).join('|'); g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${n>40?1.6:3}" fill="${s.color}"/><circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="11" fill="transparent" ${tipAttr(t)}/>`; });

function hbars(rows, o){   // rows:[{label,value,color,sub,tip}]

function setupChartTips(){
  const tip = document.createElement('div'); tip.id='chartTip'; tip.hidden=true; document.body.appendChild(tip);
  const show = (el, x, y)=>{ const parts = (el.getAttribute('data-tip')||'').split('|'); tip.innerHTML = '<b>'+esc(parts[0])+'</b>'+parts.slice(1).map(p=>'<div>'+esc(p)+'</div>').join(''); tip.hidden=false;
    const w=tip.offsetWidth, h=tip.offsetHeight; tip.style.left = Math.max(6,Math.min(innerWidth-w-6, x-w/2))+'px'; tip.style.top = Math.max(6, y-h-14)+'px'; };
  const find = e=>e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  document.addEventListener('pointerover', e=>{ if(e.pointerType!=='mouse') return; const el=find(e); if(el) show(el,e.clientX,e.clientY); else tip.hidden=true; });
  document.addEventListener('pointerdown', e=>{ const el=find(e); if(el) show(el,e.clientX,e.clientY); else tip.hidden=true; });
  document.addEventListener('focusin', e=>{ const el=find(e); if(el){ const b=el.getBoundingClientRect(); show(el,b.left+b.width/2,b.top); } });
  window.addEventListener('scroll', ()=>{ tip.hidden=true; }, {passive:true});
}

async function moveSetup(id, dir){
  if(!needAdmin()) return; const sts=(await dbAll('stations')).sort((a,b)=>(a.order||0)-(b.order||0)); const i=sts.findIndex(x=>x.id===id), k=i+dir; if(i<0||k<0||k>=sts.length) return;
  sts.forEach((x,ix)=>{ x.order=ix+1; }); const t=sts[i].order; sts[i].order=sts[k].order; sts[k].order=t;
  await dbPut('stations',sts[i]); await dbPut('stations',sts[k]); render();
}
async function moveVariant(id, n, dir){
  if(!needAdmin()) return; const st=await dbGet('stations',id); const arr=setupPlayers(st); const i=arr.indexOf(n), k=i+dir; if(i<0||k<0||k>=arr.length) return;
  [arr[i],arr[k]]=[arr[k],arr[i]]; st.variantOrder=arr; await dbPut('stations',st); render();
}
async function toggleVariant(id, n){
  if(!needAdmin()) return; const st=await dbGet('stations',id); st.variantOff=st.variantOff||{}; if(st.variantOff[n]) delete st.variantOff[n]; else st.variantOff[n]=true; await dbPut('stations',st); render();
}

async function saveStation(id){
  if(!needAdmin()) return; const g=x=>document.getElementById(x); const name=g('seName').value.trim(); if(!name){ tell('Enter a name for this setup.'); return; }
  const max=Number(g('seMax').value); const rates={};
  for(let n=1;n<=max;n++){ const h=Number(g(`seR${n}h`).value), f=Number(g(`seR${n}f`).value); if(!(h>=0)||!(f>=0)||g(`seR${n}h`).value===''){ tell('Enter valid rates for every player count.'); return; } rates[n]=[h,f]; }
  const all = await dbAll('stations'); const st = id ? await dbGet('stations', id) : { code:'ST'+Date.now(), order:Math.max(0,...all.map(x=>x.order||0))+1 };
  Object.assign(st, { label:name, console:g('seConsole').value.trim()||name, tv:g('seTv').value.trim(), type:g('seType').value, active:g('seActive').checked, rates });
  st.category = g('seCat').value.trim() || defaultCategory(st);
  if(st.variantOff) Object.keys(st.variantOff).forEach(k=>{ if(Number(k)>max) delete st.variantOff[k]; });
  if(st.variantOrder) st.variantOrder = st.variantOrder.filter(n=>n<=max);
  await dbPut('stations', st); closeModal(); showToast('Setup saved'); render();
}
async function setupInUse(id){ return (await dbAll('bsessions')).some(x=>isOpenStatus(x.status) && x.lines.some(l=>l.kind==='gaming' && l.stationId===id && l.state!=='ended')); }
async function deleteStation(id){
  if(!needAdmin()) return;
  if(await setupInUse(id)){ tell('This setup is used by a running gaming segment. End that segment first. (To hide it, Edit and switch Active off.)'); return; }
  if(!(await askConfirm('Delete this setup and all its variants? Past invoices keep their own snapshot. To hide it temporarily, edit it and turn Active off instead.','Delete',true))) return;
  await dbDel('stations', id); render();
}

async function addCustomRule(){

async function hashPin(p){
  try{ if(window.crypto && crypto.subtle){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lvl:'+p)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  let h=5381; const t='lvl:'+p; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return 'x'+(h>>>0).toString(16);
}

    <div class="muted" style="font-size:11px;margin-top:6px">${s.adminPinHash?'Admin mode needs the PIN.':'No Admin PIN is set — anyone can switch to Admin. Set a PIN below to protect it.'} This is a convenience lock on this device, not bank-grade security.</div></div>

async function switchRole(role){
  if(role==='staff'){ localStorage.setItem('lvl_role','staff'); showToast('Staff mode'); render(); return; }
  const h = state.settings.adminPinHash;
  if(!h){ localStorage.setItem('lvl_role','admin'); showToast('Admin mode'); render(); return; }

}
async function confirmAdminPin(){
  const v=document.getElementById('rolePin').value; if((await hashPin(v))!==state.settings.adminPinHash){ tell('Wrong PIN.'); return; }
  localStorage.setItem('lvl_role','admin'); closeModal(); showToast('Admin mode'); render();
}
async function savePerms(){
  if(!needAdmin()) return; const perm={}; ['staffEditPrice','staffDiscount','staffCreateItem','staffDeleteLines','staffCancelSession','staffCredit'].forEach(k=>perm[k]=document.getElementById('pm_'+k).checked);
