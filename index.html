<style>
/* LVL Books — minimalist POS theme. Static, low-contrast chrome; one accent colour; no glow, gradients or motion. */
:root{
  --bg:#101113; --panel:#17181b; --panel2:#1e2024; --line:#2a2d32; --text:#e7e9ec; --muted:#8f969f;
  --accent:#5b8def; --accent-ink:#0b1220; --green:#4fb286; --amber:#d3a24a; --red:#e06c6c;
  --neon:var(--accent); --neon2:var(--accent); --pink:var(--accent);
  --nav-h:56px; --foot-h:0px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f1f3; --line:#dcdfe4; --text:#16181c; --muted:#5d646e; --accent:#2f63c9; --accent-ink:#ffffff; --green:#237a55; --amber:#8f6510; --red:#b84040; }
}
:root[data-theme="light"]{ --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f1f3; --line:#dcdfe4; --text:#16181c; --muted:#5d646e; --accent:#2f63c9; --accent-ink:#ffffff; --green:#237a55; --amber:#8f6510; --red:#b84040; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px;scroll-padding-bottom:calc(var(--nav-h) + var(--foot-h) + 24px)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.35;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.modal-open{overflow:hidden}
/* The document itself scrolls (no nested scroller). Bottom space = nav + any sticky footer + safe area, so the last control is always reachable. */
.app{max-width:560px;margin:0 auto;padding:8px 14px calc(var(--nav-h) + var(--foot-h) + 36px + env(safe-area-inset-bottom,0px))}
body.nonav{--nav-h:0px}
body.nonav .navbar{display:none}
body.hasfoot{--foot-h:76px}
body.hasfoot.tall{--foot-h:112px}
h1,h2,h3{margin:0 0 8px;font-weight:600}
h2{font-size:19px} h3{font-size:16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;margin:0 -14px 8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.4px;font-size:15px}
.brand span{color:var(--muted);font-weight:500}
#installBtn,#themeBtn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;margin-left:6px;min-height:32px}
#installBtn{display:none}
.topbar-actions{display:flex;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card.glow{border-color:var(--line)}
.row{display:flex;gap:8px}
.col{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.stat .v{font-size:18px;font-weight:600}
.stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 12px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;width:100%;min-height:44px;font-family:inherit}
.btn:active{background:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:active{filter:brightness(.92)}
.btn.pink{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn.green{background:transparent;border-color:var(--green);color:var(--green)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:7px 10px;font-size:13px;width:auto;min-height:36px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 11px;border-radius:6px;font-size:16px;font-family:inherit;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:auto;min-height:0}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.pill.green{color:var(--green);border-color:var(--green)}
.pill.amber{color:var(--amber);border-color:var(--amber)}
.pill.red{color:var(--red);border-color:var(--red)}
.pill.neon{color:var(--accent);border-color:var(--accent)}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.navbtn{flex:1;text-align:center;padding:7px 2px 6px;color:var(--muted);font-size:11px;background:none;border:none;min-height:var(--nav-h);font-family:inherit;cursor:pointer}
.navbtn.active{color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.navbtn .ic{display:block;margin:0 auto 2px;width:22px;height:22px}
.navbtn .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.chip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);margin:3px 6px 3px 0;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{border-color:var(--accent);color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.modal{background:var(--panel);border-radius:10px 10px 0 0;width:100%;max-width:560px;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px));
  max-height:calc(var(--vvh,100dvh) - 12px);max-height:calc(var(--vvh,100vh) - 12px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-bottom:none}
.close{float:right;background:none;border:none;color:var(--muted);font-size:22px;min-height:36px;min-width:36px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
.right{text-align:right}
.total-row{font-weight:600;font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.bar-row{margin:6px 0}
.bar-track{background:var(--panel2);border-radius:3px;height:8px;overflow:hidden;margin-top:3px}
.bar-fill{height:100%;background:var(--accent);border-radius:3px}
.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:4px}
/* ---- POS picker ---- */
.catbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.catbar::-webkit-scrollbar{display:none}
.catbar .chip{margin:0;flex:0 0 auto}
.pos-head{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);padding:6px 0 0;margin:0 -14px;padding-left:14px;padding-right:14px}
.posrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:6px}
.posrow.sel{border-color:var(--accent)}
.posrow .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.posrow .sub{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:0;flex:0 0 auto}
.stepper button{width:40px;height:40px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
.stepper button:first-child{border-radius:6px 0 0 6px}.stepper button:last-child{border-radius:0 6px 6px 0;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper .q{min-width:38px;height:40px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.footbar .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.footbar .sum{flex:1;font-size:13px;min-width:0}
.footbar .inner.stack{flex-wrap:wrap;gap:8px}
.footbar .inner.stack .sum{flex:1 1 100%;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.footbar .inner.stack .sum .muted{font-size:11px}
.footbar .inner.stack .btn{padding:10px 12px}
.footbar .sum b{font-size:15px}
.footbar .btn{width:auto;flex:0 0 auto;padding:11px 16px}
/* ---- in-app dialogs (replace native alert/confirm, which browsers can silently block) ---- */
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:420px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;padding:16px}
.dlg p{margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap}
.dlg .acts .btn{flex:1 1 120px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--foot-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:50;max-width:90%;text-align:center}
.banner{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--foot-h) + 12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--panel);border:1px solid var(--amber);border-left:4px solid var(--amber);padding:12px;border-radius:6px;max-width:536px;margin:0 auto}
/* ---- Active session cards: the WHOLE card is one tap target (a transparent button stretched over the card);
   the action buttons sit above it, so tapping them never opens the session and no click handlers are nested. ---- */
.sess-card{position:relative;overflow:hidden}
.sess-open{position:absolute;inset:0;z-index:1;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:inherit;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
@media (hover:hover){.sess-open:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}}
.sess-open:active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sess-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sess-card:has(.sess-open:active){border-color:var(--accent)}
.sess-card .sess-acts .btn{position:relative;z-index:2}
.sess-3{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}.sess-3 .btn{min-height:44px;padding:8px 6px}
.sess-chev{color:var(--muted);font-size:20px;line-height:1;margin-left:6px;vertical-align:middle}
/* ---- top bar back / home ---- */
.tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:6px;min-height:36px;min-width:36px;padding:0;cursor:pointer}
.tb-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-btn:active{background:var(--line)}
.catbar,.modal{overscroll-behavior-x:contain}
/* ---- admin invoice management ---- */
.adm-row .list-item{align-items:flex-start}
.adm-main{flex:1;min-width:0;cursor:pointer}
.adm-chk input{width:22px;height:22px;margin:2px 4px 0 0}
.adm-bulk{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);padding:6px 0}
/* ---- refresh in place: the browser's own pull-to-refresh would reload the whole page, so it is switched off ---- */
html,body{overscroll-behavior-y:contain}
@keyframes lvlspin{to{transform:rotate(360deg)}}
.tb-btn.spin svg{animation:lvlspin .8s linear infinite}
#topProg{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:2px;width:0;background:var(--accent);z-index:60;opacity:0;pointer-events:none}
#topProg.on{opacity:1;width:70%;transition:width 1.2s ease-out}
#topProg.done{opacity:0;width:100%;transition:width .2s,opacity .35s .15s}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 50px);width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;z-index:45;opacity:0;pointer-events:none;transform:translateY(-70px)}
#ptr svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ptr.spin svg{animation:lvlspin .8s linear infinite}
.netchip{font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:3px 7px;margin-right:6px}
.netchip[hidden]{display:none}
.skel{height:14px;border-radius:4px;background:var(--line);margin:12px 0;opacity:.55}
.navbtn{position:relative}
.navbtn .dot{position:absolute;top:6px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--amber)}
@media (prefers-reduced-motion:reduce){.tb-btn.spin svg,#ptr.spin svg{animation:none;opacity:.5}}
/* ---- Time's-up notification: a dismissible banner, never a blocking dialog ---- */
#alertStack{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:35;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
.tu{pointer-events:auto;width:100%;max-width:536px;background:var(--panel);border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:6px;padding:10px 12px;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .22s,opacity .22s}
.tu .tu-a,.tu .tu-x{display:flex;gap:8px;margin-top:8px}
.tu .tu-a .btn,.tu .tu-x .btn{flex:1}
.tu .tu-x[hidden]{display:none}
.tu button{touch-action:manipulation}

/* ---- Zoho-style transaction screens: black canvas, charcoal cards, restrained green ---- */
/* ---- checkout payment cards ---- */
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paytile{position:relative;min-height:54px;padding:8px 6px;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;font:600 15px/1.15 inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-appearance:none;appearance:none}
.paytile:active{background:var(--line)}
.paytile.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 24%,var(--panel2));color:#fff;box-shadow:inset 0 0 0 1px var(--accent)}
.paytile.sel::after{content:"✓";position:absolute;top:3px;right:7px;font-size:12px;font-weight:700;color:var(--accent)}
.payrow{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.payrow:last-of-type{border-bottom:0;margin-bottom:4px}
.payhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.payx{background:transparent;border:0;color:var(--red);font-size:13px;min-height:32px;cursor:pointer}
.payamt{margin-top:10px}.payamt label{margin:0 0 4px}.payby{color:var(--accent)}
.payamt input{font-size:18px;font-weight:600;min-height:48px}
.paynote{margin-top:8px;font-size:12px;color:var(--muted)}
.paysplit{margin-top:8px}
body.zb-on{--bg:#000;--panel:#1c1c1e;--panel2:#2c2c2e;--line:#3a3a3c;--text:#fff;--muted:#8e8e93;--accent:#5b8def;--accent-ink:#0b1220;--green:#5b8def;--ok:#4fb286;--red:#ff5d73;--amber:#f2b84b;color-scheme:dark}
.zb{padding-top:0}
.zhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:grid;grid-template-columns:52px 1fr 52px;align-items:center;margin:0 -14px 4px;padding:8px 14px;min-height:60px}
.zhead h1{margin:0;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zcirc{width:44px;height:44px;border-radius:50%;border:0;background:#2c2c2e;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.zcirc svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.zcirc.ok{background:var(--green);color:var(--accent-ink)}
.zcirc:active{filter:brightness(.85)}
.zh2{font-size:17px;font-weight:600;margin:18px 4px 8px}
.zsec{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.zsec a,.zrow a{color:var(--green);text-decoration:none;text-transform:none;font-size:14px}
.zcard{background:var(--panel);border-radius:16px;padding:2px 16px;margin-bottom:12px}
.zrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line)}
.zrow:last-child{border-bottom:0}
.zrow.tap{cursor:pointer}.zrow.tap:active{background:#ffffff0d}
.zrow .l{color:var(--text);flex:0 1 auto;min-width:0}
.zrow .l.req{color:var(--red)}
.zrow .v{color:var(--green);text-align:right;flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:6px;overflow-wrap:anywhere}
.zrow .ph{color:var(--muted)}

<script>
/* ============ Firestore data layer (real-time, offline-capable) ============ */
/* Same async API as the single-device version (dbAll/dbGet/dbPut/dbDel/dbClear/dbIncrement), so the app
   logic is identical. Every collection is mirrored in an in-memory cache kept fresh by onSnapshot listeners:
   reads are free and instant, and every phone sees every change within about a second.
   Invoices and sessions are loaded for the last 120 days only, so Firestore usage stays small
   for years (daily totals live forever in dailyRecords; older invoices are still fetched one-by-one when opened). */
function fb(){ return window.__fb; }
function waitForFirebase(){
  return new Promise((resolve)=>{
    if(window.__fbReady){ resolve(); return; }
    window.addEventListener('fb-ready', ()=>resolve(), {once:true});
    setTimeout(()=>resolve(), 10000);
  });
}
const KEYPATH = { customers:'mobile', bsessions:'id', invoices:'id', products:'id', expenses:'id', settings:'key', vendors:'id', purchases:'id',
  employees:'id', employeeTx:'id', accounts:'name', dailyRecords:'date', stations:'id', inventoryTx:'id', physical:'id', deletedInvoices:'id', auditLog:'id' };
const AUTOINC = new Set(['bsessions','invoices','products','expenses','vendors','purchases','employees','employeeTx','stations','inventoryTx','physical','auditLog']);
const WINDOWED = { invoices:{field:'date',days:120}, bsessions:{field:'startTime',days:120} };
const __cache = {}, __ready = {};
function clean(v){ return v===undefined ? v : JSON.parse(JSON.stringify(v)); }   // deep copy; also strips undefined (Firestore rejects it)
function writeAck(p){   // never let a missing signal freeze the UI: wait briefly for the server, then continue (the write is queued locally)
  p.catch(e=>{ console.error('Cloud write failed', e); try{ showToast('⚠️ A change could not be saved to the cloud: '+(e.code||e.message)); }catch(_){} });
  return Promise.race([p, new Promise(res=>setTimeout(res,3000))]);
}
async function nextId(store){
  const f = fb(); const ref = f.doc(f.db,'counters',store);
  try{ return await f.runTransaction(f.db, async t=>{ const snap=await t.get(ref); const n=(snap.exists()?(snap.data().n||0):0)+1; t.set(ref,{n}); return n; }); }
  catch(e){ return Math.floor(Date.now()/1000)*100 + Math.floor(Math.random()*100); }   // offline fallback: unique, not sequential
}
async function dbAll(store){
  if(__ready[store]) return clean([...__cache[store].values()]);
  const f = fb(); const snap = await f.getDocs(f.collection(f.db, store)); return snap.docs.map(d=>d.data());
}
async function dbGet(store, key){
  const k = String(key);
  if(__ready[store] && __cache[store].has(k)) return clean(__cache[store].get(k));
  if(__ready[store] && !WINDOWED[store]) return undefined;
  const f = fb(); const snap = await f.getDoc(f.doc(f.db, store, k)); return snap.exists() ? snap.data() : undefined;
}
async function dbPut(store, val){
  const f = fb(); const kp = KEYPATH[store] || 'id'; val = Object.assign(val, clean(val));   // strip undefined in place
  if(AUTOINC.has(store) && (val[kp]===undefined || val[kp]===null)) val[kp] = await nextId(store);
  const data = clean(val); const k = String(val[kp]);
  if(__ready[store]) __cache[store].set(k, data);   // write-through: visible to the very next read
  await writeAck(f.setDoc(f.doc(f.db, store, k), data));
  return val[kp];
}
async function dbDel(store, key){
  const f = fb(); const k = String(key); if(__ready[store]) __cache[store].delete(k);
  await writeAck(f.deleteDoc(f.doc(f.db, store, k)));
}
async function dbClear(store){
  const f = fb(); const snap = await f.getDocs(f.collection(f.db, store)); const docs = snap.docs;
  for(let i=0;i<docs.length;i+=400){ const b=f.writeBatch(f.db); docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await writeAck(b.commit()); }
  if(__ready[store]) __cache[store].clear();
}
async function dbIncrement(store, key, field){   // atomic across devices (so two phones can never issue the same invoice number)
  const f = fb(); const k = String(key); const ref = f.doc(f.db, store, k);
  try{
    const v = await f.runTransaction(f.db, async t=>{ const snap=await t.get(ref); const d=snap.exists()?snap.data():{}; const cur=d[field]||1; t.set(ref, Object.assign({}, d, {[field]:cur+1})); return cur; });
    if(__ready[store] && __cache[store].has(k)) __cache[store].get(k)[field] = v+1;
    return v;
  }catch(e){ const d=(await dbGet(store,key))||{}; const v=d[field]||1; d[field]=v+1; await dbPut(store,d); return v; }
}
async function dbUpdate(store, key, fn){   // read-modify-write as ONE atomic step, so concurrent edits from several phones are never lost
  const f = fb(), k = String(key), ref = f.doc(f.db, store, k);
  try{
    let out;
    const doc = await f.runTransaction(f.db, async t=>{
      const snap = await t.get(ref); const d = snap.exists() ? snap.data() : undefined;
      try{ out = fn(d); }catch(e){ e.__app = true; throw e; }
      t.set(ref, clean(d)); return d;
    });
    if(__ready[store]) __cache[store].set(k, clean(doc));
    return { doc, result:out };
  }catch(e){
    if(e && e.__app) throw e;
    const d = clean(await dbGet(store, key)); const result = fn(d); await dbPut(store, d); return { doc:d, result };   // offline: apply locally, Firestore syncs later
  }
}
let __renderTimer = null;
function scheduleRender(){   // debounced; never repaints while someone is typing in a form field
  clearTimeout(__renderTimer);
  __renderTimer = setTimeout(()=>{
    if(state.screen==='backup') return;   // static screen: a background sync must never wipe the backup file you just chose
    const a = document.activeElement, root = document.getElementById('root');
    if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && root.contains(a)){ scheduleRender(); return; }
    try{ render(); }catch(e){}
  }, 300);
}
function startSync(){
  const f = fb();
  return new Promise(resolveAll=>{
    let pending = ALL_STORES.length; const done = ()=>{ if(--pending===0) resolveAll(); };
    ALL_STORES.forEach(store=>{
      let first = true; const w = WINDOWED[store]; const col = f.collection(f.db, store);
      const q = w ? f.query(col, f.where(w.field, '>=', Date.now()-w.days*86400000)) : col;
      f.onSnapshot(q, snap=>{
        __cache[store] = new Map(snap.docs.map(d=>[d.id, d.data()])); __ready[store] = true;
        if(store==='bsessions') liveSessions = snap.docs.map(d=>d.data()).filter(x=>isOpenStatus(x.status));
        if(store==='settings'){ const m = __cache.settings.get('main'); if(m) state.settings = m; }
        if(first){ first=false; done(); } else scheduleRender();
      }, err=>{ console.error('Real-time sync error on', store, err); if(first){ first=false; done(); } });
    });
    setTimeout(()=>resolveAll(), 6000);   // never hold the app hostage to the network
  });
}

/* A "gaming setup" is a configurable catalogue entry; its VARIANTS (one per player count, with its own hourly and
   30-minute rate) are what staff tap in the POS picker. New setups (e.g. a gaming PC) get their variants automatically. */
function setupLabel(st){ return st.label || st.console; }
function variantName(st, n){ return `${setupLabel(st)} — ${n} Player${n>1?'s':''}`; }
function setupPlayers(st){
  const ks = Object.keys(st.rates||{}).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
  const ord = (st.variantOrder||[]).map(Number).filter(n=>ks.includes(n)); return [...ord, ...ks.filter(n=>!ord.includes(n))];
}
function setupVariants(st){ return setupPlayers(st).filter(n=>!(st.variantOff && st.variantOff[n])).map(n=>({ players:n, hr:st.rates[n][0], half:st.rates[n][1], name:variantName(st,n) })); }
function defaultCategory(st){ return st.type==='pc' ? 'Gaming — Gaming PCs' : 'Gaming — '+setupLabel(st); }

/* ============ Helpers & billing math ============ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmt(n){ return '₹' + Math.round(n||0).toLocaleString('en-IN') }
function fmtDur(mins){ mins=Math.round(mins||0); const h=Math.floor(mins/60), m=mins%60; return ((h?h+'h ':'') + (m?m+'m':'')).trim() || '0m'; }
function todayStr(){ return new Date().toDateString(); }
function isToday(ts){ return new Date(ts).toDateString()===todayStr(); }
function startOfWeek(){ const d=new Date(); const day=d.getDay(); d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d.getTime(); }
function startOfMonth(){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); }
function inRange(ts, range, custStart, custEnd){
  if(range==='today') return isToday(ts);
  if(range==='week') return ts>=startOfWeek();
  if(range==='month') return ts>=startOfMonth();
  if(range==='custom') return ts>=custStart && ts<=custEnd;
  return true;
}
function ymd(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function normMobile(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(d.length===12 && d.startsWith('91')) d = d.slice(2);
  else if(d.length===11 && d.startsWith('0')) d = d.slice(1);
  return /^[6-9]\d{9}$/.test(d) ? d : null;
}
function waLink(mobile10, text){ return 'https://wa.me/91'+mobile10+'?text='+encodeURIComponent(text); }
function stationName(st){ return st ? setupLabel(st) : 'Unknown setup'; }
function bucketForType(t){ return t==='food'||t==='beverage'||t==='combo' ? 'food' : 'other'; }

/* Duration: integer minutes internally. Input may be minutes or decimal hours. */
function toMinutes(value, unit){ const v=Number(value); if(!isFinite(v)||v<=0) return NaN; return unit==='hours' ? Math.round(v*60) : Math.round(v); }
function durationPolicy(){ const s=state.settings||{}; return { custom:!!s.customDurationsEnabled, rules:s.customRules||[] }; }
function validateMinutes(min, pol){
  if(!Number.isInteger(min) || min<=0) return 'Enter a duration greater than zero.';
  if(!pol.custom && min%30!==0) return 'Custom durations are off. Use multiples of 30 minutes, or ask an admin to enable Custom Duration Rules in Settings.';
  return '';
}
/* Standard LVL policy: whole hours at the hourly rate + a 30-minute block at the half-hour rate.
   Only when custom durations are enabled: a configured rule for the leftover minutes wins,
   otherwise the leftover is charged proportionally to the hourly rate. */
function gamingCharge(min, hr, half, pol){
  const hours=Math.floor(min/60), rem=min%60; let total=hours*hr;
  if(rem===0) return total;
  if(rem===30) return total+half;
  const rule=(pol.rules||[]).find(r=>Number(r.minutes)===rem);
  if(rule) return total + (rule.mode==='flat' ? Math.round(Number(rule.value)) : Math.round(hr*Number(rule.value)/100));
  return total + Math.round(hr*rem/60);
}
/* Recomputes gross/total of one bill line from its own snapshot fields. Called only when the line
   is created or edited, so later price/policy changes never silently alter existing entries. */
function computeLine(l){
  const pol = l.policySnap || durationPolicy();
  if(l.kind==='gaming'){ l.unitPrice=l.hr; l.qty=1; l.unit='hour'; l.gross=gamingCharge(l.minutes, l.hr, l.half, pol); }
  else if(l.kind==='accompany'){ l.gross = l.free ? 0 : Math.round(l.qty*l.unitPrice*l.minutes/60); }
  else { l.gross = Math.round(l.qty*l.unitPrice); }
  const d = Math.min(100, Math.max(0, Number(l.discountPct)||0));
  l.total = Math.round(l.gross*(1-d/100));
  return l;
}
/* Bill totals. Discount % applies ONLY to gaming lines (food is never discounted at invoice level). */
function billTotals(lines, gamingDiscountPct, settings, extra){
  const b={gaming:0,accompany:0,overtime:0,food:0,other:0};
  lines.forEach(l=>{ b[l.bucket||'other'] += l.total; });
  const subtotal = b.gaming+b.accompany+b.overtime+b.food+b.other;
  const pct = Math.min(100, Math.max(0, Number(gamingDiscountPct)||0));
  const discount = Math.round(b.gaming*pct/100);
  let tax = 0;
  if(settings.taxEnabled){
    const taxable = lines.filter(l=>l.taxable!==false).reduce((s,l)=>s+l.total,0);
    const gTaxable = lines.filter(l=>l.taxable!==false && l.bucket==='gaming').reduce((s,l)=>s+l.total,0);
    const dTax = b.gaming>0 ? discount*gTaxable/b.gaming : 0;
    tax = Math.round((taxable - dTax) * (Number(settings.taxRate)||0)/100);
  }
  const x = extra||{}; const adjustment = Math.round(Number(x.adjustment)||0);          // whole rupees: totals stay exact integers
  const tcs = Math.round((subtotal - discount + tax) * (Number(x.tcsPct)||0) / 100);   // collected on top, like tax
  const tds = Math.round((subtotal - discount) * (Number(x.tdsPct)||0) / 100);          // deducted by the customer
  return { ...b, subtotal, discountPct:pct, discount, tax, adjustment, tcs, tds, grand: subtotal - discount + tax + adjustment + tcs - tds };
}
function overtimeUnitLabel(s){
  if(s.overtimeMode==='occurrence') return 'occurrence';
  if(s.overtimeMode==='fixed') return 'fixed charge';
  if(s.overtimeMode==='custom') return s.overtimeCustomUnit||'unit';
  return (s.overtimeBlockMinutes||10)+'-min block';
}

function toCSV(rows){
  if(!rows || !rows.length) return 'no data\n';
  const headers = Object.keys(rows[0]);
  const esc = v=>{ if(v===undefined||v===null) return ''; v = typeof v==='object'? JSON.stringify(v): String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; };
  return [headers.join(','), ...rows.map(r=>headers.map(h=>esc(r[h])).join(','))].join('\n');
}
function downloadCSV(filename, rows){
  const blob = new Blob([toCSV(rows)], {type:'text/csv'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
}

async function loadSettingsAndSeed(){
  let s = await dbGet('settings','main');
  if(!s){ s = JSON.parse(JSON.stringify({ key:'main', ...DEFAULT_SETTINGS })); await dbPut('settings', s); }
  else { let ch=false; for(const [k,v] of Object.entries(DEFAULT_SETTINGS)){ if(s[k]===undefined){ s[k]=JSON.parse(JSON.stringify(v)); ch=true; } } if(ch) await dbPut('settings', s); }
  state.settings = s;
  let prods = await dbAll('products');
  if(prods.length===0){ for(const p of DEFAULT_PRODUCTS) await dbPut('products', { ...p }); prods = await dbAll('products'); }
  for(const sp of SPECIAL_PRODUCTS){ if(!prods.some(p=>p.type===sp.type)) await dbPut('products', { ...sp }); }
  for(const p of prods){   // upgrade catalogue rows created by older versions
    let ch=false;
    if(!p.type){ p.type = p.combo!==undefined ? 'combo' : (p.cat==='Beverages' ? 'beverage' : 'food'); ch=true; }
    if(p.unit===undefined){ p.unit = p.type==='beverage' ? 'bottle' : 'pc'; ch=true; }
    if(p.active===undefined){ p.active=true; ch=true; }
    if(ch) await dbPut('products', p);
  }
  const accs = await dbAll('accounts');
  if(accs.length===0){ for(const a of DEFAULT_ACCOUNTS) await dbPut('accounts', { ...a }); }
  const sts = await dbAll('stations');
  if(sts.length===0){
    const old = await dbGet('settings','consoleRates');   // carry over rates edited in the previous version
    for(const d of DEFAULT_STATIONS){ const st = JSON.parse(JSON.stringify(d)); if(old && old.configs && old.configs[d.code] && old.configs[d.code].rates) st.rates = old.configs[d.code].rates; await dbPut('stations', st); }
  }
  let order=0; for(const st of await dbAll('stations')){   // upgrade setups created by older versions: label, POS category, order
    let ch=false; order++;
    const d=DEFAULT_STATIONS.find(x=>x.code===st.code);
    if(!st.label){ st.label = d ? d.label : st.console; ch=true; }
    if(!st.category){ st.category = d ? d.category : defaultCategory(st); ch=true; }
    if(st.order===undefined){ st.order = d ? d.order : 100+order; ch=true; }
    if(ch) await dbPut('stations', st);
  }
  liveSessions = (await dbAll('bsessions')).filter(x=>isOpenStatus(x.status));
}

function dateKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthKey(dateStr){ return dateStr.slice(0,7); } // YYYY-MM from a YYYY-MM-DD dailyRecords date
function weekKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
  return d.getFullYear()+'-W'+String(week).padStart(2,'0');
}
function aggregateDaily(records, keyFn, limit){
  const map = {};
  records.forEach(r=>{ const k=keyFn(r); if(!map[k]) map[k]={key:k, sales:0, expenses:0}; map[k].sales+=r.sales; map[k].expenses+=r.expenses; });
  return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key)).slice(-limit);
}
async function updateDailyRecord(dateStr){
  const invoices = (await dbAll('invoices')).filter(i=>dateKey(i.date)===dateStr);
  const expenses = (await dbAll('expenses')).filter(e=>!e.isTemplate && dateKey(e.date)===dateStr);
  const sales = invoices.reduce((s,i)=>s+i.grandTotal,0);
  const exp = expenses.reduce((s,e)=>s+e.amount,0);
  const gamingRev = invoices.reduce((s,i)=>s+(i.gamingAmount||0)+(i.accompanyAmount||0)+(i.overtimeAmount||0),0);
  const foodRev = invoices.reduce((s,i)=>s+i.foodAmount,0);
  await dbPut('dailyRecords', { date: dateStr, sales, expenses:exp, net: sales-exp, gamingRev, foodRev, invoiceCount: invoices.length, expenseCount: expenses.length, updatedAt: Date.now() });
}
async function rebuildDailyRecords(){
  const invoices = await dbAll('invoices'); const expenses = await dbAll('expenses');
  const days = new Set([...invoices.map(i=>dateKey(i.date)), ...expenses.filter(e=>!e.isTemplate).map(e=>dateKey(e.date))]);
  for(const d of days){ await updateDailyRecord(d); }
}

/* ---- Android-style navigation ----
   navStack is the in-memory Back stack (screens you can go Back to). The Android Back button / gesture arrives as a browser
   'popstate'; a guard history entry makes sure every Back press is caught by the app instead of closing it.
   Active gaming sessions live in the database, so navigating Back never discards one. */
const NAV_TABS = ['dashboard','gaming','invoices','more'];
const NAV_IDENTITY = ['sessionId','invoiceId','custProfile','vendorId','empId'];
let navStack = [];                       // previous screens, most recent last
let navCur = { screen:'dashboard', scrollY:0 };   // identity of the screen on display
let navBusy = false, navBusyAt = 0, navExiting = false, navExitStep = 0;
function navSnap(){
  const e = { screen:state.screen, scrollY:Math.round(window.scrollY||0) };
  NAV_IDENTITY.forEach(k=>{ if(state[k]!==undefined && state[k]!==null) e[k]=state[k]; });
  if(state.screen==='picker' && state.pick) e.sessionId = state.pick.sid;
  if(state.screen==='itemInfo' && state.ii){ e.sessionId = state.ii.sid; e.iiKey = state.ii.lid ? 'L'+state.ii.lid : 'N'; }
  if(state.screen==='checkout' && state.ckForm) e.sessionId = state.ckForm.sid;
  return e;
}
function navKey(e){
  const id = ['session','picker','checkout','itemInfo'].includes(e.screen) ? e.sessionId+(e.iiKey||'') : e.screen==='invoiceView' ? e.invoiceId : e.screen==='customerProfile' ? e.custProfile : e.screen==='vendorProfile' ? e.vendorId : e.screen==='employeeProfile' ? e.empId : '';
  return e.screen + ':' + (id===undefined||id===null ? '' : id);
}
function go(screen, opts){
  opts = opts||{}; const prevScreen = state.screen;
  navCur.scrollY = Math.round(window.scrollY||0);
  let scroll = 0;
  state.screen = screen;
  const next = navSnap();
  if(NAV_TABS.includes(screen)){      // tab / Dashboard: the Dashboard becomes the root of the stack
    const dashScroll = navCur.screen==='dashboard' ? navCur.scrollY : (navStack[0] && navStack[0].screen==='dashboard' ? navStack[0].scrollY : 0);
    navStack = screen==='dashboard' ? [] : [{ screen:'dashboard', scrollY:dashScroll }];
    if(screen==='dashboard' && navCur.screen==='dashboard') scroll = navCur.scrollY;
  } else {
    let idx = -1; const nk = navKey(next);
    for(let i=navStack.length-1;i>=0;i--){ if(navKey(navStack[i])===nk){ idx=i; break; } }
    if(idx>=0){ scroll = navStack[idx].scrollY||0; navStack.length = idx; }   // going to a screen already in the stack = going back to it
    else if(!opts.replace && !(['picker','checkout'].includes(navCur.screen) && screen==='session') && navKey(navCur)!==nk){ navStack.push(Object.assign({}, navCur)); }
  }
  navCur = next; state.pendingScroll = scroll;
  if(prevScreen!==screen && (ZB_SCREENS.includes(prevScreen)||ZB_SCREENS.includes(screen))) state.anim = 'f';
  return render();   // render() saves the route
}
function navRestore(e){
  NAV_IDENTITY.forEach(k=>{ if(e[k]!==undefined) state[k]=e[k]; });
  if(state.screen!==e.screen && (ZB_SCREENS.includes(state.screen)||ZB_SCREENS.includes(e.screen))) state.anim = 'b';
  state.screen = e.screen; state.billEdSid = null; navCur = Object.assign({}, e); state.pendingScroll = e.scrollY||0;
  return render();
}
/* Things that must be settled before leaving a screen. Returns false if the user chose to stay. */
async function leaveGuard(){
  if(state.screen==='session'){ await persistHeader(state.sessionId, true); }   // unsaved header edits are saved, never lost
  return true;
}
/* One step back. Picker and checkout return to the session bill; everything else returns to the previous screen. */
async function goBack(fallback){
  if(!(await leaveGuard())) return;
  if(state.screen==='itemInfo' && state.ii){ const ii=state.ii; state.ii=null; if(!ii.lid && state.pick) return go('picker'); return openSession(ii.sid); }   // unsaved item changes are discarded
  if(state.screen==='picker' && state.pick){ const sid=state.pick.sid; state.pick=null; return openSession(sid); }
  if(state.screen==='checkout' && state.ckForm){ openSession(state.ckForm.sid); return; }
  const e = navStack.pop();
  if(e) return navRestore(e);
  if(state.screen!=='dashboard') return go(fallback && fallback!==state.screen ? fallback : 'dashboard');
}
async function navTab(id){ if(!(await leaveGuard())) return; if(state.screen==='picker') state.pick=null; if(state.screen==='itemInfo') state.ii=null; go(id); }
function dismissTopLayer(){   // dialogs first, then bottom sheets
  const dlgs = document.querySelectorAll('#dlgRoot .dlg-bg');
  if(dlgs.length){ dlgs[dlgs.length-1].click(); return true; }
  const mr = document.getElementById('modalRoot');
  if(mr && mr.firstElementChild){ const c = mr.querySelector('.close'); if(c) c.click(); else closeModal(); return true; }
  return false;
}
async function handleBack(){
  if(navBusy && Date.now()-navBusyAt < 2500) return; navBusy = true; navBusyAt = Date.now();
  try{
    if(dismissTopLayer()) return;
    if(state.screen==='dashboard' && !navStack.length){
      if(await askConfirm('Exit LVL Books?\n\nOpen gaming sessions stay saved and keep running.','Exit')) exitApp();
      return;
    }
    await goBack();
  } finally { navBusy = false; }
}
function exitApp(){
  try{ const A = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App; if(A && A.exitApp){ A.exitApp(); return; } }catch(e){}
  navExiting = true; navExitStep = 0;
  const i = (history.state && typeof history.state.i==='number') ? history.state.i : 1;
  try{ history.go(-(i+1)); }catch(e){ history.back(); }   // jump back past every app history entry in one step, which closes an installed Android app
  setTimeout(()=>{ if(!document.hidden){ navExiting=false; histFill(true); showToast('Use the Android Home button to leave the app'); } }, 1800);
}

/* ---- History layer ----

   the next tap after any Back press. */

}

  }catch(e){}

  const tap = editable && !reorder ? ` role="button" tabindex="0" aria-label="Edit ${esc(g?gamingTitle(l):l.name)}" onclick="openLineEdit(${s.id},${l.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLineEdit(${s.id},${l.id})}"` : '';
  const desc = zLineDesc(l);
  const times = g ? `<div class="zl-meta">Added ${timeStr(l.startTime||l.createdAt)}${l.physicalName?' · Station: '+esc(l.physicalName):''}</div>` : '';
  const timer = '';
  const acts = '';
  const del = reorder ? `<button type="button" class="zdel" aria-label="Delete ${esc(l.name)}" onclick="deleteLine(${s.id},${l.id})"><span></span></button>` : '';
  const mv = reorder ? `<div class="zmv"><button type="button" aria-label="Move up" onclick="moveLine(${s.id},${l.id},-1)" ${i===0?'disabled':''}>▲</button><button type="button" aria-label="Move down" onclick="moveLine(${s.id},${l.id},1)" ${i===n-1?'disabled':''}>▼</button></div>` : '';
  return `<div class="zline" data-line="${l.id}">
    <div class="zl-row">${del}<div class="zl-main"${tap}>
      <div class="zl-l"><b>${esc(g?gamingTitle(l):l.name)}</b>${l.history&&l.history.length?`<span class="tag">edited ×${l.history.length}</span>`:''}${desc?`<div class="zl-desc">${desc}</div>`:''}${l.notes?`<div class="zl-desc">${esc(l.notes)}</div>`:''}</div>
      <div class="zl-r"><b>${n2(l.total)}</b><div class="zl-qr">${zQtyRate(l)}</div></div></div>${mv}</div>
    ${times}${timer}${acts}</div>`;
}

function zbDue(){
  const d=document.getElementById('sInvDate'), t=document.getElementById('sTerms'), o=document.getElementById('sDue');
  if(d&&t&&o&&d.value) o.textContent = addDaysStr(d.value, DUE_TERMS[t.value]||0);
}
function toggleReorder(){ state.reorder = !state.reorder; render(); }
async function moveLine(sid, lid, dir){
  await act(mutateSession(sid, s=>{ const i=s.lines.findIndex(x=>x.id===lid), k=i+dir; if(i<0||k<0||k>=s.lines.length) return false; const t=s.lines[i]; s.lines[i]=s.lines[k]; s.lines[k]=t; return true; }));
  render();
}

/* ---- header / invoice draft fields (customer has its own sheet) ---- */
async function persistHeader(sid, quiet){
  const g=document.getElementById('sGroup'); if(!g) return true;
  const cur = await dbGet('bsessions', sid); if(!sesEditable(cur)) return true;
  const val = id=>{ const e=document.getElementById(id); return e ? e.value : undefined; };
  const vals = { groupName:g.value.trim(), notes:(val('sNotes')||'').trim() };
  const inv = Object.assign({}, cur.inv||{});
  if(val('sInvDate')) inv.date = val('sInvDate'); if(val('sTerms')) inv.terms = val('sTerms');
  if(val('sOrder')!==undefined) inv.orderNo = val('sOrder').trim(); if(val('sSales')!==undefined) inv.salesperson = val('sSales').trim(); if(val('sSubject')!==undefined) inv.subject = val('sSubject').trim();
  try{ await mutateSession(sid, s=>{ Object.assign(s, vals); s.inv = inv; }); }catch(e){ tell(e.message); return false; }
  return true;
}
async function saveSession(sid){ if(await persistHeader(sid,false)){ showToast('Session saved — it stays open on the dashboard'); go('dashboard'); } }

/* ---- customer: pick an existing one or type a new one (both optional) ---- */
async function customerSheet(sid){
  await persistHeader(sid,true);
  const s = await dbGet('bsessions', sid); if(!sesEditable(s)) return;
  const custs = (await dbAll('customers')).sort((a,b)=>(b.lastVisit||'').localeCompare(a.lastVisit||''));
  const rows = q=>{ q=q.trim().toLowerCase(); const f=custs.filter(c=>!q||c.name.toLowerCase().includes(q)||c.mobile.includes(q)).slice(0,30);
    return f.length ? f.map(c=>`<div class="list-item" style="cursor:pointer" role="button" tabindex="0" onclick="chooseCustomer(${sid},'${c.mobile}')"><span><b>${esc(c.name)}</b><br><span class="muted" style="font-size:12px">${c.mobile} · ${c.visits} visit(s)</span></span><span>${fmt(c.totalSpend)}</span></div>`).join('') : '<div class="muted" style="font-size:13px">No saved customers match. Type a name and mobile above — a new customer record is created when the invoice is finalized.</div>'; };
  window.__scRows = rows;
  openModal(`<button class="close" onclick="closeModal()">✕</button><h3>Customer</h3>
    <label>Customer name</label><input id="csName" value="${esc(s.customerName)}" placeholder="Name (optional)">
    <label>Mobile number</label><input id="csMobile" value="${esc(s.customerMobile)}" inputmode="numeric" placeholder="10-digit mobile (optional)">
    <div class="grid2" style="margin-top:10px"><button class="btn" onclick="saveCustomerSheet(${sid},true)">Clear</button><button class="btn primary" id="csSave" onclick="saveCustomerSheet(${sid})">Save</button></div>
    <div class="section-title">Existing customers</div>
    <input id="scSearch" placeholder="Search name or mobile" oninput="document.getElementById('scList').innerHTML=window.__scRows(this.value)">
    <div id="scList" style="margin-top:8px">${rows('')}</div>`);
}
async function saveCustomerSheet(sid, clear){
  const name = clear ? '' : document.getElementById('csName').value.trim();
  const raw = clear ? '' : document.getElementById('csMobile').value.trim();
  const mob = raw ? normMobile(raw) : '';
  if(raw && !mob){ tell('Enter a valid 10-digit Indian mobile number (for example 98765 43210), or leave it blank.'); return; }
  let nm = name;
  if(mob && !nm){ const c = await dbGet('customers', mob); if(c) nm = c.name; }
  const ok = await act(mutateSession(sid, s=>{ s.customerName=nm; s.customerMobile=mob; return true; }));
  if(ok){ closeModal(); render(); }
}
async function chooseCustomer(sid, mobile){
  const c = await dbGet('customers', mobile); if(!c) return;
  await act(mutateSession(sid, s=>{ s.customerName=c.name; s.customerMobile=c.mobile; })); closeModal(); render();
}
function selectCustomerModal(sid){ return customerSheet(sid); }

/* ---- financial summary: Discount % (gaming only) · Adjustment · TCS · TDS ---- */
async function finEditModal(sid){
  const s = await dbGet('bsessions', sid); if(!sesEditable(s)) return;
  const f = finOf(s), discOk = can('discount');
  openModal(`<button class="close" onclick="closeModal()">✕</button><h3>Edit totals</h3>
    <label>Discount % — applies to gaming lines only ${discOk?'':'<span class="muted">(needs permission)</span>'}</label><input id="feDisc" type="number" inputmode="decimal" min="0" max="100" step="any" value="${f.discountPct}" ${discOk?'':'disabled'}>
    <label>Adjustment (₹, whole rupees; use − to reduce)</label><input id="feAdj" type="number" inputmode="numeric" step="1" value="${f.adjustment}">
    <div class="grid2"><div><label>TCS %</label><input id="feTcs" type="number" inputmode="decimal" min="0" max="100" step="any" value="${f.tcsPct}"></div><div><label>TDS % (deducted)</label><input id="feTds" type="number" inputmode="decimal" min="0" max="100" step="any" value="${f.tdsPct}"></div></div>
    <div class="muted" style="font-size:11px;margin-top:6px">Total = Sub Total − Discount + Tax + Adjustment + TCS − TDS. Leave everything at 0 for a normal bill.</div>
    <button class="btn primary" style="margin-top:12px" id="feSave" onclick="saveFinEdit(${sid})">Save</button>`);
}
async function saveFinEdit(sid){
  const num = id=>Number(document.getElementById(id).value||0);
  const fin = { discountPct:num('feDisc'), adjustment:Math.round(num('feAdj')), tcsPct:num('feTcs'), tdsPct:num('feTds') };
  if(![fin.discountPct,fin.tcsPct,fin.tdsPct].every(v=>v>=0&&v<=100) || !isFinite(fin.adjustment)){ tell('Percentages must be between 0 and 100 and the adjustment must be a number.'); return; }
  const cur = await dbGet('bsessions', sid); if(!cur) return;
  if(!can('discount') && fin.discountPct!==finOf(cur).discountPct){ tell('Changing the discount needs permission.'); return; }
  const t = billTotals(cur.lines, fin.discountPct, state.settings, fin);
  if(t.grand<0){ tell('These adjustments would make the total negative.'); return; }
  const ok = await act(mutateSession(sid, s=>{ s.fin = fin; return true; }));
  if(ok){ closeModal(); render(); }
}

function catalogEntries(products, setups){
  const out = [];
  setups.slice().sort((a,b)=>(a.order||0)-(b.order||0)).forEach(st=>setupVariants(st).forEach(v=>out.push({ key:`g:${st.id}:${v.players}`, name:v.name, price:v.hr, group:'__gaming', sub:st.tv||'' })));
  products.filter(p=>p.active!==false).forEach(p=>out.push({ key:'p:'+p.id, name:p.name, price:p.price, group:({food:'food',beverage:'beverage',combo:'combo'})[p.type]||'other', sub:p.type==='combo'?(p.desc||''):'' }));
  return out.sort((a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base',numeric:true}));
}

/* ============ Item Information ============ */
async function iiBuild(key, keep){
  const [setups, products] = [await dbAll('stations'), await dbAll('products')];
  const st0 = state.settings;
  const ii = { sid:(state.pick&&state.pick.sid)||state.sessionId, lid:null, key, desc:(keep&&keep.desc)||'', free:false, drinks:['',''], minutes:st0.accompanyDefaultMinutes||60, discountPct:0 };
  if(key.startsWith('g:')){
    const [, sidr, pl] = key.split(':'); const st = setups.find(x=>x.id===Number(sidr)); if(!st) throw new Error('That gaming setup no longer exists.');
    const r = st.rates[Number(pl)] || [0,0];
    Object.assign(ii, { kind:'gaming', stationId:st.id, players:Number(pl), name:variantName(st,Number(pl)), rate:r[0], rate0:r[0], half0:r[1], qty:(st0.defaultGamingMinutes||60)/60, unit:'hour' });
  } else {
    const p = products.find(x=>x.id===Number(key.slice(2))); if(!p) throw new Error('That item no longer exists.');
    Object.assign(ii, { kind:p.type==='overtime'?'overtime':p.type==='accompany'?'accompany':p.type==='combo'?'combo':'item', itemId:p.id, name:p.name, rate:p.price, rate0:p.price, qty:1,
      unit:p.type==='overtime'?overtimeUnitLabel(st0):(p.unit||'pc'), bucket:bucketForType(p.type), cat:p.cat, comboDesc:p.desc||'' });
  }
  if(keep && keep.qty && keep.kind===ii.kind) ii.qty = keep.qty;
  return ii;
}
async function openItemNew(key){
  try{ state.ii = await iiBuild(key); }catch(e){ tell(e.message); return; }
  go('itemInfo');
}
async function openLineEdit(sid, lid){
  const s = await dbGet('bsessions', sid);
  if(!sesEditable(s)){ tell(s?`This session is ${STATUS_LABEL[s.status]} and can't be edited.`:'Session not found.'); return; }
  const l = s.lines.find(x=>x.id===lid); if(!l){ tell('This line no longer exists — it may have been removed on another device.'); render(); return; }
  const g = l.kind==='gaming';
  state.ii = { sid, lid, key:'', kind: g?'gaming':l.kind==='accompany'?'accompany':l.kind==='overtime'?'overtime':(l.included&&l.included.length?'combo':'item'), name:g?gamingTitle(l):l.name, desc:l.notes||'',
    qty: g ? (l.minutes||0)/60 : l.qty, rate: g ? l.hr : l.unitPrice, rate0: g ? l.hr : l.unitPrice, half0:l.half, minutes:l.minutes||60, free:!!l.free, drinks:(l.included||['','']).slice(0,2), discountPct:l.discountPct||0, unit:l.unit||'', stationId:l.stationId, players:l.players };
  go('itemInfo');
}
function iiTemp(){
  const ii = state.ii; const q = Number(ii.qty)||0, r = Number(ii.rate)||0;
  if(ii.kind==='gaming') return computeLine({ kind:'gaming', minutes:Math.round(q*60), hr:r, half:ii.half0&&ii.rate0?Math.round(ii.half0*r/ii.rate0):Math.round(r/2), discountPct:ii.discountPct });
  if(ii.kind==='accompany') return computeLine({ kind:'accompany', qty:q, unitPrice:r, minutes:Number(ii.minutes)||0, free:ii.free, discountPct:ii.discountPct });
  return computeLine({ kind:'item', qty:q, unitPrice:r, discountPct:ii.discountPct });
}
function iiRefresh(){ const el=document.getElementById('iiAmt'); if(el && state.ii) el.textContent=n2(iiTemp().total); const h=document.getElementById('iiHint'); if(h) h.innerHTML=iiHintHtml(); }
function iiHintHtml(){
  const ii=state.ii; if(!ii) return '';
  if(ii.kind==='gaming'){ const m=Math.round((Number(ii.qty)||0)*60); return `${fmtDur(m)} billed${ii.lid?'':' · the timer starts when you save'}`; }
  if(ii.kind==='accompany') return ii.free ? 'Free — parent accompanying child' : `${ii.qty||0} person(s) × ${fmtDur(Number(ii.minutes)||0)}`;
  return '';
}
function iiSet(k, v){ if(!state.ii) return; if(k==='qty'||k==='rate') state.ii[k] = v; else state.ii[k]=v; iiRefresh(); }
function iiStep(d){
  const ii=state.ii; const step = ii.kind==='gaming' ? 0.5 : 1; let q = (Number(ii.qty)||0)+d*step; if(q<=0) q = step>=1?1:0.5;
  ii.qty = Math.round(q*100)/100; const e=document.getElementById('iiQty'); if(e) e.value=ii.qty; iiRefresh();
}

  const rateOk = can('editPrice'), drinks = ii.kind==='combo' ? (await dbAll('products')).filter(p=>p.type==='beverage'&&p.active!==false).map(p=>p.name) : [];
  const sel = (i)=>`<div class="zrow"><span class="l req">Drink ${i+1}</span><span class="v"><select id="iiD${i}" onchange="state.ii.drinks[${i}]=this.value">${['',...drinks].map(d=>`<option value="${esc(d)}" ${ii.drinks[i]===d?'selected':''}>${d?esc(d):'Select'}</option>`).join('')}</select></span></div>`;

      <div class="zrow col"><span class="l">Description</span><textarea id="iiDesc" rows="4" placeholder="Optional" oninput="iiSet('desc',this.value)">${esc(ii.desc)}</textarea></div>
      <div class="zrow"><span class="l req">${hrs?'Quantity (hours)':ii.kind==='accompany'?'Quantity (persons)':'Quantity'}</span>
        <span class="v zqty"><button type="button" class="zstep" aria-label="Decrease quantity" onclick="iiStep(-1)">−</button><input id="iiQty" inputmode="decimal" value="${esc(ii.qty)}" oninput="iiSet('qty',this.value)" aria-label="Quantity"><button type="button" class="zstep" aria-label="Increase quantity" onclick="iiStep(1)">+</button><button type="button" class="zclr" aria-label="Clear quantity" onclick="iiClear()">${ZI.clear}</button></span></div>
      ${ii.kind==='accompany'?`<div class="zrow"><span class="l">Duration (minutes)</span><span class="v"><input id="iiMin" inputmode="numeric" value="${esc(ii.minutes)}" oninput="iiSet('minutes',this.value)"></span></div>
        <div class="zrow"><label class="l" for="iiFree">Free — parent accompanying child</label><span class="v"><input id="iiFree" type="checkbox" ${ii.free?'checked':''} onchange="iiSet('free',this.checked)"></span></div>`:''}
      ${ii.kind==='combo'?sel(0)+sel(1):''}
      <div class="zrow"><span class="l req">Rate (INR)${hrs?' / hour':ii.kind==='accompany'?' / person / hour':''}</span><span class="v"><input id="iiRate" inputmode="decimal" value="${n2(ii.rate)}" ${rateOk?'':'disabled'} onfocus="this.select()" oninput="iiSet('rate',this.value)" aria-label="Rate"></span></div>
    </div>
    <div class="zcard"><div class="zrow"><span class="l">Amount</span><span class="v"><b id="iiAmt">${n2(iiTemp().total)}</b></span></div><div class="zhint" id="iiHint">${iiHintHtml()}</div>${rateOk?'':'<div class="zhint">Changing the price needs permission.</div>'}</div>
    ${ii.lid&&hrs?`<button type="button" class="zbtn" onclick="iiAdvanced()">Station, start/end time, players…</button>`:''}`;

async function iiAdvanced(){ const ii=state.ii; if(!ii) return; state.ii=null; await openSession(ii.sid); editLineModal(ii.sid, ii.lid); }
async function iiPickModal(){
  const list = catalogEntries(await dbAll('products'), (await dbAll('stations')).filter(st=>st.active!==false));
  window.__iiList = list;
  const rows = q=>{ q=q.trim().toLowerCase(); const f=list.filter(e=>!q||e.name.toLowerCase().includes(q)); return f.map(e=>`<div class="list-item" style="cursor:pointer" role="button" tabindex="0" onclick="iiSwitch('${e.key}')"><span>${esc(e.name)}</span><b>₹${n2(e.price)}</b></div>`).join('') || '<div class="muted">No matching items.</div>'; };
  window.__iiRows = rows;
  openModal(`<button class="close" onclick="closeModal()">✕</button><h3>Select item</h3><input id="iiSearch" placeholder="Search items" oninput="document.getElementById('iiList').innerHTML=window.__iiRows(this.value)"><div id="iiList" style="margin-top:8px">${rows('')}</div>`);
}
async function iiSwitch(key){
  const cur = state.ii; try{ state.ii = Object.assign(await iiBuild(key, cur), { sid:cur.sid }); }catch(e){ tell(e.message); return; }
  closeModal(); render();
}
async function iiSave(){
  const ii = state.ii; if(!ii || ii.saving) return;
  const rd = id=>{ const e=document.getElementById(id); return e ? e.value : ''; };
  const qty = Number(String(rd('iiQty')).replace(',','.')), rate = Number(String(rd('iiRate')).replace(',','.')), desc = rd('iiDesc').trim();
  if(!(qty>0)){ tell('Enter a quantity greater than zero.'); return; }
  if(!(rate>=0) || rd('iiRate')===''){ tell('Enter a valid rate.'); return; }
  if(!can('editPrice') && Math.abs(rate-(ii.rate0||0))>0.0001){ tell('Changing the price needs permission.'); return; }
  let minutes = 0;
  if(ii.kind==='gaming'){ minutes = Math.round(qty*60); const err = validateMinutes(minutes, durationPolicy()); if(err){ tell(err); return; } }
  if(ii.kind==='accompany'){ minutes = Math.round(Number(rd('iiMin'))); const err = validateMinutes(minutes, durationPolicy()); if(err){ tell(err); return; } if(!Number.isInteger(qty)){ tell('Enter a whole number of persons.'); return; } }
  if(ii.kind==='combo' && !(ii.lid ? true : (ii.drinks[0]&&ii.drinks[1]))){ tell('Choose both drinks for this combo.'); return; }
  const free = ii.kind==='accompany' && !!(document.getElementById('iiFree')||{}).checked;
  const half = ii.half0&&ii.rate0 ? Math.round(ii.half0*rate/ii.rate0) : Math.round(rate/2);
  ii.saving = true; const sid = ii.sid, lid = ii.lid;
  try{
    const st = ii.kind==='gaming' && !lid ? await dbGet('stations', ii.stationId) : null;
    const prod = ii.itemId ? await dbGet('products', ii.itemId) : null;
    const ok = await act(mutateSession(sid, s=>{
      if(lid){
        const l = s.lines.find(x=>x.id===lid); if(!l) throw new Error('This line was removed — nothing was changed.');
        const patch = ii.kind==='gaming' ? { minutes, hr:rate, half, notes:desc } : ii.kind==='accompany' ? { qty, minutes, unitPrice:rate, free, notes:desc } : { qty, unitPrice:rate, notes:desc };
        logHist(l, patch, ['minutes','hr','half','unitPrice','qty','free']);
        Object.assign(l, patch); computeLine(l); return true;
      }
      let l;
      if(ii.kind==='gaming'){ if(!st) throw new Error('That gaming setup no longer exists.'); l = makeGamingLine(s, st, ii.players, { minutes, hr:rate, half, notes:desc }); }
      else if(ii.kind==='accompany'){ l = addAccompanyLine(s, prod||{name:ii.name,cat:ii.cat,id:ii.itemId,price:rate}, qty, minutes, free); l.unitPrice = rate; l.notes = desc; }
      else if(ii.kind==='overtime'){ l = newLine(s,'overtime',{ name:ii.name, category:ii.cat, itemId:ii.itemId, qty, unit:ii.unit, unitPrice:rate, bucket:'overtime', notes:desc }); }
      else { l = newLine(s,'item',{ name:ii.name, category:ii.cat, itemId:ii.itemId, qty, unit:ii.unit||'pc', unitPrice:rate, bucket:ii.bucket||'other', included:ii.kind==='combo'?[ii.drinks[0],ii.drinks[1]]:null, notes:desc }); }
      computeLine(l); return true;
    }));
    if(ok){ state.ii = null; showToast(lid?'Line updated':'Added '+ii.name); await openSession(sid); }
  } finally { if(state.ii) state.ii.saving = false; }
}

function makeGamingLine(s, st, players, extra){
  const r = st.rates[players] || [0,0]; const now = Date.now();
  return newLine(s,'gaming', Object.assign({ name:variantName(st,players), category:st.category||'Gaming', setupLabel:setupLabel(st), stationId:st.id, console:st.console, tv:st.tv||'', players,
    minutes:state.settings.defaultGamingMinutes||60, hr:r[0], half:r[1], physicalId:null, physicalName:'', state:'running', startedAt:now, startTime:now, elapsedMs:0, endedAt:null, bucket:'gaming', policySnap:durationPolicy() }, extra||{}));
}
function addItemLine(s, p, included, qty){
  qty = qty||1;
  if(p.type==='overtime') return newLine(s,'overtime',{name:p.name,category:p.cat,itemId:p.id,qty,unit:overtimeUnitLabel(state.settings),unitPrice:p.price,bucket:'overtime'});
  const same = !included && s.lines.find(x=>x.kind==='item' && x.itemId===p.id && !x.included && !x.notes && x.unitPrice===p.price && !x.discountPct);
  if(same){ same.qty += qty; return same; }
  return newLine(s,'item',{name:p.name,category:p.cat,itemId:p.id,qty,unit:p.unit||'pc',unitPrice:p.price,bucket:bucketForType(p.type),included:included||null});
}
function addAccompanyLine(s, p, persons, minutes, free){
  return newLine(s,'accompany',{name:p.name,category:p.cat,itemId:p.id,qty:persons,unit:'person/hour',unitPrice:p.price,minutes,free:!!free,bucket:'accompany'});
}

function readNum(id){ const el=document.getElementById(id); return el ? Number(el.value) : NaN; }

  } else {

      <datalist id="unitList"><option>pcs</option><option>plate</option><option>bottle</option><option>combo</option><option>occurrence</option><option>10-min block</option><option>fixed charge</option></datalist>
      <label>Unit price (₹)</label><input id="elPrice" type="number" min="0" value="${l.unitPrice}" ${D(priceOk)} oninput="window.__elPrev()">

function cancelLineEdit(sid){ closeModal(); }
async function saveLineEdit(sid, lid){
  const r = window.__elRead(); if(r.error){ tell(r.error); return; }
  if(r.patch.physicalId){ const busy = await physicalBusy(r.patch.physicalId, sid, lid); const cur=(await dbGet('bsessions',sid)); const ln=cur&&cur.lines.find(x=>x.id===lid);
    if(busy && (!ln || ln.state!=='ended')){ tell(`That physical station is already in use by ${busy.code}. Pick another one.`); return; } }
  const ok = await act(mutateSession(sid, s=>{
    const l = s.lines.find(x=>x.id===lid); if(!l) throw new Error('This line no longer exists — it may have been removed on another device. Nothing was changed.');
    const patch = Object.assign({}, r.patch);
    logHist(l, patch, HIST_FIELDS);
    if(l.kind==='gaming' && patch.startTime && l.state==='running'){ l.startedAt = patch.startTime; l.elapsedMs = 0; }
    Object.assign(l, patch); computeLine(l); return true; }));
  if(ok){ showToast('Line updated'); afterLineChange(sid); }
}
async function deleteLine(sid, lid){
  if(!can('deleteLines')){ tell('Deleting lines needs Admin permission.'); return; }
  const s = await dbGet('bsessions', sid);
  if(!s){ tell('This session no longer exists.'); return; }
  if(!sesEditable(s)){ tell(`This session is ${STATUS_LABEL[s.status]} and can't be edited. Use Credit / Refund on its invoice.`); return; }
  const l = s.lines.find(x=>x.id===lid);
  if(!l){ tell('This line was already removed.'); render(); return; }
  if(!(await askConfirm(`Delete “${l.kind==='gaming'?gamingTitle(l):l.name}” (${fmt(l.total)}) from this bill? Other lines and the session are not affected.`,'Delete',true))) return;
  const ok = await act(mutateSession(sid, d=>{ const n=d.lines.length; d.lines=d.lines.filter(x=>x.id!==lid); if(d.lines.length===n) throw new Error('This line was already removed.'); return true; }));
  if(ok){ delete expiredAlerted[sid+'-'+lid]; document.getElementById('expiryBanner-'+sid+'-'+lid)?.remove(); showToast('Line deleted'); afterLineChange(sid); }
}

/* ---- physical stations ---- */
async function assignPhysicalModal(sid, lid){
  const s = await dbGet('bsessions', sid); if(!sesEditable(s)) return; const l = s.lines.find(x=>x.id===lid); if(!l) return;
  const phys = (await dbAll('physical')).filter(p=>p.active!==false);
  if(!phys.length){ tell('No physical stations are configured yet. Add them in Settings → Physical Stations — assigning one is optional.'); return; }
  const rows=[]; for(const p of phys){ const b=await physicalBusy(p.id, sid, lid); rows.push(`<div class="list-item"><span>${esc(p.name)}${b?` <span class="tag">in use: ${b.code}</span>`:''}</span><button class="btn sm" ${b?'disabled':''} onclick="setPhysical(${sid},${lid},${p.id})">Assign</button></div>`); }
  openModal(`<button class="close" onclick="closeModal()">✕</button><h3>Assign physical station</h3><p class="muted" style="font-size:12px">A physical console can only be in one running segment at a time. Other consoles of the same model are unaffected.</p>${rows.join('')}${l.physicalId?`<button class="btn" style="margin-top:8px" onclick="setPhysical(${sid},${lid},null)">Unassign</button>`:''}`);
}
async function setPhysical(sid, lid, pid){
  const ph = pid ? await dbGet('physical', pid) : null;
  if(pid){ const b=await physicalBusy(pid,sid,lid); if(b){ tell(`${ph.name} is already in use by ${b.code}.`); return; } }
  const ok = await act(mutateSession(sid, s=>{ const l=s.lines.find(x=>x.id===lid); if(!l) throw new Error('This line no longer exists.'); const patch={physicalId:pid||null,physicalName:ph?ph.name:''}; logHist(l,patch,['physicalName']); Object.assign(l,patch); return true; }));
  if(ok){ closeModal(); showToast(ph?('Assigned '+ph.name):'Station unassigned'); render(); }
}

/* ---- gaming timers & explicit end of segments ---- */
/* Suggested billable time: time played rounded up to the next 30-minute block, with a 2-minute grace so a few seconds over never costs a whole extra block. Staff always confirm or change it. */
async function toggleHold(sid){
  const r = await act(mutateSession(sid, s=>{
    if(s.status==='hold'){ s.lines.forEach(l=>{ if(l.kind==='gaming' && l.state==='paused'){ l.state='running'; l.startedAt=Date.now(); } }); s.status='active'; }
    else { s.lines.forEach(l=>{ if(l.kind==='gaming' && l.state==='running'){ l.elapsedMs=lineElapsedMs(l); l.state='paused'; l.startedAt=null; } }); s.status='hold'; }
    return s.status; }));
  if(r){ liveSessions.forEach(x=>{}); document.querySelectorAll('[id^="expiryBanner-"]').forEach(b=>b.remove()); render(); showToast(r==='hold'?'Session on hold — timers paused':'Session resumed'); }
}
async function cancelSessionModal(sid){
  const s = await dbGet('bsessions', sid);
  if(!sesEditable(s)){ tell('This session is not open for editing.'); return; }
  if(!can('cancelSession')){ tell('Cancelling a session needs Admin permission.'); return; }
  openModal(`<button class="close" onclick="closeModal()">✕</button><h3>Cancel ${sesCode(s)}?</h3>
    <p class="muted" style="font-size:13px">The session is kept in history as Cancelled (nothing is deleted) and no invoice is created. ${s.lines.length} line(s), ${fmt(sessionTotals(s).subtotal)} will not be billed.</p>

/* ---- Live ticker & expiry alerts (per gaming segment; reads the in-memory cache, not the database) ---- */
const expiredAlerted = {};
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<2;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=800; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i*0.4;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t+0.03); g.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
      o.start(t); o.stop(t+0.32);
    }
    setTimeout(()=>ctx.close(), 1200);
  }catch(e){}
}
function fmtClock(totalSec){ const neg=totalSec<0; const a=Math.abs(totalSec); return (neg?'-':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0'); }
/* Time's up: a small dismissible banner (Extend · End Session · Dismiss). It never blocks the screen, never ends or changes
   anything by itself, and shows once per end time — it only comes back if the segment is extended and reaches its new end. */
const ALERT_KEY = 'lvl_alerted_v1';
const alerted = (()=>{ try{ return JSON.parse(sessionStorage.getItem(ALERT_KEY)||'{}'); }catch(e){ return {}; } })();
function markAlerted(k){ alerted[k]=Date.now(); try{ sessionStorage.setItem(ALERT_KEY, JSON.stringify(alerted)); }catch(e){} }
function dismissTimeUp(key){
  const el = document.getElementById('expiryBanner-'+key); if(!el) return;
  el.style.opacity='0'; el.style.transform = (el.style.transform||'') + ' translateY(-12px)'; setTimeout(()=>el.remove(), 220);
}
function wireTimeUpSwipe(el, key){
  let x0=0, y0=0, dx=0, dy=0, drag=false;
  el.addEventListener('pointerdown', e=>{ if(e.target.closest('button')) return; drag=true; x0=e.clientX; y0=e.clientY; dx=dy=0; el.style.transition='none'; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove', e=>{ if(!drag) return; dx=e.clientX-x0; dy=e.clientY-y0; el.style.transform=`translate(${dx}px,${dy}px)`; el.style.opacity=String(Math.max(.25, 1-Math.max(Math.abs(dx),Math.abs(dy))/220)); });
  const end = ()=>{ if(!drag) return; drag=false; el.style.transition='';
    if(Math.abs(dx)>70 || Math.abs(dy)>45){ el.style.transform=`translate(${dx*3}px,${dy*3}px)`; el.style.opacity='0'; setTimeout(()=>el.remove(),220); }
    else { el.style.transform=''; el.style.opacity=''; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function showTimeUpBanner(sid, l){
  const key = sid+'-'+l.id; if(document.getElementById('expiryBanner-'+key)) return;
  let stack = document.getElementById('alertStack'); if(!stack){ stack=document.createElement('div'); stack.id='alertStack'; document.body.appendChild(stack); }
  while(stack.children.length>=3) stack.firstElementChild.remove();
  const el = document.createElement('div'); el.id='expiryBanner-'+key; el.className='tu'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
  el.innerHTML = `<b>Time added so far is used up — ${esc(gamingTitle(l))}</b><div class="muted" style="font-size:12px">The bill stays ${fmtDur(l.minutes)} until you edit the item.</div>
    <div class="tu-a"><button class="btn sm primary" onclick="dismissTimeUp('${key}');openLineEdit(${sid},${l.id})">Edit item</button><button class="btn sm ghost" onclick="dismissTimeUp('${key}')">Dismiss</button></div>`;
  stack.appendChild(el); wireTimeUpSwipe(el, key);
  setTimeout(()=>{ if(el.isConnected) dismissTimeUp(key); }, 20000);   // goes away by itself
}
function tickSessions(){
  const live = new Set();
  liveSessions.forEach(s=>{ s.lines.forEach(l=>{
    if(l.kind!=='gaming' || l.state!=='running') return;
    const key=s.id+'-'+l.id; live.add(key);
    const remaining = Math.floor(l.minutes*60 - lineElapsedMs(l)/1000);
    const el = document.getElementById('lt-'+key);
    if(el){
      if(remaining>=0){ el.innerHTML=`Time left: <b>${fmtClock(remaining)}</b> | Billed: ${fmtDur(l.minutes)}`; el.style.color = remaining<120?'var(--amber)':''; }
      else el.innerHTML=`<span style="color:var(--red);font-weight:600">Over by ${fmtClock(-remaining)}</span> | Billed: ${fmtDur(l.minutes)}`;
    }
    if(remaining<0){
      const ak = key+':'+l.minutes;   // one alert per end time; extending the segment gives it a new end time
      if(!alerted[ak]){ markAlerted(ak); if(-remaining<=900){ beep(); showTimeUpBanner(s.id, l); } }   // already >15 min over when first seen (e.g. app reopened): no banner, the card shows "Over by"
    }
  }); });
  document.querySelectorAll('[id^="expiryBanner-"]').forEach(b=>{ if(!live.has(b.id.replace('expiryBanner-',''))) b.remove(); });
}
setInterval(tickSessions, 1000);
