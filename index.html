<style>
/* LVL Books — minimalist POS theme. Static, low-contrast chrome; one accent colour; no glow, gradients or motion. */
:root{
  --bg:#101113; --panel:#17181b; --panel2:#1e2024; --line:#2a2d32; --text:#e7e9ec; --muted:#8f969f;
  --accent:#5b8def; --accent-ink:#0b1220; --green:#4fb286; --amber:#d3a24a; --red:#e06c6c;
  --neon:var(--accent); --neon2:var(--accent); --pink:var(--accent);
  --nav-h:56px; --foot-h:0px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f1f3; --line:#dcdfe4; --text:#16181c; --muted:#5d646e; --accent:#2f63c9; --accent-ink:#ffffff; --green:#237a55; --amber:#8f6510; --red:#b84040; }
}
:root[data-theme="light"]{ --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f1f3; --line:#dcdfe4; --text:#16181c; --muted:#5d646e; --accent:#2f63c9; --accent-ink:#ffffff; --green:#237a55; --amber:#8f6510; --red:#b84040; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px;scroll-padding-bottom:calc(var(--nav-h) + var(--foot-h) + 24px)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.35;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.modal-open{overflow:hidden}
/* The document itself scrolls (no nested scroller). Bottom space = nav + any sticky footer + safe area, so the last control is always reachable. */
.app{max-width:560px;margin:0 auto;padding:8px 14px calc(var(--nav-h) + var(--foot-h) + 36px + env(safe-area-inset-bottom,0px))}
body.nonav{--nav-h:0px}
body.nonav .navbar{display:none}
body.hasfoot{--foot-h:76px}
body.hasfoot.tall{--foot-h:112px}
h1,h2,h3{margin:0 0 8px;font-weight:600}
h2{font-size:19px} h3{font-size:16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;margin:0 -14px 8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.4px;font-size:15px}
.brand span{color:var(--muted);font-weight:500}
#installBtn,#themeBtn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;margin-left:6px;min-height:32px}
#installBtn{display:none}
.topbar-actions{display:flex;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card.glow{border-color:var(--line)}
.row{display:flex;gap:8px}
.col{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.stat .v{font-size:18px;font-weight:600}
.stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 12px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;width:100%;min-height:44px;font-family:inherit}
.btn:active{background:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:active{filter:brightness(.92)}
.btn.pink{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn.green{background:transparent;border-color:var(--green);color:var(--green)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:7px 10px;font-size:13px;width:auto;min-height:36px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 11px;border-radius:6px;font-size:16px;font-family:inherit;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:auto;min-height:0}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.pill.green{color:var(--green);border-color:var(--green)}
.pill.amber{color:var(--amber);border-color:var(--amber)}
.pill.red{color:var(--red);border-color:var(--red)}
.pill.neon{color:var(--accent);border-color:var(--accent)}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.navbtn{flex:1;text-align:center;padding:7px 2px 6px;color:var(--muted);font-size:11px;background:none;border:none;min-height:var(--nav-h);font-family:inherit;cursor:pointer}
.navbtn.active{color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.navbtn .ic{display:block;margin:0 auto 2px;width:22px;height:22px}
.navbtn .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.chip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);margin:3px 6px 3px 0;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.sel{border-color:var(--accent);color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.modal{background:var(--panel);border-radius:10px 10px 0 0;width:100%;max-width:560px;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px));
  max-height:calc(var(--vvh,100dvh) - 12px);max-height:calc(var(--vvh,100vh) - 12px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-bottom:none}
.close{float:right;background:none;border:none;color:var(--muted);font-size:22px;min-height:36px;min-width:36px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
.right{text-align:right}
.total-row{font-weight:600;font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.bar-row{margin:6px 0}
.bar-track{background:var(--panel2);border-radius:3px;height:8px;overflow:hidden;margin-top:3px}
.bar-fill{height:100%;background:var(--accent);border-radius:3px}
.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:4px}
/* ---- POS picker ---- */
.catbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.catbar::-webkit-scrollbar{display:none}
.catbar .chip{margin:0;flex:0 0 auto}
.pos-head{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);padding:6px 0 0;margin:0 -14px;padding-left:14px;padding-right:14px}
.posrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:6px}
.posrow.sel{border-color:var(--accent)}
.posrow .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.posrow .sub{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:0;flex:0 0 auto}
.stepper button{width:40px;height:40px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
.stepper button:first-child{border-radius:6px 0 0 6px}.stepper button:last-child{border-radius:0 6px 6px 0;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper .q{min-width:38px;height:40px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.footbar .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.footbar .sum{flex:1;font-size:13px;min-width:0}
.footbar .inner.stack{flex-wrap:wrap;gap:8px}
.footbar .inner.stack .sum{flex:1 1 100%;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.footbar .inner.stack .sum .muted{font-size:11px}
.footbar .inner.stack .btn{padding:10px 12px}
.footbar .sum b{font-size:15px}
.footbar .btn{width:auto;flex:0 0 auto;padding:11px 16px}
/* ---- in-app dialogs (replace native alert/confirm, which browsers can silently block) ---- */
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:420px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;padding:16px}
.dlg p{margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap}
.dlg .acts .btn{flex:1 1 120px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--foot-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:50;max-width:90%;text-align:center}
.banner{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--foot-h) + 12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--panel);border:1px solid var(--amber);border-left:4px solid var(--amber);padding:12px;border-radius:6px;max-width:536px;margin:0 auto}
/* ---- Active session cards: the WHOLE card is one tap target (a transparent button stretched over the card);
   the action buttons sit above it, so tapping them never opens the session and no click handlers are nested. ---- */
.sess-card{position:relative;overflow:hidden}
.sess-open{position:absolute;inset:0;z-index:1;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:inherit;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
@media (hover:hover){.sess-open:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}}
.sess-open:active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sess-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sess-card:has(.sess-open:active){border-color:var(--accent)}
.sess-card .sess-acts .btn{position:relative;z-index:2}
.sess-3{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}.sess-3 .btn{min-height:44px;padding:8px 6px}
.sess-chev{color:var(--muted);font-size:20px;line-height:1;margin-left:6px;vertical-align:middle}
/* ---- top bar back / home ---- */
.tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:6px;min-height:36px;min-width:36px;padding:0;cursor:pointer}
.tb-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-btn:active{background:var(--line)}
.catbar,.modal{overscroll-behavior-x:contain}
/* ---- admin invoice management ---- */
.adm-row .list-item{align-items:flex-start}
.adm-main{flex:1;min-width:0;cursor:pointer}
.adm-chk input{width:22px;height:22px;margin:2px 4px 0 0}
.adm-bulk{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);padding:6px 0}
/* ---- refresh in place: the browser's own pull-to-refresh would reload the whole page, so it is switched off ---- */
html,body{overscroll-behavior-y:contain}
@keyframes lvlspin{to{transform:rotate(360deg)}}
.tb-btn.spin svg{animation:lvlspin .8s linear infinite}
#topProg{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:2px;width:0;background:var(--accent);z-index:60;opacity:0;pointer-events:none}
#topProg.on{opacity:1;width:70%;transition:width 1.2s ease-out}
#topProg.done{opacity:0;width:100%;transition:width .2s,opacity .35s .15s}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 50px);width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;z-index:45;opacity:0;pointer-events:none;transform:translateY(-70px)}
#ptr svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ptr.spin svg{animation:lvlspin .8s linear infinite}
.netchip{font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:3px 7px;margin-right:6px}
.netchip[hidden]{display:none}
.skel{height:14px;border-radius:4px;background:var(--line);margin:12px 0;opacity:.55}
.navbtn{position:relative}
.navbtn .dot{position:absolute;top:6px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--amber)}
@media (prefers-reduced-motion:reduce){.tb-btn.spin svg,#ptr.spin svg{animation:none;opacity:.5}}
/* ---- Time's-up notification: a dismissible banner, never a blocking dialog ---- */
#alertStack{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:35;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
.tu{pointer-events:auto;width:100%;max-width:536px;background:var(--panel);border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:6px;padding:10px 12px;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .22s,opacity .22s}
.tu .tu-a,.tu .tu-x{display:flex;gap:8px;margin-top:8px}
.tu .tu-a .btn,.tu .tu-x .btn{flex:1}
.tu .tu-x[hidden]{display:none}
.tu button{touch-action:manipulation}

/* ---- Zoho-style transaction screens: black canvas, charcoal cards, restrained green ---- */
/* ---- customer suggestions ---- */
.acwrap{position:relative}
.acbox{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:40;background:var(--panel);border:1px solid var(--accent);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.5);max-height:min(264px,40vh);overflow-y:auto;overscroll-behavior:contain}
.acbox[hidden]{display:none}
.acitem{display:flex;flex-direction:column;gap:2px;padding:10px 12px;min-height:48px;justify-content:center;border-bottom:1px solid var(--line);cursor:pointer}
.acitem:last-child{border-bottom:0}
.acitem b{font-size:15px}.acitem span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.acitem.on,.acitem:active{background:color-mix(in srgb,var(--accent) 22%,var(--panel2))}
/* ---- checkout payment cards ---- */
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paytile{position:relative;min-height:54px;padding:8px 6px;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;font:600 15px/1.15 inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-appearance:none;appearance:none}
.paytile:active{background:var(--line)}
.paytile.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 24%,var(--panel2));color:#fff;box-shadow:inset 0 0 0 1px var(--accent)}
.paytile.sel::after{content:"✓";position:absolute;top:3px;right:7px;font-size:12px;font-weight:700;color:var(--accent)}
.payrow{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.payrow:last-of-type{border-bottom:0;margin-bottom:4px}
.payhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.payx{background:transparent;border:0;color:var(--red);font-size:13px;min-height:32px;cursor:pointer}
.payamt{margin-top:10px}.payamt label{margin:0 0 4px}.payby{color:var(--accent)}
.payamt input{font-size:18px;font-weight:600;min-height:48px}
.paynote{margin-top:8px;font-size:12px;color:var(--muted)}
.paysplit{margin-top:8px}
body.zb-on{--bg:#000;--panel:#1c1c1e;--panel2:#2c2c2e;--line:#3a3a3c;--text:#fff;--muted:#8e8e93;--accent:#5b8def;--accent-ink:#0b1220;--green:#5b8def;--ok:#4fb286;--red:#ff5d73;--amber:#f2b84b;color-scheme:dark}
.zb{padding-top:0}
.zhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:grid;grid-template-columns:52px 1fr 52px;align-items:center;margin:0 -14px 4px;padding:8px 14px;min-height:60px}
.zhead h1{margin:0;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zcirc{width:44px;height:44px;border-radius:50%;border:0;background:#2c2c2e;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.zcirc svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.zcirc.ok{background:var(--green);color:var(--accent-ink)}
.zcirc:active{filter:brightness(.85)}
.zh2{font-size:17px;font-weight:600;margin:18px 4px 8px}
.zsec{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}

<script>
/* ============ Firestore data layer (real-time, offline-capable) ============ */
/* Same async API as the single-device version (dbAll/dbGet/dbPut/dbDel/dbClear/dbIncrement), so the app
   logic is identical. Every collection is mirrored in an in-memory cache kept fresh by onSnapshot listeners:
   reads are free and instant, and every phone sees every change within about a second.
   Invoices and sessions are loaded for the last 120 days only, so Firestore usage stays small
   for years (daily totals live forever in dailyRecords; older invoices are still fetched one-by-one when opened). */
function fb(){ return window.__fb; }
function waitForFirebase(){
  return new Promise((resolve)=>{
    if(window.__fbReady){ resolve(); return; }
    window.addEventListener('fb-ready', ()=>resolve(), {once:true});
    setTimeout(()=>resolve(), 10000);
  });
}
const KEYPATH = { customers:'mobile', bsessions:'id', invoices:'id', products:'id', expenses:'id', settings:'key', vendors:'id', purchases:'id',
  employees:'id', employeeTx:'id', accounts:'name', dailyRecords:'date', stations:'id', inventoryTx:'id', physical:'id', deletedInvoices:'id', auditLog:'id', memberships:'id', loyaltyTx:'id', ledger:'id', archivedInvoices:'id' };
const AUTOINC = new Set(['bsessions','invoices','products','expenses','vendors','purchases','employees','employeeTx','stations','inventoryTx','physical','auditLog','memberships','loyaltyTx']);
const WINDOWED = { invoices:{field:'date',days:120}, bsessions:{field:'startTime',days:120} };
const __cache = {}, __ready = {};
function clean(v){ return v===undefined ? v : JSON.parse(JSON.stringify(v)); }   // deep copy; also strips undefined (Firestore rejects it)
/* ---- connectivity: best effort only. Firestore keeps working from its saved local copy whether or not there is signal. ---- */
let __cloudBadAt = 0;
function isOnline(){ return navigator.onLine!==false; }
function cloudLikely(){ return isOnline() && !(__cloudBadAt && Date.now()-__cloudBadAt<60000); }   // after a failed attempt, don't even try for a minute
/* LOCAL-FIRST: every write lands in the in-memory mirror and Firestore's persistent local database immediately and is
   synced to the cloud later, in the background. Nothing in the app ever waits for the cloud. A failed upload is reported. */
function writeAck(p){
  p.then(()=>{ __cloudBadAt = 0; }, e=>{ console.error('Cloud write failed', e); try{ showToast('⚠️ A change could not be saved to the cloud: '+(e.code||e.message)); }catch(_){} });
  return Promise.resolve();
}
function stable(v){ return JSON.stringify(v, (k,x)=> (x && typeof x==='object' && !Array.isArray(x)) ? Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}) : x); }
/* revision counters: bumped whenever a store changes, so derived data (dashboard totals, report results, search indexes) can be cached and invalidated precisely */
const __rev = {}, __memo = {};
function bumpRev(s){ __rev[s] = (__rev[s]||0)+1; }
function revOf(stores){ return stores.map(s=>__rev[s]||0).join('.'); }
function memo(key, stores, fn){ const r = revOf(stores); const m = __memo[key]; if(m && m.r===r) return m.v; const v = fn(); __memo[key] = { r, v }; return v; }
const __lw = {};   // store|key → time of our own last write (so a late echo of it can never overwrite a newer local change)
function markLocal(store,k){ const n=Date.now(); __lw[store+'|'+k]=n; if(Object.keys(__lw).length>600){ for(const x in __lw) if(n-__lw[x]>5000) delete __lw[x]; } }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
/* IDs are issued on the device, instantly, from blocks of numbers reserved from the cloud counter while online (so two phones never overlap).
   With no block available (never been online) the next number after the highest one seen is used. */
const ID_BLOCK = 25, __idReserving = {};
function localMaxId(store){ let m=0; if(__ready[store]) __cache[store].forEach((v,k)=>{ const n=Number(k); if(n>m && n<1e9) m=n; }); return m; }
function nextIdLocal(store){
  const hi = Math.max(localMaxId(store), Number(lsGet('lvl_idhi_'+store))||0);
  const blocks = lsGet('lvl_idblk_'+store) || []; let id = 0;
  while(blocks.length){ const b = blocks[0]; if(b.next<=hi) b.next = hi+1; if(b.next>b.end){ blocks.shift(); continue; } id = b.next++; break; }
  if(!id) id = hi+1;
  lsSet('lvl_idblk_'+store, blocks); lsSet('lvl_idhi_'+store, id);
  topUpIdBlock(store);
  return id;
}
function topUpIdBlock(store){
  const blocks = lsGet('lvl_idblk_'+store) || [];
  const left = blocks.reduce((a,b)=>a+Math.max(0,b.end-b.next+1),0);
  const f = fb(); if(!f || left>=8 || __idReserving[store] || !cloudLikely()) return;
  __idReserving[store] = true; let abandoned = false;
  const ref = f.doc(f.db,'counters',store);
  const to = setTimeout(()=>{ abandoned = true; __idReserving[store] = false; __cloudBadAt = Date.now(); }, 6000);
  f.runTransaction(f.db, async t=>{ if(abandoned) throw new Error('abandoned'); const snap = await t.get(ref); const n = Math.max(snap.exists()?(snap.data().n||0):0, localMaxId(store)); t.set(ref,{n:n+ID_BLOCK}); return n; })
    .then(n=>{ clearTimeout(to); if(abandoned) return; const bl = lsGet('lvl_idblk_'+store) || []; bl.push({ next:n+1, end:n+ID_BLOCK }); lsSet('lvl_idblk_'+store, bl); __idReserving[store] = false; })
    .catch(()=>{ clearTimeout(to); __idReserving[store] = false; });
}
async function dbAll(store){   // a private deep copy: safe to modify
  if(__ready[store]) return clean([...__cache[store].values()]);
  const f = fb(); const snap = await f.getDocs(f.collection(f.db, store)); return snap.docs.map(d=>d.data());
}
function dbAllRO(store){   // the live in-memory records, NOT copied: read-only, instant. Never modify what it returns.
  return __ready[store] ? [...__cache[store].values()] : [];
}
function dbGetRO(store, key){ return __ready[store] ? __cache[store].get(String(key)) : undefined; }
async function dbGet(store, key){
  const k = String(key);
  if(__ready[store] && __cache[store].has(k)) return clean(__cache[store].get(k));
  if(__ready[store] && !WINDOWED[store]) return undefined;
  const f = fb(); const snap = await f.getDoc(f.doc(f.db, store, k)); return snap.exists() ? snap.data() : undefined;
}
function dbPutNow(store, val){   // synchronous core of every save: instant, local-first
  const f = fb(); const kp = KEYPATH[store] || 'id'; Object.assign(val, clean(val));   // strip undefined in place
  if(AUTOINC.has(store) && (val[kp]===undefined || val[kp]===null)) val[kp] = nextIdLocal(store);
  const data = clean(val); const k = String(val[kp]);
  if(__ready[store]){
    const old = __cache[store].get(k);
    if(old && stable(old)===stable(data)) return val[kp];   // identical to what is already saved: no duplicate write
    __cache[store].set(k, data);   // write-through: visible to the very next read
  }
  bumpRev(store); markLocal(store,k);
  writeAck(f.setDoc(f.doc(f.db, store, k), data));
  return val[kp];
}
async function dbPut(store, val){ return dbPutNow(store, val); }
async function dbDel(store, key){
  const f = fb(); const k = String(key); if(__ready[store]) __cache[store].delete(k);
  bumpRev(store); markLocal(store,k); writeAck(f.deleteDoc(f.doc(f.db, store, k)));
}
async function dbClear(store){
  const f = fb(); const snap = await f.getDocs(f.collection(f.db, store)); const docs = snap.docs;
  for(let i=0;i<docs.length;i+=400){ const b=f.writeBatch(f.db); docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await writeAck(b.commit()); }
  if(__ready[store]) __cache[store].clear(); bumpRev(store);
}
/* Counters (invoice numbers, membership receipts). With a working connection this is a cloud transaction, so two phones can never
   issue the same number; with no connection — or if the cloud does not answer within a moment — the number is issued locally at once. */
async function dbIncrement(store, key, field){
  const f = fb(); const k = String(key); const ref = f.doc(f.db, store, k);
  const local = ()=>{ const d = clean(dbGetRO(store,key)) || {}; const v = d[field]||1; d[field] = v+1; dbPutNow(store, d); return v; };
  if(!cloudLikely()) return local();
  let abandoned = false;
  const tx = f.runTransaction(f.db, async t=>{ if(abandoned) throw new Error('abandoned'); const snap=await t.get(ref); const d=snap.exists()?snap.data():{}; const cur=d[field]||1; t.set(ref, Object.assign({}, d, {[field]:cur+1})); return cur; }).then(v=>({v}), ()=>null);
  const r = await Promise.race([tx, new Promise(res=>setTimeout(()=>res('timeout'),1200))]);
  if(r && r!=='timeout'){ if(__ready[store] && __cache[store].has(k)){ __cache[store].get(k)[field] = r.v+1; bumpRev(store); } return r.v; }
  abandoned = true; __cloudBadAt = Date.now(); return local();
}
/* Read-modify-write on the device's own latest copy, in one uninterrupted step (nothing is awaited between read and write),
   so two quick taps can never overwrite each other. It never waits for the network. */
async function dbUpdate(store, key, fn){
  const k = String(key); let cur = dbGetRO(store,key);
  if(cur===undefined){ cur = await dbGet(store,key); const again = dbGetRO(store,key); if(again!==undefined) cur = again; }
  const d = cur===undefined ? undefined : clean(cur);
  let result; try{ result = fn(d); }catch(e){ e.__app = true; throw e; }
  if(d!==undefined) dbPutNow(store, d);
  return { doc:d, result };
}
let __renderTimer = null;
function scheduleRender(){   // debounced; never repaints while someone is typing in a form field
  clearTimeout(__renderTimer);
  __renderTimer = setTimeout(()=>{
    if(state.screen==='backup') return;   // static screen: a background sync must never wipe the backup file you just chose
    const a = document.activeElement, root = document.getElementById('root');
    if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && root.contains(a)){ scheduleRender(); return; }
    try{ render(); }catch(e){}
  }, 300);
}
/* A snapshot is applied by comparing it with what we already hold: the echo of our own write changes nothing and repaints nothing. */
function applySnapshot(store, snap, first){
  const prev = __cache[store]; const changed = [];
  const ch = (!first && prev && typeof snap.docChanges==='function') ? snap.docChanges() : null;
  const f = fb();
  if(!ch){
    const next = new Map(snap.docs.map(d=>[d.id, d.data()]));
    if(prev && !first){ next.forEach((v,id)=>{ const o=prev.get(id); if(!o || stable(o)!==stable(v)) changed.push(id); }); prev.forEach((v,id)=>{ if(!next.has(id)) changed.push(id); }); } else changed.push('*');
    __cache[store] = next; __ready[store] = true; return changed;
  }
  ch.forEach(c=>{
    const id = c.doc.id; const mine = __lw[store+'|'+id] && Date.now()-__lw[store+'|'+id] < 1500;
    if(c.type==='removed'){ if(mine) return; if(prev.delete(id)) changed.push(id); return; }
    const v = c.doc.data(), o = prev.get(id);
    if(o && stable(o)===stable(v)) return;   // our own write coming back
    if(mine){   // a snapshot that overlaps a very recent local write: keep ours, double-check shortly
      setTimeout(async()=>{ try{ const s = await f.getDoc(f.doc(f.db,store,id)); const nv = s.exists()?s.data():undefined; const cur = __cache[store].get(id);
        if(Date.now()-(__lw[store+'|'+id]||0) < 1400) return; if(nv===undefined ? cur!==undefined : (!cur || stable(cur)!==stable(nv))){ if(nv===undefined) __cache[store].delete(id); else __cache[store].set(id,nv); afterSync(store,[id]); } }catch(e){} }, 1700);
      return;
    }
    prev.set(id, v); changed.push(id);
  });
  return changed;
}
function afterSync(store, changed){
  if(!changed.length) return;
  bumpRev(store);
  if(store==='settings'){ const m = __cache.settings.get('main'); if(m) state.settings = m; }
  if(store==='bsessions'){
    if(changed[0]==='*') liveSessions = [...__cache.bsessions.values()].filter(x=>isOpenStatus(x.status));
    else changed.forEach(id=>{ const s = __cache.bsessions.get(String(id)); if(s) updateLiveCache(s); else liveSessions = liveSessions.filter(x=>String(x.id)!==String(id)); });
    if(state.screen==='dashboard' && changed[0]!=='*' && changed.every(id=>patchDashSession(id))) return;   // only the affected session cards are redrawn
  }
  scheduleRender();
}
function startSync(){
  const f = fb();
  return new Promise(resolveAll=>{
    let pending = ALL_STORES.length; const done = ()=>{ if(--pending===0) resolveAll(); };
    ALL_STORES.forEach(store=>{
      let first = true; const w = WINDOWED[store]; const col = f.collection(f.db, store);
      const q = w ? f.query(col, f.where(w.field, '>=', Date.now()-w.days*86400000)) : col;
      f.onSnapshot(q, snap=>{
        const changed = applySnapshot(store, snap, first);
        if(first){ first = false; if(store==='bsessions') liveSessions = [...__cache.bsessions.values()].filter(x=>isOpenStatus(x.status)); if(store==='settings'){ const m=__cache.settings.get('main'); if(m) state.settings=m; } bumpRev(store); done(); }
        else afterSync(store, changed);
      }, err=>{ console.error('Real-time sync error on', store, err); if(first){ first = false; done(); } });
    });
    setTimeout(()=>resolveAll(), 6000);   // never hold the app hostage to the network
  });
}

/* Duration: integer minutes internally. Input may be minutes or decimal hours. */
function toMinutes(value, unit){ const v=Number(value); if(!isFinite(v)||v<=0) return NaN; return unit==='hours' ? Math.round(v*60) : Math.round(v); }
function durationPolicy(){ const s=state.settings||{}; return { custom:!!s.customDurationsEnabled, rules:s.customRules||[] }; }
function validateMinutes(min, pol){
  if(!Number.isInteger(min) || min<=0) return 'Enter a duration greater than zero.';
  if(!pol.custom && min%30!==0) return 'Custom durations are off. Use multiples of 30 minutes, or ask an admin to enable Custom Duration Rules in Settings.';
  return '';
}
/* Standard LVL policy: whole hours at the hourly rate + a 30-minute block at the half-hour rate.
   Only when custom durations are enabled: a configured rule for the leftover minutes wins,
   otherwise the leftover is charged proportionally to the hourly rate. */
function gamingCharge(min, hr, half, pol){
  const hours=Math.floor(min/60), rem=min%60; let total=hours*hr;
  if(rem===0) return total;
  if(rem===30) return total+half;
  const rule=(pol.rules||[]).find(r=>Number(r.minutes)===rem);
  if(rule) return total + (rule.mode==='flat' ? Math.round(Number(rule.value)) : Math.round(hr*Number(rule.value)/100));
  return total + Math.round(hr*rem/60);
}
/* Recomputes gross/total of one bill line from its own snapshot fields. Called only when the line
   is created or edited, so later price/policy changes never silently alter existing entries. */
function computeLine(l){
  const pol = l.policySnap || durationPolicy();
  if(l.kind==='gaming'){ l.unitPrice=l.hr; l.qty=1; l.unit='hour'; l.gross=gamingCharge(l.minutes, l.hr, l.half, pol); }
  else if(l.kind==='accompany'){ l.gross = l.free ? 0 : Math.round(l.qty*l.unitPrice*l.minutes/60); }
  else { l.gross = Math.round(l.qty*l.unitPrice); }
  const d = Math.min(100, Math.max(0, Number(l.discountPct)||0));
  l.total = Math.round(l.gross*(1-d/100));
  return l;
}
/* Bill totals. Discount % applies ONLY to gaming lines (food is never discounted at invoice level). */
function billTotals(lines, gamingDiscountPct, settings, extra){
  const b={gaming:0,accompany:0,overtime:0,food:0,other:0};
  lines.forEach(l=>{ b[l.bucket||'other'] += l.total; });
  const subtotal = b.gaming+b.accompany+b.overtime+b.food+b.other;
  const pct = Math.min(100, Math.max(0, Number(gamingDiscountPct)||0));
  const discount = Math.round(b.gaming*pct/100);
  const x0 = extra||{}; const memFree=Math.round(Number(x0.memFree)||0), memDisc=Math.round(Number(x0.memDisc)||0), memFood=Math.round(Number(x0.memFood)||0), loyalty=Math.round(Number(x0.loyalty)||0);
  const benefit = memFree+memDisc+memFood+loyalty;   // membership + loyalty reductions (never combined with the manual discount: checkout forces that to 0 when a membership applies)
  let tax = 0;
  if(settings.taxEnabled){
    const taxable = lines.filter(l=>l.taxable!==false).reduce((s,l)=>s+l.total,0);
    const gTaxable = lines.filter(l=>l.taxable!==false && l.bucket==='gaming').reduce((s,l)=>s+l.total,0);
    const dTax = b.gaming>0 ? discount*gTaxable/b.gaming : 0;
    tax = Math.max(0, Math.round((taxable - dTax - (subtotal>0 ? benefit*taxable/subtotal : 0)) * (Number(settings.taxRate)||0)/100));
  }
  const x = extra||{}; const adjustment = Math.round(Number(x.adjustment)||0);          // whole rupees: totals stay exact integers
  const tcs = Math.round((subtotal - discount - benefit + tax) * (Number(x.tcsPct)||0) / 100);   // collected on top, like tax
  const tds = Math.round((subtotal - discount - benefit) * (Number(x.tdsPct)||0) / 100);          // deducted by the customer
  return { ...b, subtotal, discountPct:pct, discount, memFree, memDisc, memFood, loyalty, benefit, tax, adjustment, tcs, tds, grand: subtotal - discount - benefit + tax + adjustment + tcs - tds };
}

async function updateDailyRecord(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number); const t0 = new Date(y,m-1,d).getTime(), t1 = new Date(y,m-1,d+1).getTime();
  const invoices = dbAllRO('invoices').filter(i=>i.date>=t0 && i.date<t1);
  const expenses = dbAllRO('expenses').filter(e=>!e.isTemplate && e.date>=t0 && e.date<t1);
  invoices.push(...(await archivedOnDay(dateStr)));   // archived invoices of that day still count (they are in a separate store, so never counted twice)

/* ---- Android-style navigation ----
   navStack is the in-memory Back stack (screens you can go Back to). The Android Back button / gesture arrives as a browser

   Active gaming sessions live in the database, so navigating Back never discards one. */
const NAV_TABS = ['dashboard','gaming','invoices','membership','more'];
const NAV_IDENTITY = ['sessionId','invoiceId','custProfile','vendorId','empId'];

function navSnap(){
  const e = { screen:state.screen, scrollY:Math.round(window.scrollY||0) };
  NAV_IDENTITY.forEach(k=>{ if(state[k]!==undefined && state[k]!==null) e[k]=state[k]; });
  if(state.screen==='picker' && state.pick) e.sessionId = state.pick.sid;
  if(state.screen==='itemInfo' && state.ii){ e.sessionId = state.ii.sid; e.iiKey = state.ii.lid ? 'L'+state.ii.lid : 'N'; }
  if(state.screen==='checkout' && state.ckForm) e.sessionId = state.ckForm.sid;
  return e;
}
function navKey(e){
  const id = ['session','picker','checkout','itemInfo'].includes(e.screen) ? e.sessionId+(e.iiKey||'') : e.screen==='invoiceView' ? e.invoiceId : e.screen==='customerProfile' ? e.custProfile : e.screen==='vendorProfile' ? e.vendorId : e.screen==='employeeProfile' ? e.empId : '';

}
function go(screen, opts){
  opts = opts||{}; const prevScreen = state.screen;

  state.screen = screen;
  const next = navSnap();
  if(NAV_TABS.includes(screen)){      // tab / Dashboard: the Dashboard becomes the root of the stack
    const dashScroll = navCur.screen==='dashboard' ? navCur.scrollY : (navStack[0] && navStack[0].screen==='dashboard' ? navStack[0].scrollY : 0);
    navStack = screen==='dashboard' ? [] : [{ screen:'dashboard', scrollY:dashScroll }];
    if(screen==='dashboard' && navCur.screen==='dashboard') scroll = navCur.scrollY;
  } else {
    let idx = -1; const nk = navKey(next);
    for(let i=navStack.length-1;i>=0;i--){ if(navKey(navStack[i])===nk){ idx=i; break; } }
    if(idx>=0){ scroll = navStack[idx].scrollY||0; navStack.length = idx; }   // going to a screen already in the stack = going back to it
    else if(!opts.replace && !(['picker','checkout'].includes(navCur.screen) && screen==='session') && navKey(navCur)!==nk){ navStack.push(Object.assign({}, navCur)); }

function navRestore(e){
  NAV_IDENTITY.forEach(k=>{ if(e[k]!==undefined) state[k]=e[k]; });

/* Things that must be settled before leaving a screen. Returns false if the user chose to stay. */
async function leaveGuard(){

/* One step back. Picker and checkout return to the session bill; everything else returns to the previous screen. */

/* ---- History layer ----
   Chrome (Android) skips history entries that were created without a tap ("history manipulation intervention"), so an entry
   pushed from inside a popstate handler is skipped by the next Back press and the app closes. Therefore the app never relies on
   re-pushing after Back: it keeps a buffer of HIST_BUF entries, every one created inside a real tap, and tops the buffer up on
   the next tap after any Back press. */
const HIST_BUF = 12;
function histIdx(){ const h = history.state; return h && typeof h.i==='number' ? h.i : 0; }
function histFill(force){
  try{
    const i = histIdx();
    if(i >= HIST_BUF) return;
    if(!force && !(navigator.userActivation ? navigator.userActivation.isActive : true)) return;   // only entries created inside a tap are reliable
    for(let k=i+1;k<=HIST_BUF;k++) history.pushState({lvl:'app', i:k}, '');
  }catch(e){}
}
function setupNavigation(){
  try{ history.scrollRestoration = 'manual'; }catch(e){}   // the app restores scroll itself; the browser's own restore would reset it to 0
  try{
    const hs = history.state;
    if(hs && hs.lvl==='app'){ /* the page was refreshed: its history entries are still in place — add nothing */ }
    else { history.replaceState({lvl:'base', i:0}, ''); history.pushState({lvl:'app', i:1}, ''); }
  }catch(e){}
  ['pointerup','keyup','touchend'].forEach(t=>document.addEventListener(t, ()=>histFill(false), true));
  window.addEventListener('popstate', ()=>{
    if(navExiting){ return; }
    if(histIdx() <= 0) histFill(true);       // reached the bottom entry without a tap in between: best-effort refill so Back is still caught
    handleBack();
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && dismissTopLayer()) e.preventDefault(); });
  try{ const A = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App; if(A && A.addListener) A.addListener('backButton', ()=>handleBack()); }catch(e){}
}

function dlgRoot(){ let r=document.getElementById('dlgRoot'); if(!r){ r=document.createElement('div'); r.id='dlgRoot'; document.body.appendChild(r); } return r; }

/* ============ Sessions (editable draft bills) ============ */
/* A SESSION is a master bill made of LINES. Gaming lines are independent SEGMENTS (any number, of any setup/player-count),
   each with its own start/end time or manual duration. Stays editable until finalized into ONE invoice. Store: 'bsessions'. */
let liveSessions = [];   // in-memory cache of open sessions for the 1-second timer ticker (no DB reads per tick)

/* Every change to a session goes through mutateSession: it re-reads the LATEST stored session, applies the change and writes
   it back atomically (a Firestore transaction when online), one change at a time per session. A stale screen — or a second
   phone — can therefore never resurrect a deleted line or overwrite someone else's change. */
const __sesQueue = {};
function mutateSession(sid, fn){
  const run = async ()=>{
    const r = await dbUpdate('bsessions', sid, d=>{
      if(!d) throw new Error('This session no longer exists.');
      if(!sesEditable(d)) throw new Error(`This session is ${STATUS_LABEL[d.status]} and can't be edited. To correct a finalized bill use Credit / Refund on its invoice.`);
      const out = fn(d); d.updatedAt = Date.now(); return out;
    });
    updateLiveCache(r.doc); patchDashSession(sid); return r.result;   // if the dashboard is showing, only this session's card is redrawn
  };
  const p = (__sesQueue[sid]||Promise.resolve()).then(run, run);
  __sesQueue[sid] = p.catch(()=>{});
  return p;
}
async function act(promise){ try{ return await promise; }catch(e){ tell(e && e.message ? e.message : String(e)); return undefined; } }
function timeStr(ts){ return ts ? new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}) : '—'; }
function toLocalInput(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function lineElapsedMs(l){ return (l.elapsedMs||0) + (l.state==='running' && l.startedAt ? Date.now()-l.startedAt : 0); }
function stopLine(l){ if(l.kind!=='gaming'||l.state==='ended') return; l.elapsedMs=lineElapsedMs(l); l.state='ended'; l.endedAt=Date.now(); l.startedAt=null; }
function newLine(s, kind, props){
  const id = s.nextLineId || (Math.max(0,...s.lines.map(x=>x.id))+1);
  const l = Object.assign({ id, kind, name:'', category:'', itemId:null, qty:1, unit:'', unitPrice:0, discountPct:0, taxable:true, notes:'', bucket:'other', included:null, history:[], createdAt:Date.now() }, props);
  s.nextLineId = id+1; s.lines.push(l); return l;
}
function logHist(l, patch, fields){
  const by = isAdmin() ? 'Admin' : 'Staff'; l.history = l.history || [];
  fields.forEach(f=>{ if(patch[f]!==undefined && l[f]!==undefined && JSON.stringify(patch[f])!==JSON.stringify(l[f]))   /* fields an older line never had are defaults being filled in, not edits */ l.history.push({ t:Date.now(), by, field:f, from:l[f]===undefined?null:l[f], to:patch[f] }); });
}

async function physicalBusy(physId, exceptSid, exceptLid){

let __startLock = false;
function startSession(){   // instant: the session is created in memory + the local database and opened at once; nothing waits for the cloud

/* ---- Smart existing-customer search (name or mobile) — works from saved local customers, offline ---- */
function nameKey(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/h/g,'').replace(/w/g,'v').replace(/ph/g,'f').replace(/(.)\1+/g,'$1'); }
function editDistance1(a,b){   // true if a and b differ by at most one insertion, deletion or substitution
  if(a===b) return true; if(Math.abs(a.length-b.length)>1) return false;
  let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++;
  if(a.length===b.length) return a.slice(i+1)===b.slice(i+1);
  return a.length>b.length ? a.slice(i+1)===b.slice(i) : b.slice(i+1)===a.slice(i);
}
function custMatches(custs, raw, mode){
  const q = String(raw||'').trim(); if(!q) return [];
  const out = [];
  if(mode==='mobile'){
    const d = q.replace(/\D/g,''); if(d.length<2) return [];
    custs.forEach(c=>{ const m=String(c.mobile||''); const i=m.indexOf(d); if(i<0) return; out.push({ c, t: i===0?0 : m.endsWith(d)?1 : 2 }); });
  } else {
    const ql = q.toLowerCase(), qk = nameKey(q);
    custs.forEach(c=>{
      const n = String(c.name||'').toLowerCase(); if(!n) return;
      const words = n.split(/\s+/);
      let t = -1;
      if(n.startsWith(ql) || words.some(w=>w.startsWith(ql))) t = 0;
      else if(n.includes(ql)) t = 1;
      else if(qk.length>=2 && (nameKey(n).includes(qk))) t = 2;
      else if(ql.length>=3 && words.some(w=>editDistance1(w.slice(0,ql.length),ql) || editDistance1(w.slice(0,ql.length+1),ql) || editDistance1(w.slice(0,ql.length-1),ql))) t = 3;
      if(t>=0) out.push({ c, t });
    });
  }
  out.sort((a,b)=>a.t-b.t || (b.c.lastVisit||'').toString().localeCompare((a.c.lastVisit||'').toString()) || String(a.c.name).localeCompare(String(b.c.name)));
  return out.slice(0,6).map(x=>x.c);
}
/* Customer search index: built once per change to the customer list (prefix table on the first 1-3 letters of every word, plus precomputed lowercase
   name / mobile strings), so a keystroke only touches a handful of candidates instead of re-reading and re-parsing every customer. */
function custIndex(){
  return memo('custIdx', ['customers'], ()=>{
    const ents = dbAllRO('customers').map(c=>{ const n = String(c.name||'').toLowerCase(); return { c, n, words:n.split(/\s+/).filter(Boolean), nk:null, m:String(c.mobile||'') }; });
    const pre = new Map();
    ents.forEach(e=>{ const seen = new Set(); e.words.forEach(w=>{ for(let k=1;k<=3;k++){ const key = w.slice(0,k); if(seen.has(key)) continue; seen.add(key); let a = pre.get(key); if(!a){ a=[]; pre.set(key,a); } a.push(e); } }); });
    return { ents, pre };
  });
}
function custRank(out){ out.sort((a,b)=>a.t-b.t || (b.c.lastVisit||'').toString().localeCompare((a.c.lastVisit||'').toString()) || String(a.c.name).localeCompare(String(b.c.name))); return out.slice(0,6).map(x=>x.c); }
function custSearch(raw, mode){
  const q = String(raw||'').trim(); if(!q) return [];
  const { ents, pre } = custIndex(); const out = [];
  if(mode==='mobile'){
    const d = q.replace(/\D/g,''); if(d.length<2) return [];
    for(const e of ents){ const i = e.m.indexOf(d); if(i>=0) out.push({ c:e.c, t: i===0?0 : e.m.endsWith(d)?1 : 2 }); }
    return custRank(out);
  }
  const ql = q.toLowerCase(), qk = nameKey(q), first = ql.split(/\s+/)[0];
  const cands = pre.get(first.slice(0,3)) || [], got = new Set();
  for(const e of cands){ if(e.n.startsWith(ql) || e.words.some(w=>w.startsWith(ql))){ out.push({ c:e.c, t:0 }); got.add(e); } }
  const stage = (t, test)=>{ if(out.length>=6) return; for(const e of ents){ if(got.has(e) || !e.n) continue; if(test(e)){ out.push({ c:e.c, t }); got.add(e); } } };
  stage(1, e=>e.n.includes(ql));
  stage(2, e=>{ if(qk.length<2) return false; if(e.nk===null) e.nk = nameKey(e.n); return e.nk.includes(qk); });
  stage(3, e=>ql.length>=3 && e.words.some(w=>editDistance1(w.slice(0,ql.length),ql) || editDistance1(w.slice(0,ql.length+1),ql) || editDistance1(w.slice(0,ql.length-1),ql)));
  return custRank(out);
}
function fmtMobile(m){ m=String(m||''); return m.length===10 ? '+91 '+m.slice(0,5)+' '+m.slice(5) : m; }

/* attach a suggestion dropdown to an input. onPick(customer) fills the form. */
function attachCustomerSuggest(input, mode, onPick){
  if(!input || input.__ac) return; input.__ac = true;
  const wrap = document.createElement('div'); wrap.className='acwrap'; input.parentNode.insertBefore(wrap, input); wrap.appendChild(input);
  const box = document.createElement('div'); box.className='acbox'; box.setAttribute('role','listbox'); box.hidden = true; box.id = 'ac-'+input.id; wrap.appendChild(box);
  input.setAttribute('role','combobox'); input.setAttribute('aria-autocomplete','list'); input.setAttribute('aria-expanded','false'); input.setAttribute('aria-controls',box.id); input.setAttribute('autocomplete','off');
  let items = [], idx = -1, dismissed = false;
  const close = ()=>{ box.hidden = true; input.setAttribute('aria-expanded','false'); idx=-1; };
  const paint = ()=>{
    box.innerHTML = items.map((c,i)=>`<div class="acitem${i===idx?' on':''}" role="option" aria-selected="${i===idx}" data-i="${i}"><b>${esc(c.name)}</b><span>${esc(fmtMobile(c.mobile))}</span></div>`).join('');
    box.hidden = !items.length; input.setAttribute('aria-expanded', String(!!items.length));
    if(items.length){ const on = box.querySelector('.on'); if(on) on.scrollIntoView({block:'nearest'}); else { try{ box.scrollIntoView({block:'nearest'}); }catch(e){} } }
  };
  const pick = i=>{ const c = items[i]; if(!c) return; close(); input.blur && 0; onPick(c); };
  const search = async()=>{
    if(dismissed) return;
    items = custSearch(input.value, mode); idx = -1; paint();
  };
  input.addEventListener('input', ()=>{ clearTimeout(bt); dismissed = false; search(); });
  input.addEventListener('focus', ()=>{ clearTimeout(bt); if(input.value.trim() && !dismissed) search(); });
  input.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ if(!box.hidden){ dismissed = true; close(); e.stopPropagation(); e.preventDefault(); } return; }
    if(box.hidden || !items.length) return;
    if(e.key==='ArrowDown'){ idx=(idx+1)%items.length; paint(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ idx=(idx-1+items.length)%items.length; paint(); e.preventDefault(); }
    else if(e.key==='Enter' && idx>=0){ pick(idx); e.preventDefault(); }
  });
  let bt=null; input.addEventListener('blur', ()=>{ clearTimeout(bt); bt=setTimeout(close, 180); });
  // pointerdown (not click) so the input's blur can't close the list before the tap lands; works for touch and mouse
  box.addEventListener('pointerdown', e=>{ const el = e.target.closest('.acitem'); if(!el) return; e.preventDefault(); pick(Number(el.dataset.i)); });
}

        const l = s.lines.find(x=>x.id===lid); if(!l) throw new Error('This line was removed — nothing was changed.');
        const patch = ii.kind==='gaming' ? { minutes, hr:rate, half, notes:desc } : ii.kind==='accompany' ? { qty, minutes, unitPrice:rate, free, notes:desc } : { qty, unitPrice:rate, notes:desc };
        logHist(l, patch, ['minutes','hr','half','unitPrice','qty','free']);
        Object.assign(l, patch); computeLine(l); return true;
      }
      let l;
      if(ii.kind==='gaming'){ if(!st) throw new Error('That gaming setup no longer exists.'); l = makeGamingLine(s, st, ii.players, { minutes, hr:rate, half, notes:desc }); }
      else if(ii.kind==='accompany'){ l = addAccompanyLine(s, prod||{name:ii.name,cat:ii.cat,id:ii.itemId,price:rate}, qty, minutes, free); l.unitPrice = rate; l.notes = desc; }
      else if(ii.kind==='overtime'){ l = newLine(s,'overtime',{ name:ii.name, category:ii.cat, itemId:ii.itemId, qty, unit:ii.unit, unitPrice:rate, bucket:'overtime', notes:desc }); }
      else { l = newLine(s,'item',{ name:ii.name, category:ii.cat, itemId:ii.itemId, qty, unit:ii.unit||'pc', unitPrice:rate, bucket:ii.bucket||'other', included:ii.kind==='combo'?[ii.drinks[0],ii.drinks[1]]:null, notes:desc }); }
      computeLine(l); return true;
    }));
    if(ok){ state.ii = null; showToast(lid?'Line updated':'Added '+ii.name); await openSession(sid); }
  } finally { if(state.ii) state.ii.saving = false; }
}

function makeGamingLine(s, st, players, extra){
  const r = st.rates[players] || [0,0]; const now = Date.now();
  return newLine(s,'gaming', Object.assign({ name:variantName(st,players), category:st.category||'Gaming', setupLabel:setupLabel(st), stationId:st.id, console:st.console, tv:st.tv||'', players,
    minutes:state.settings.defaultGamingMinutes||60, hr:r[0], half:r[1], physicalId:null, physicalName:'', state:'running', startedAt:now, startTime:now, elapsedMs:0, endedAt:null, bucket:'gaming', policySnap:durationPolicy() }, extra||{}));
}
function addItemLine(s, p, included, qty){
  qty = qty||1;
  if(p.type==='overtime') return newLine(s,'overtime',{name:p.name,category:p.cat,itemId:p.id,qty,unit:overtimeUnitLabel(state.settings),unitPrice:p.price,bucket:'overtime'});
  const same = !included && s.lines.find(x=>x.kind==='item' && x.itemId===p.id && !x.included && !x.notes && x.unitPrice===p.price && !x.discountPct);
  if(same){ same.qty += qty; return same; }
  return newLine(s,'item',{name:p.name,category:p.cat,itemId:p.id,qty,unit:p.unit||'pc',unitPrice:p.price,bucket:bucketForType(p.type),included:included||null});
}
function addAccompanyLine(s, p, persons, minutes, free){
  return newLine(s,'accompany',{name:p.name,category:p.cat,itemId:p.id,qty:persons,unit:'person/hour',unitPrice:p.price,minutes,free:!!free,bucket:'accompany'});
}

/* ---- Edit Bill (dashboard shortcut): edit/copy/delete any unfinalized line without opening the session ---- */
/* ---- Live ticker & expiry alerts (per gaming segment; reads the in-memory cache, not the database) ---- */
const expiredAlerted = {};
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<2;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=800; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i*0.4;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t+0.03); g.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
      o.start(t); o.stop(t+0.32);
    }
    setTimeout(()=>ctx.close(), 1200);
  }catch(e){}
}
function fmtClock(totalSec){ const neg=totalSec<0; const a=Math.abs(totalSec); return (neg?'-':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0'); }
/* Time's up: a small dismissible banner (Extend · End Session · Dismiss). It never blocks the screen, never ends or changes
   anything by itself, and shows once per end time — it only comes back if the segment is extended and reaches its new end. */
const ALERT_KEY = 'lvl_alerted_v1';
const alerted = (()=>{ try{ return JSON.parse(sessionStorage.getItem(ALERT_KEY)||'{}'); }catch(e){ return {}; } })();
function markAlerted(k){ alerted[k]=Date.now(); try{ sessionStorage.setItem(ALERT_KEY, JSON.stringify(alerted)); }catch(e){} }
function dismissTimeUp(key){
  const el = document.getElementById('expiryBanner-'+key); if(!el) return;
  el.style.opacity='0'; el.style.transform = (el.style.transform||'') + ' translateY(-12px)'; setTimeout(()=>el.remove(), 220);
}
function wireTimeUpSwipe(el, key){
  let x0=0, y0=0, dx=0, dy=0, drag=false;
  el.addEventListener('pointerdown', e=>{ if(e.target.closest('button')) return; drag=true; x0=e.clientX; y0=e.clientY; dx=dy=0; el.style.transition='none'; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove', e=>{ if(!drag) return; dx=e.clientX-x0; dy=e.clientY-y0; el.style.transform=`translate(${dx}px,${dy}px)`; el.style.opacity=String(Math.max(.25, 1-Math.max(Math.abs(dx),Math.abs(dy))/220)); });
  const end = ()=>{ if(!drag) return; drag=false; el.style.transition='';
    if(Math.abs(dx)>70 || Math.abs(dy)>45){ el.style.transform=`translate(${dx*3}px,${dy*3}px)`; el.style.opacity='0'; setTimeout(()=>el.remove(),220); }
    else { el.style.transform=''; el.style.opacity=''; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function showTimeUpBanner(sid, l){
  const key = sid+'-'+l.id; if(document.getElementById('expiryBanner-'+key)) return;
  let stack = document.getElementById('alertStack'); if(!stack){ stack=document.createElement('div'); stack.id='alertStack'; document.body.appendChild(stack); }
  while(stack.children.length>=3) stack.firstElementChild.remove();
  const el = document.createElement('div'); el.id='expiryBanner-'+key; el.className='tu'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
  el.innerHTML = `<b>Time added so far is used up — ${esc(gamingTitle(l))}</b><div class="muted" style="font-size:12px">The bill stays ${fmtDur(l.minutes)} until you edit the item.</div>
    <div class="tu-a"><button class="btn sm primary" onclick="dismissTimeUp('${key}');openLineEdit(${sid},${l.id})">Edit item</button><button class="btn sm ghost" onclick="dismissTimeUp('${key}')">Dismiss</button></div>`;
  stack.appendChild(el); wireTimeUpSwipe(el, key);
  setTimeout(()=>{ if(el.isConnected) dismissTimeUp(key); }, 20000);   // goes away by itself
}
function tickSessions(){
  const live = new Set();
  liveSessions.forEach(s=>{ s.lines.forEach(l=>{
    if(l.kind!=='gaming' || l.state!=='running') return;
    const key=s.id+'-'+l.id; live.add(key);
    const remaining = Math.floor(l.minutes*60 - lineElapsedMs(l)/1000);
    const el = document.getElementById('lt-'+key);
    if(el){
      if(remaining>=0){ el.innerHTML=`Time left: <b>${fmtClock(remaining)}</b> | Billed: ${fmtDur(l.minutes)}`; el.style.color = remaining<120?'var(--amber)':''; }
      else el.innerHTML=`<span style="color:var(--red);font-weight:600">Over by ${fmtClock(-remaining)}</span> | Billed: ${fmtDur(l.minutes)}`;
    }
    if(remaining<0){
      const ak = key+':'+l.minutes;   // one alert per end time; extending the segment gives it a new end time
      if(!alerted[ak]){ markAlerted(ak); if(-remaining<=900){ beep(); showTimeUpBanner(s.id, l); } }   // already >15 min over when first seen (e.g. app reopened): no banner, the card shows "Over by"
    }
  }); });
  document.querySelectorAll('[id^="expiryBanner-"]').forEach(b=>{ if(!live.has(b.id.replace('expiryBanner-',''))) b.remove(); });
}
setInterval(tickSessions, 1000);

/* ============ Dashboard ============ */
function sessionCard(s){
  const t = sessionTotals(s);
  const g = s.lines.filter(l=>l.kind==='gaming');

function dashStats(){   // today's totals: recomputed only when invoices or expenses actually changed (and when the date rolls over)
  return memo('dash:'+dateKey(Date.now()), ['invoices','expenses'], ()=>{
    const invoices = dbAllRO('invoices'), expenses = dbAllRO('expenses').filter(e=>!e.isTemplate);
    const todayInv = invoices.filter(i=>isToday(i.date)), todayExp = expenses.filter(e=>isToday(e.date));
    return { gamingRev: todayInv.reduce((s,i)=>s+(i.gamingAmount||0)+(i.accompanyAmount||0)+(i.overtimeAmount||0),0),

      expTotal: todayExp.reduce((s,e)=>s+e.amount,0), receivable: invoices.reduce((s,i)=>s+Math.max(0,invoiceBalance(i)),0) };
  });
}

async function finalizeCheckout(){
  if(state.finalizing) return; state.finalizing=true;
  const btn=document.getElementById('ckFinalize'); if(btn){ btn.disabled=true; btn.style.opacity='.5'; }

    const f=state.ckForm; const s=await dbGet('bsessions', f.sid);

    if(t.grand-paid>0 && !(await askConfirm(paid>0 ? `Only ${fmt(paid)} (${f.payments.filter(p=>Math.round(Number(p.amount)||0)>0).map(p=>p.method).join(' + ')}) is recorded. Balance of ${fmt(t.grand-paid)} will remain due on this invoice. Finalize anyway?` : `No payment method is selected, so this invoice will be saved as UNPAID (${fmt(t.grand)} due). Finalize anyway?`,'Finalize'))) throw {silent:true};
    const inv = await finalizeSessionCore(f);
    state.ckForm=null; state.ckSession=null; state.invoiceId=inv.id;
    go('dashboard'); showInvoiceDone(inv);
  }catch(e){ if(!e.silent) tell(e.message||String(e)); }

/* The ONE place an invoice is created (checkout). */
const __finalizing = new Set();
async function finalizeSessionCore(f, opts){   // one checkout per session at a time: a second tap / retry while one is running is refused, never duplicated
  if(__finalizing.has(f.sid)) throw Object.assign(new Error('This checkout is already being processed.'), { silent:true });
  __finalizing.add(f.sid);
  try{ return await finalizeSessionCoreRun(f, opts); } finally { __finalizing.delete(f.sid); }
}
async function finalizeSessionCoreRun(f, opts){
  opts = opts||{};
  const s = await dbGet('bsessions', f.sid);
  if(!s) throw new Error('Session not found.');
  if(!isOpenStatus(s.status) || s.invoiceId) throw new Error(`This session is already ${STATUS_LABEL[s.status]||'billed'} — it can't be invoiced twice.`);
  if(!s.lines.length) throw new Error('Add at least one line before finalizing.');
  const settings = (await dbGet('settings','main')) || state.settings;
  const mobRaw=(f.mobile||'').trim(); const mob = mobRaw ? normMobile(mobRaw) : '';
  if(mobRaw && !mob) throw new Error('Enter a valid 10-digit Indian mobile number, or leave it blank.');
  const name=(f.name||'').trim();
  const date = opts.date || Date.now();
  const mem = mob ? await activeMembership(mob) : null, acct = mob ? await loyaltyAccount(mob) : null; const cust0 = mob ? await dbGet('customers', mob) : null;
  const plan = benefitPlan(s.lines, Object.assign({}, f, { memOn: f.memOn===true }), settings, mem, acct, finOf(s)); const t = plan.t;
  const payments = (f.payments||[]).map(p=>({ method:p.method, amount:Math.round(Number(p.amount)||0), date })).filter(p=>p.amount>0);
  const paid = payments.reduce((a,p)=>a+p.amount,0);
  if(paid>t.grand) throw new Error(`Payments (${fmt(paid)}) are more than the invoice total (${fmt(t.grand)}).`);
  const n = await dbIncrement('settings','main','nextInvoiceNo');
  state.settings.nextInvoiceNo = n+1;

  if(!fresh || fresh.updatedAt!==s.updatedAt) throw new Error('This session was changed (possibly on another device) while you were checking out. Go back, review the bill, and finalize again.');

  inv.id = nextIdLocal('invoices');
  { const cur = dbGetRO('bsessions', f.sid); if(!cur || !isOpenStatus(cur.status) || cur.invoiceId) throw new Error('This session was already billed.'); }

    if(name) c.name=name;

  });

  await soft(async()=>{ await applyBenefitsToInvoice(inv, plan, mob); });

  return inv;
}

/* ============ Invoices ============ */
function invoicePaid(inv){ if(!inv.payments) return inv.grandTotal; return inv.payments.reduce((s,p)=>s+p.amount,0); }
function invoiceCredits(inv){ return (inv.adjustments||[]).filter(a=>a.type==='credit').reduce((s,a)=>s+a.amount,0); }
function invoiceBalance(inv){ return Math.round(inv.grandTotal - invoiceCredits(inv) - invoicePaid(inv)); }
function invoiceStatusPill(inv){ const b=invoiceBalance(inv); return b<=0 ? '<span class="pill green">Paid</span>' : '<span class="pill amber">Due '+fmt(b)+'</span>'; }
function invoiceSegments(inv){   // gaming segments, for reports — understands every invoice shape ever produced
  if(inv.lines) return inv.lines.filter(l=>l.kind==='gaming').map(l=>({ console:l.setupLabel||l.console||l.name, tv:l.tv||'', players:l.players, durationMins:l.minutes, charge:l.total }));
  if(inv.segments && inv.segments.length) return inv.segments;
  if(inv.console) return [{ console:inv.console, tv:inv.tv, players:inv.players, durationMins:inv.durationMins, charge:inv.gamingAmount }];
  return [];
}
function invoiceFoodItems(inv){
  if(inv.lines) return inv.lines.filter(l=>l.bucket==='food').map(l=>({ name:l.name, qty:l.qty }));
  return (inv.items||[]).map(i=>({ name:i.name, qty:i.qty }));
}
function lineText(l){
  if(l.kind==='gaming') return `${gamingTitle(l)} · ${fmtDur(l.minutes)}${l.physicalName?' · '+l.physicalName:''}`;
  if(l.kind==='accompany') return `Accompanying × ${l.qty} · ${fmtDur(l.minutes)}${l.free?' (free)':''}`;
  if(l.kind==='overtime') return `${l.name} × ${l.qty} ${l.unit||''}`.trim();
  return `${l.name} × ${l.qty}${l.included&&l.included.length?' ('+l.included.join(' + ')+')':''}`;
}
function invoiceLines(inv){   // normalized [{bucket,text,amount}]
  if(inv.lines) return inv.lines.map(l=>({ bucket:l.bucket, text:lineText(l)+(l.discountPct?` (-${l.discountPct}%)`:''), amount:l.total }));
  const out = invoiceSegments(inv).map(sg=>({ bucket:'gaming', text:`${sg.console} ${sg.tv||''} · ${sg.players}P · ${fmtDur(sg.durationMins)}`.replace('  ',' '), amount:sg.charge }));
  (inv.items||[]).forEach(i=>out.push({ bucket:'food', text:`${i.name} × ${i.qty}`, amount:i.price*i.qty }));
  if(inv.accompanyAmount) out.push({ bucket:'accompany', text:`Accompanying × ${inv.accompanyCount||''}`, amount:inv.accompanyAmount });
  return out;
}
const BUCKET_TITLE = { gaming:'🎮 GAMING', accompany:'👥 ACCOMPANYING PERSONS', overtime:'⏱ OVERTIME', food:'🍟 FOOD & BEVERAGES', other:'🛍 OTHER' };
function invoiceText(inv){
  const st = state.settings; const L = invoiceLines(inv);
  const out = [`🎮 ${st.businessName}`, '', `Invoice: ${inv.number}`, `Date: ${new Date(inv.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}`, `Customer: ${inv.customerName}${inv.customerMobile?' ('+inv.customerMobile+')':''}`];
  ['gaming','accompany','overtime','food','other'].forEach(b=>{ const ls=L.filter(x=>x.bucket===b); if(!ls.length) return; out.push('', BUCKET_TITLE[b]); ls.forEach(x=>out.push(`${x.text} — ${fmt(x.amount)}`)); });
  out.push('', `Subtotal: ${fmt(inv.subtotal)}`);
  if(inv.discount) out.push(`Discount${inv.discountPercent?' ('+inv.discountPercent+'% on gaming)':''}: -${fmt(inv.discount)}`);
  invBenefitRows(inv).forEach(([a,b])=>out.push(`${a}: ${b}`));
  if(inv.tax) out.push(`${inv.taxLabel||'Tax'}: ${fmt(inv.tax)}`);
  if(inv.adjustmentAmt) out.push(`Adjustment: ${fmt(inv.adjustmentAmt)}`);
  if(inv.tcs) out.push(`TCS: ${fmt(inv.tcs)}`);
  if(inv.tds) out.push(`TDS: -${fmt(inv.tds)}`);
  out.push(`TOTAL: ${fmt(inv.grandTotal)}`);
  const pays = (inv.payments||[]).filter(p=>p.amount>0).map(p=>`${p.method} ${fmt(p.amount)}`);
  if(inv.payments) out.push(`Paid: ${pays.join(' + ')||fmt(0)}`, `Balance due: ${fmt(Math.max(0,invoiceBalance(inv)))}`); else out.push(`Payment: ${inv.paymentMethod}`);
  out.push('', st.footer||''); return out.join('\n');
}
function pdfSafe(t){ return String(t).replace(/₹/g,'Rs.').replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[·×]/g,m=>m==='×'?'x':'-').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').replace(/([\\()])/g,'\\$1'); }
function buildPdf(lines){
  const per=54, pages=[]; for(let i=0;i<lines.length;i+=per) pages.push(lines.slice(i,i+per)); if(!pages.length) pages.push(['']);
  const objs=[]; objs[1]='<< /Type /Catalog /Pages 2 0 R >>'; objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>';
  let n=4; const kids=[];
  pages.forEach(pg=>{ const pid=n++, cid=n++; kids.push(pid+' 0 R');
    let st='BT /F1 10 Tf 40 802 Td 14 TL\n'; pg.forEach(l=>{ st+='('+pdfSafe(l)+') Tj T*\n'; }); st+='ET';
    objs[pid]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${cid} 0 R >>`;
    objs[cid]=`<< /Length ${st.length} >>\nstream\n${st}\nendstream`; });
  objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n'; const off=[];
  for(let i=1;i<n;i++){ off[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
  const x=out.length; out+=`xref\n0 ${n}\n0000000000 65535 f \n`; for(let i=1;i<n;i++) out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out],{type:'application/pdf'});
}
function invoicePdfLines(inv){
  const st=state.settings, W=62; const row=(a,b)=>{ const r=String(b); const room=W-r.length-1; const out=[]; let t=String(a);
    do{ const chunk=t.slice(0,room); t=t.slice(room); out.push(out.length? '  '+chunk : chunk.padEnd(room)+' '+r); }while(t.length); if(out.length>1){ const first=out.shift(); out.unshift(first); } return out; };
  const rule='-'.repeat(W); const o=[st.businessName, st.address||'', (st.phone?'Phone: '+st.phone:'')+(st.gstin?'  GSTIN: '+st.gstin:''), rule,
    `INVOICE ${inv.number}`, `Date: ${new Date(inv.date).toLocaleDateString('en-IN')}   Due: ${inv.dueDate||'on receipt'}`, `Customer: ${inv.customerName}${inv.customerMobile?'  ('+inv.customerMobile+')':''}`];
  if(inv.sessionCode) o.push(`Session: ${inv.sessionCode}${inv.groupName?'  Group: '+inv.groupName:''}`);
  o.push(rule); const L=invoiceLines(inv);
  ['gaming','accompany','overtime','food','other'].forEach(b=>{ const ls=L.filter(x=>x.bucket===b); if(!ls.length) return; o.push(BUCKET_TITLE[b].replace(/^\S+\s/,'')); ls.forEach(x=>row(x.text,fmt(x.amount)).forEach(r=>o.push(r))); o.push(''); });
  o.push(rule); [['Subtotal',fmt(inv.subtotal)], ...(inv.discount?[['Discount (gaming only)','-'+fmt(inv.discount)]]:[]), ...invBenefitRows(inv), ...(inv.tax?[[inv.taxLabel||'Tax',fmt(inv.tax)]]:[]), ['TOTAL',fmt(inv.grandTotal)]].forEach(([a,b])=>row(a,b).forEach(r=>o.push(r)));
  if(inv.payments){ (inv.payments||[]).forEach(p=>row('Paid - '+p.method+(p.amount<0?' (refund)':''),fmt(p.amount)).forEach(r=>o.push(r))); row('Balance due',fmt(Math.max(0,invoiceBalance(inv)))).forEach(r=>o.push(r)); }

}

async function confirmCreditRefund(id){

/* ============ Admin: invoice management & deletion ============ */
/* Deleting an invoice is a SOFT delete by default: a complete copy moves to the 'deletedInvoices' store (restorable) and every
   linked record is adjusted consistently (account balances, customer totals, stock, the gaming session, daily totals).
   Every delete / restore / permanent delete is written to the 'auditLog' store, which is never removed. All permission checks
   live in the core functions below (admAuthorize), not only in the buttons that call them. */
async function dbAllFresh(store){ const f=fb(); const snap=await f.getDocs(f.collection(f.db, store)); return snap.docs.map(d=>d.data()); }   // whole collection, not just the 120-day window
async function admAuthorize(pin){
  if(!isAdmin()) throw new Error('Only an administrator can delete or restore invoices. Switch to Admin mode in Settings → Staff Permissions.');
  const st = (await dbGet('settings','main')) || state.settings || {};
  if(st.adminPinHash && (await hashPin(String(pin||'').trim()))!==st.adminPinHash) throw new Error('Wrong Admin PIN.');
}
function invPayTotals(inv){   // net money per payment method (refunds are negative)
  if(!inv.payments){ return PAY_TO_ACCOUNT[inv.paymentMethod] && inv.grandTotal>0 ? [{ method:inv.paymentMethod, amount:inv.grandTotal }] : []; }
  const m={}; inv.payments.forEach(p=>{ m[p.method]=(m[p.method]||0)+(Number(p.amount)||0); });
  return Object.entries(m).filter(([k,v])=>v!==0).map(([method,amount])=>({ method, amount }));
}
async function admAdjustDaily(inv, sign){   // incremental, so invoices older than the 120-day window are handled correctly too
  const date = dateKey(inv.date); const r = (await dbGet('dailyRecords', date)) || { date, sales:0, expenses:0, gamingRev:0, foodRev:0, invoiceCount:0, expenseCount:0 };
  r.sales = (r.sales||0) + sign*inv.grandTotal;
  r.gamingRev = (r.gamingRev||0) + sign*((inv.gamingAmount||0)+(inv.accompanyAmount||0)+(inv.overtimeAmount||0));
  r.foodRev = (r.foodRev||0) + sign*(inv.foodAmount||0);
  r.invoiceCount = Math.max(0,(r.invoiceCount||0)+sign); r.net = r.sales-(r.expenses||0); r.updatedAt = Date.now();
  await dbPut('dailyRecords', r);
}
async function admAdjustCustomer(inv, sign){
  const mob = await invMobile(inv); if(!mob) return false;
  const c = await dbGet('customers', mob); if(!c) return false;
  const gl = (inv.lines||[]).filter(l=>l.kind==='gaming'); const g = (inv.gamingAmount||0)+(inv.accompanyAmount||0)+(inv.overtimeAmount||0);
  c.visits = Math.max(0,(c.visits||0)+sign); c.gamingSessions = Math.max(0,(c.gamingSessions||0)+sign*gl.length);
  c.gamingHours = Math.max(0,(c.gamingHours||0)+sign*(inv.durationMins||0)/60); c.gamingSpend = Math.max(0,(c.gamingSpend||0)+sign*g);
  c.foodSpend = Math.max(0,(c.foodSpend||0)+sign*(inv.foodAmount||0)); c.totalSpend = Math.max(0,(c.totalSpend||0)+sign*inv.grandTotal);
  c.invoiceIds = (c.invoiceIds||[]).filter(x=>x!==inv.id); if(sign>0) c.invoiceIds.push(inv.id);
  await dbPut('customers', c); return true;
}
async function admAudit(action, inv, extra){
  try{ await createRecord('auditLog', Object.assign({ ts:Date.now(), action, invoiceId:inv.id, number:inv.number, amount:inv.grandTotal, customerName:inv.customerName||'', by:isAdmin()?'Admin':'Staff' }, extra||{})); }
  catch(e){ console.error('audit log failed', e); }
}

/* Soft delete. Options: reason, reverseAccounts, sessionMode ('reopen' | 'cancel'), pin. */
async function deleteInvoiceCore(id, o){
  o = o||{}; await admAuthorize(o.pin);
  const inv = await getInvoiceAny(id); if(!inv) throw new Error('Invoice not found — it may already have been deleted.');
  const paid = invoicePaid(inv); const reason = (o.reason||'').trim() || 'Deleted by admin';
  const rec = { id:inv.id, number:inv.number, amount:inv.grandTotal, paidAtDelete:paid, customerName:inv.customerName||'', customerMobile:inv.customerMobile||'', invoiceDate:inv.date, deletedAt:Date.now(), deletedBy:'Admin', reason, actions:{ accountsReversed:[], customerAdjusted:false, session:null }, warnings:[], invoice:stripArchive(inv), fromArchive:!!inv.archived, customerId:inv.customerId||'' };
  await dbPut('deletedInvoices', rec);   // archive FIRST — if this fails nothing else has been touched
  const actions = rec.actions, warnings = rec.warnings;   // dbPut deep-copies nested objects onto rec, so track changes on THESE
  const step = async(label, fn)=>{ try{ await fn(); }catch(e){ console.error('delete step failed:', label, e); warnings.push(label+': '+(e&&e.message?e.message:e)); } };
  if(o.reverseAccounts!==false) await step('account balances', async()=>{ for(const p of invPayTotals(inv)){ if(p.amount>0) await debitAccount(p.method, p.amount); else await creditAccount(p.method, -p.amount); actions.accountsReversed.push(p); } });
  await step('customer totals', async()=>{ actions.customerAdjusted = await admAdjustCustomer(inv, -1); });
  await step('gaming session', async()=>{
    if(!inv.sessionId) return; const s = await dbGet('bsessions', inv.sessionId); if(!s || s.invoiceId!==inv.id) return;
    const mode = o.sessionMode==='cancel' ? 'cancel' : o.sessionMode==='delete' ? 'delete' : 'reopen';
    if(mode==='delete'){ actions.session = await deleteSessionCascade(inv, s); return; }
    await dbUpdate('bsessions', inv.sessionId, d=>{
      d.invoiceId = null; d.deletedInvoiceNumber = inv.number; d.updatedAt = Date.now(); delete d.invoiceNumber; delete d.finalizedAt;
      if(mode==='reopen'){ d.status = 'ready'; } else { d.status = 'cancelled'; d.cancelReason = `Invoice ${inv.number} deleted by Admin`; d.cancelledAt = Date.now(); }
      return true; });
    updateLiveCache(await dbGet('bsessions', inv.sessionId)); actions.session = { id:s.id, mode, prevStatus:s.status };
  });
  await step('loyalty & membership', async()=>{ actions.benefits = await benefitsReverse(inv); });
  await step('daily totals', async()=>{ await admAdjustDaily(inv, -1); });
  await dbDel('invoices', id); if(inv.archived) await dbDel('archivedInvoices', id);
  const dled = await ledgerPost({ type:'invoice_delete', customerId:inv.customerId||'', mobile:inv.customerMobile||'', invoiceId:inv.id, invoiceNumber:inv.number, amount:inv.grandTotal, description:`Invoice ${inv.number} deleted`, reason, meta:invSnapshot(inv) });
  for(const p of actions.accountsReversed||[]) await ledgerPost({ type:'invoice_payment_reversal', customerId:inv.customerId||'', mobile:inv.customerMobile||'', invoiceId:inv.id, invoiceNumber:inv.number, amount:-p.amount, originalRef:dled.id, description:`Payment by ${p.method} reversed (invoice deleted)`, reason, meta:{ method:p.method } });
  await dbPut('deletedInvoices', rec);   // final copy including what was adjusted
  await admAudit('invoice_delete', inv, { reason, paid, actions, warnings });
  return rec;
}
/* Restore a soft-deleted invoice with its original number, undoing the adjustments made when it was deleted. */
async function restoreInvoiceCore(id, o){
  o = o||{}; await admAuthorize(o.pin);
  const rec = await dbGet('deletedInvoices', id); if(!rec) throw new Error('Deleted invoice not found.');
  const inv = rec.invoice; const a = rec.actions||{};
  if(await dbGet('invoices', id)) throw new Error(`${inv.number} already exists.`);
  let sess = null;
  if(inv.sessionId){
    sess = await dbGet('bsessions', inv.sessionId);
    if(sess && sess.invoiceId && sess.invoiceId!==inv.id) throw new Error(`The gaming session ${sesCode(sess)} has since been billed on another invoice, so ${inv.number} can't be restored.`);
    if(sess && ['active','hold'].includes(sess.status)) throw new Error(`The gaming session ${sesCode(sess)} was reopened and is in use. Finish or cancel it first, then restore.`);
  }
  await dbPut('invoices', inv);
  const warnings = []; const step = async(label, fn)=>{ try{ await fn(); }catch(e){ console.error('restore step failed:', label, e); warnings.push(label+': '+(e&&e.message?e.message:e)); } };
  await step('account balances', async()=>{ for(const p of (a.accountsReversed||[])){ if(p.amount>0) await creditAccount(p.method, p.amount); else await debitAccount(p.method, -p.amount); } });
  await step('customer totals', async()=>{ if(a.customerAdjusted) await admAdjustCustomer(inv, +1); });
  await step('gaming session', async()=>{
    if(!sess) return;
    await dbUpdate('bsessions', inv.sessionId, d=>{ d.invoiceId = inv.id; d.invoiceNumber = inv.number; d.finalizedAt = inv.date; d.status = invoiceBalance(inv)<=0 ? 'paid' : 'finalized'; delete d.deletedInvoiceNumber; delete d.cancelReason; delete d.cancelledAt; d.updatedAt = Date.now(); return true; });
    updateLiveCache(await dbGet('bsessions', inv.sessionId));
  });
  await step('loyalty & membership', async()=>{ if(a.benefits) await benefitsReapply(inv, a.benefits); });
  await step('daily totals', async()=>{ await admAdjustDaily(inv, +1); });
  await dbDel('deletedInvoices', id);
  await ledgerPost({ type:'invoice_restore', customerId:inv.customerId||'', mobile:inv.customerMobile||'', invoiceId:inv.id, invoiceNumber:inv.number, amount:inv.grandTotal, description:`Invoice ${inv.number} restored`, reason:'Restored by admin' });
  await admAudit('invoice_restore', inv, { warnings });
  return inv;
}
/* Permanent deletion — only from the Deleted tab. Removes the archived copy; the audit log entry stays. */
async function purgeInvoiceCore(id, o){
  o = o||{}; await admAuthorize(o.pin);
  const rec = await dbGet('deletedInvoices', id); if(!rec) throw new Error('Deleted invoice not found.');
  const inv = rec.invoice||{};
  await ledgerPost({ type:'invoice_purge', customerId:rec.customerId||inv.customerId||'', mobile:rec.customerMobile||'', invoiceId:rec.id, invoiceNumber:rec.number, amount:rec.amount, description:`Invoice ${rec.number} permanently removed from the app — essential record kept here`, reason:(o.reason||rec.reason||''), meta:invSnapshot(Object.assign({ grandTotal:rec.amount, number:rec.number }, inv)) });   // the money history stays in the ledger
  await dbDel('deletedInvoices', id);
  await admAudit('invoice_purge', { id:rec.id, number:rec.number, grandTotal:rec.amount, customerName:rec.customerName }, { reason:(o.reason||rec.reason||''), paid:rec.paidAtDelete, lines:(inv.lines||[]).length, invoiceDate:rec.invoiceDate, deletedAt:rec.deletedAt });
}

function admMatch(i){
  const A = state.adm, q = A.q.trim().toLowerCase();

  if(A.method!=='all'){
    const pays = (i.payments||[]).filter(p=>p.amount>0);
    if(A.method==='none'){ if(pays.length || (!i.payments && i.paymentMethod && i.paymentMethod!=='Unpaid')) return false; }
    else if(!(pays.some(p=>p.method===A.method) || (!i.payments && String(i.paymentMethod||'').includes(A.method)))) return false;
  }
  return true;
}
function admFilter(){

const DEFAULT_LOYALTY = { enabled:true, spend:10, points:1, rupeePerPoint:1, minRedeem:0, maxRedeemPerInvoice:0, expiryDays:0 };
const DEFAULT_PLANS = [

function loyaltyCfg(){ return Object.assign({}, DEFAULT_LOYALTY, (state.settings||{}).loyalty||{}); }
