/* The ONE place an invoice is created. Used by checkout and by demo data. */
async function finalizeSessionCore(f, opts){
  opts = opts||{};
  const s = await dbGet('bsessions', f.sid);
  if(!s) throw new Error('Session not found.');
  if(!isOpenStatus(s.status) || s.invoiceId) throw new Error(`This session is already ${STATUS_LABEL[s.status]||'billed'} — it can't be invoiced twice.`);
  if(!s.lines.length) throw new Error('Add at least one line before finalizing.');
  const settings = (await dbGet('settings','main')) || state.settings;
  const mobRaw=(f.mobile||'').trim(); const mob = mobRaw ? normMobile(mobRaw) : '';
  if(mobRaw && !mob) throw new Error('Enter a valid 10-digit Indian mobile number, or leave it blank.');
  const name=(f.name||'').trim();
  const date = opts.date || Date.now();
  const t = billTotals(s.lines, f.discountPct, settings, finOf(s));
  const payments = (f.payments||[]).map(p=>({ method:p.method, amount:Math.round(Number(p.amount)||0), date })).filter(p=>p.amount>0);
  const paid = payments.reduce((a,p)=>a+p.amount,0);
  if(paid>t.grand) throw new Error(`Payments (${fmt(paid)}) are more than the invoice total (${fmt(t.grand)}).`);
  const n = await dbIncrement('settings','main','nextInvoiceNo');
  state.settings.nextInvoiceNo = n+1;
  const number = (settings.invoicePrefix||'LVL-INV-') + String(n).padStart(6,'0');
  const invDate = f.date || ymd(date);
  const lines = s.lines.map(l=>JSON.parse(JSON.stringify(l)));
  lines.forEach(l=>stopLine(l));   // timers are just a record: closing them keeps the timestamps and never changes minutes or price
  const gl = lines.filter(l=>l.kind==='gaming');
  const inv = { number, date, invoiceDate:invDate, dueTerms:f.terms||'Due on receipt', dueDate:addDaysStr(invDate, DUE_TERMS[f.terms]||0),
    orderNo:f.orderNo||'', salesperson:f.salesperson||'', subject:f.subject||'', notes:f.notes||'',
    sessionId:s.id, sessionCode:sesCode(s), groupName:s.groupName||'', customerName:name||'Walk-in Customer', customerMobile:mob,
    lines, gamingAmount:t.gaming, accompanyAmount:t.accompany, overtimeAmount:t.overtime, foodAmount:t.food, otherAmount:t.other,
    subtotal:t.subtotal, discountPercent:t.discountPct, discount:t.discount, tax:t.tax, adjustmentAmt:t.adjustment, tcs:t.tcs, tds:t.tds, taxLabel:settings.taxEnabled?`${settings.taxLabel||'Tax'} ${settings.taxRate}%`:'',
    grandTotal:t.grand, payments, adjustments:[], paymentMethod:payments.map(p=>p.method).join(' + ')||'Unpaid',
    durationMins:gl.reduce((a,l)=>a+l.minutes,0), status:'finalized' };
  inv.status = invoiceBalance(inv)<=0 ? 'paid' : 'finalized';
  const fresh = await dbGet('bsessions', f.sid);
  if(!fresh || fresh.updatedAt!==s.updatedAt) throw new Error('This session was changed (possibly on another device) while you were checking out. Go back, review the bill, and finalize again.');
  await createRecord('invoices', inv);
  // Mark the session billed immediately so a retry/double-tap can never create a second invoice.
  await mutateSession(f.sid, d=>{ if(d.invoiceId) throw new Error('This session already has an invoice.'); d.lines.forEach(l=>stopLine(l)); d.status=inv.status; d.invoiceId=inv.id; d.invoiceNumber=number; d.finalizedAt=date; return true; });
  const soft = async (fn)=>{ try{ await fn(); }catch(e){ console.error('post-invoice step failed', e); } };
  await soft(async()=>{
    if(!mob) return;
    const nowIso = new Date(date).toISOString();
    let c = await dbGet('customers', mob);
    if(!c) c = { mobile:mob, name:name||'Walk-in Customer', email:'', address:'', joined:nowIso, visits:0, gamingSessions:0, gamingHours:0, gamingSpend:0, foodSpend:0, totalSpend:0, lastVisit:nowIso, invoiceIds:[] };
    if(name) c.name=name;
    c.visits+=1; c.gamingSessions+=gl.length; c.gamingHours+=inv.durationMins/60;
    c.gamingSpend+=t.gaming+t.accompany+t.overtime; c.foodSpend+=t.food; c.totalSpend+=t.grand; c.lastVisit=nowIso; c.invoiceIds.push(inv.id);
    await dbPut('customers', c);
  });
  await soft(async()=>{ for(const p of payments) await creditAccount(p.method, p.amount); });
  await soft(async()=>{ await updateDailyRecord(dateKey(date)); });
  return inv;
}

/* ============ Invoices ============ */
function invoicePaid(inv){ if(!inv.payments) return inv.grandTotal; return inv.payments.reduce((s,p)=>s+p.amount,0); }
function invoiceCredits(inv){ return (inv.adjustments||[]).filter(a=>a.type==='credit').reduce((s,a)=>s+a.amount,0); }
function invoiceBalance(inv){ return Math.round(inv.grandTotal - invoiceCredits(inv) - invoicePaid(inv)); }
function invoiceStatusPill(inv){ const b=invoiceBalance(inv); return b<=0 ? '<span class="pill green">Paid</span>' : '<span class="pill amber">Due '+fmt(b)+'</span>'; }
function invoiceSegments(inv){   // gaming segments, for reports — understands every invoice shape ever produced
  if(inv.lines) return inv.lines.filter(l=>l.kind==='gaming').map(l=>({ console:l.setupLabel||l.console||l.name, tv:l.tv||'', players:l.players, durationMins:l.minutes, charge:l.total }));
  if(inv.segments && inv.segments.length) return inv.segments;
  if(inv.console) return [{ console:inv.console, tv:inv.tv, players:inv.players, durationMins:inv.durationMins, charge:inv.gamingAmount }];
  return [];
}
function invoiceFoodItems(inv){
  if(inv.lines) return inv.lines.filter(l=>l.bucket==='food').map(l=>({ name:l.name, qty:l.qty }));
  return (inv.items||[]).map(i=>({ name:i.name, qty:i.qty }));
}
function lineText(l){
  if(l.kind==='gaming') return `${gamingTitle(l)} · ${fmtDur(l.minutes)}${l.physicalName?' · '+l.physicalName:''}`;
  if(l.kind==='accompany') return `Accompanying × ${l.qty} · ${fmtDur(l.minutes)}${l.free?' (free)':''}`;
  if(l.kind==='overtime') return `${l.name} × ${l.qty} ${l.unit||''}`.trim();
  return `${l.name} × ${l.qty}${l.included&&l.included.length?' ('+l.included.join(' + ')+')':''}`;
}
function invoiceLines(inv){   // normalized [{bucket,text,amount}]
  if(inv.lines) return inv.lines.map(l=>({ bucket:l.bucket, text:lineText(l)+(l.discountPct?` (-${l.discountPct}%)`:''), amount:l.total }));
  const out = invoiceSegments(inv).map(sg=>({ bucket:'gaming', text:`${sg.console} ${sg.tv||''} · ${sg.players}P · ${fmtDur(sg.durationMins)}`.replace('  ',' '), amount:sg.charge }));
  (inv.items||[]).forEach(i=>out.push({ bucket:'food', text:`${i.name} × ${i.qty}`, amount:i.price*i.qty }));
  if(inv.accompanyAmount) out.push({ bucket:'accompany', text:`Accompanying × ${inv.accompanyCount||''}`, amount:inv.accompanyAmount });
  return out;
}
const BUCKET_TITLE = { gaming:'🎮 GAMING', accompany:'👥 ACCOMPANYING PERSONS', overtime:'⏱ OVERTIME', food:'🍟 FOOD & BEVERAGES', other:'🛍 OTHER' };
function invoiceText(inv){
  const st = state.settings; const L = invoiceLines(inv);
  const out = [`🎮 ${st.businessName}`, '', `Invoice: ${inv.number}`, `Date: ${new Date(inv.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}`, `Customer: ${inv.customerName}${inv.customerMobile?' ('+inv.customerMobile+')':''}`];
  ['gaming','accompany','overtime','food','other'].forEach(b=>{ const ls=L.filter(x=>x.bucket===b); if(!ls.length) return; out.push('', BUCKET_TITLE[b]); ls.forEach(x=>out.push(`${x.text} — ${fmt(x.amount)}`)); });
  out.push('', `Subtotal: ${fmt(inv.subtotal)}`);
  if(inv.discount) out.push(`Discount${inv.discountPercent?' ('+inv.discountPercent+'% on gaming)':''}: -${fmt(inv.discount)}`);
  if(inv.tax) out.push(`${inv.taxLabel||'Tax'}: ${fmt(inv.tax)}`);
  if(inv.adjustmentAmt) out.push(`Adjustment: ${fmt(inv.adjustmentAmt)}`);
  if(inv.tcs) out.push(`TCS: ${fmt(inv.tcs)}`);
  if(inv.tds) out.push(`TDS: -${fmt(inv.tds)}`);
  out.push(`TOTAL: ${fmt(inv.grandTotal)}`);
  const pays = (inv.payments||[]).filter(p=>p.amount>0).map(p=>`${p.method} ${fmt(p.amount)}`);
  if(inv.payments) out.push(`Paid: ${pays.join(' + ')||fmt(0)}`, `Balance due: ${fmt(Math.max(0,invoiceBalance(inv)))}`); else out.push(`Payment: ${inv.paymentMethod}`);
  out.push('', st.footer||''); return out.join('\n');
}
function pdfSafe(t){ return String(t).replace(/₹/g,'Rs.').replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[·×]/g,m=>m==='×'?'x':'-').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').replace(/([\\()])/g,'\\$1'); }
function buildPdf(lines){
  const per=54, pages=[]; for(let i=0;i<lines.length;i+=per) pages.push(lines.slice(i,i+per)); if(!pages.length) pages.push(['']);
  const objs=[]; objs[1]='<< /Type /Catalog /Pages 2 0 R >>'; objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>';
  let n=4; const kids=[];
  pages.forEach(pg=>{ const pid=n++, cid=n++; kids.push(pid+' 0 R');
    let st='BT /F1 10 Tf 40 802 Td 14 TL\n'; pg.forEach(l=>{ st+='('+pdfSafe(l)+') Tj T*\n'; }); st+='ET';
    objs[pid]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${cid} 0 R >>`;
    objs[cid]=`<< /Length ${st.length} >>\nstream\n${st}\nendstream`; });
  objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n'; const off=[];
  for(let i=1;i<n;i++){ off[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
  const x=out.length; out+=`xref\n0 ${n}\n0000000000 65535 f \n`; for(let i=1;i<n;i++) out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out],{type:'application/pdf'});
}
function invoicePdfLines(inv){
  const st=state.settings, W=62; const row=(a,b)=>{ const r=String(b); const room=W-r.length-1; const out=[]; let t=String(a);
    do{ const chunk=t.slice(0,room); t=t.slice(room); out.push(out.length? '  '+chunk : chunk.padEnd(room)+' '+r); }while(t.length); if(out.length>1){ const first=out.shift(); out.unshift(first); } return out; };
  const rule='-'.repeat(W); const o=[st.businessName, st.address||'', (st.phone?'Phone: '+st.phone:'')+(st.gstin?'  GSTIN: '+st.gstin:''), rule,
    `INVOICE ${inv.number}`, `Date: ${new Date(inv.date).toLocaleDateString('en-IN')}   Due: ${inv.dueDate||'on receipt'}`, `Customer: ${inv.customerName}${inv.customerMobile?'  ('+inv.customerMobile+')':''}`];
  if(inv.sessionCode) o.push(`Session: ${inv.sessionCode}${inv.groupName?'  Group: '+inv.groupName:''}`);
  o.push(rule); const L=invoiceLines(inv);
  ['gaming','accompany','overtime','food','other'].forEach(b=>{ const ls=L.filter(x=>x.bucket===b); if(!ls.length) return; o.push(BUCKET_TITLE[b].replace(/^\S+\s/,'')); ls.forEach(x=>row(x.text,fmt(x.amount)).forEach(r=>o.push(r))); o.push(''); });
  o.push(rule); [['Subtotal',fmt(inv.subtotal)], ...(inv.discount?[['Discount (gaming only)','-'+fmt(inv.discount)]]:[]), ...(inv.tax?[[inv.taxLabel||'Tax',fmt(inv.tax)]]:[]), ['TOTAL',fmt(inv.grandTotal)]].forEach(([a,b])=>row(a,b).forEach(r=>o.push(r)));

}

/* ============ Admin: invoice management & deletion ============ */
/* Deleting an invoice is a SOFT delete by default: a complete copy moves to the 'deletedInvoices' store (restorable) and every
   linked record is adjusted consistently (account balances, customer totals, stock, the gaming session, daily totals).
   Every delete / restore / permanent delete is written to the 'auditLog' store, which is never removed. All permission checks
   live in the core functions below (admAuthorize), not only in the buttons that call them. */
async function dbAllFresh(store){ const f=fb(); const snap=await f.getDocs(f.collection(f.db, store)); return snap.docs.map(d=>d.data()); }   // whole collection, not just the 120-day window
async function admAuthorize(pin){
  if(!isAdmin()) throw new Error('Only an administrator can delete or restore invoices. Switch to Admin mode in Settings → Staff Permissions.');
  const st = (await dbGet('settings','main')) || state.settings || {};
  if(st.adminPinHash && (await hashPin(String(pin||'').trim()))!==st.adminPinHash) throw new Error('Wrong Admin PIN.');
}
function invPayTotals(inv){   // net money per payment method (refunds are negative)
  if(!inv.payments){ return PAY_TO_ACCOUNT[inv.paymentMethod] && inv.grandTotal>0 ? [{ method:inv.paymentMethod, amount:inv.grandTotal }] : []; }
  const m={}; inv.payments.forEach(p=>{ m[p.method]=(m[p.method]||0)+(Number(p.amount)||0); });
  return Object.entries(m).filter(([k,v])=>v!==0).map(([method,amount])=>({ method, amount }));
}
async function admAdjustDaily(inv, sign){   // incremental, so invoices older than the 120-day window are handled correctly too
  const date = dateKey(inv.date); const r = (await dbGet('dailyRecords', date)) || { date, sales:0, expenses:0, gamingRev:0, foodRev:0, invoiceCount:0, expenseCount:0 };
  r.sales = (r.sales||0) + sign*inv.grandTotal;
  r.gamingRev = (r.gamingRev||0) + sign*((inv.gamingAmount||0)+(inv.accompanyAmount||0)+(inv.overtimeAmount||0));
  r.foodRev = (r.foodRev||0) + sign*(inv.foodAmount||0);
  r.invoiceCount = Math.max(0,(r.invoiceCount||0)+sign); r.net = r.sales-(r.expenses||0); r.updatedAt = Date.now();
  await dbPut('dailyRecords', r);
}
async function admAdjustCustomer(inv, sign){
  const mob = inv.customerMobile; if(!mob) return false;
  const c = await dbGet('customers', mob); if(!c) return false;
  const gl = (inv.lines||[]).filter(l=>l.kind==='gaming'); const g = (inv.gamingAmount||0)+(inv.accompanyAmount||0)+(inv.overtimeAmount||0);
  c.visits = Math.max(0,(c.visits||0)+sign); c.gamingSessions = Math.max(0,(c.gamingSessions||0)+sign*gl.length);
  c.gamingHours = Math.max(0,(c.gamingHours||0)+sign*(inv.durationMins||0)/60); c.gamingSpend = Math.max(0,(c.gamingSpend||0)+sign*g);
  c.foodSpend = Math.max(0,(c.foodSpend||0)+sign*(inv.foodAmount||0)); c.totalSpend = Math.max(0,(c.totalSpend||0)+sign*inv.grandTotal);
  c.invoiceIds = (c.invoiceIds||[]).filter(x=>x!==inv.id); if(sign>0) c.invoiceIds.push(inv.id);
  await dbPut('customers', c); return true;
}
async function admAudit(action, inv, extra){
  try{ await createRecord('auditLog', Object.assign({ ts:Date.now(), action, invoiceId:inv.id, number:inv.number, amount:inv.grandTotal, customerName:inv.customerName||'', by:isAdmin()?'Admin':'Staff' }, extra||{})); }
  catch(e){ console.error('audit log failed', e); }
}

/* Soft delete. Options: reason, reverseAccounts, sessionMode ('reopen' | 'cancel'), pin. */
async function deleteInvoiceCore(id, o){
  o = o||{}; await admAuthorize(o.pin);
  const inv = await dbGet('invoices', id); if(!inv) throw new Error('Invoice not found — it may already have been deleted.');
  const paid = invoicePaid(inv); const reason = (o.reason||'').trim();
  if(paid>0 && !reason) throw new Error(`${inv.number} has payments recorded. Enter a reason for deleting it.`);
  const rec = { id:inv.id, number:inv.number, amount:inv.grandTotal, paidAtDelete:paid, customerName:inv.customerName||'', customerMobile:inv.customerMobile||'', invoiceDate:inv.date, deletedAt:Date.now(), deletedBy:'Admin', reason, actions:{ accountsReversed:[], customerAdjusted:false, session:null }, warnings:[], invoice:inv };
  await dbPut('deletedInvoices', rec);   // archive FIRST — if this fails nothing else has been touched
  const actions = rec.actions, warnings = rec.warnings;   // dbPut deep-copies nested objects onto rec, so track changes on THESE
  const step = async(label, fn)=>{ try{ await fn(); }catch(e){ console.error('delete step failed:', label, e); warnings.push(label+': '+(e&&e.message?e.message:e)); } };
  if(o.reverseAccounts!==false) await step('account balances', async()=>{ for(const p of invPayTotals(inv)){ if(p.amount>0) await debitAccount(p.method, p.amount); else await creditAccount(p.method, -p.amount); actions.accountsReversed.push(p); } });
  await step('customer totals', async()=>{ actions.customerAdjusted = await admAdjustCustomer(inv, -1); });
  await step('gaming session', async()=>{
    if(!inv.sessionId) return; const s = await dbGet('bsessions', inv.sessionId); if(!s || s.invoiceId!==inv.id) return;
    const mode = o.sessionMode==='cancel' ? 'cancel' : 'reopen';
    await dbUpdate('bsessions', inv.sessionId, d=>{
      d.invoiceId = null; d.deletedInvoiceNumber = inv.number; d.updatedAt = Date.now(); delete d.invoiceNumber; delete d.finalizedAt;
      if(mode==='reopen'){ d.status = 'ready'; } else { d.status = 'cancelled'; d.cancelReason = `Invoice ${inv.number} deleted by Admin`; d.cancelledAt = Date.now(); }
      return true; });
    updateLiveCache(await dbGet('bsessions', inv.sessionId)); actions.session = { id:s.id, mode, prevStatus:s.status };
  });
  await step('daily totals', async()=>{ await admAdjustDaily(inv, -1); });
  await dbDel('invoices', id);
  await dbPut('deletedInvoices', rec);   // final copy including what was adjusted
  await admAudit('invoice_delete', inv, { reason, paid, actions, warnings });
  return rec;
}
/* Restore a soft-deleted invoice with its original number, undoing the adjustments made when it was deleted. */
async function restoreInvoiceCore(id, o){
  o = o||{}; await admAuthorize(o.pin);
  const rec = await dbGet('deletedInvoices', id); if(!rec) throw new Error('Deleted invoice not found.');
  const inv = rec.invoice; const a = rec.actions||{};
  if(await dbGet('invoices', id)) throw new Error(`${inv.number} already exists.`);
  let sess = null;
  if(inv.sessionId){
    sess = await dbGet('bsessions', inv.sessionId);
    if(sess && sess.invoiceId && sess.invoiceId!==inv.id) throw new Error(`The gaming session ${sesCode(sess)} has since been billed on another invoice, so ${inv.number} can't be restored.`);
    if(sess && ['active','hold'].includes(sess.status)) throw new Error(`The gaming session ${sesCode(sess)} was reopened and is in use. Finish or cancel it first, then restore.`);
  }
  await dbPut('invoices', inv);
  const warnings = []; const step = async(label, fn)=>{ try{ await fn(); }catch(e){ console.error('restore step failed:', label, e); warnings.push(label+': '+(e&&e.message?e.message:e)); } };
  await step('account balances', async()=>{ for(const p of (a.accountsReversed||[])){ if(p.amount>0) await creditAccount(p.method, p.amount); else await debitAccount(p.method, -p.amount); } });
  await step('customer totals', async()=>{ if(a.customerAdjusted) await admAdjustCustomer(inv, +1); });
  await step('gaming session', async()=>{
    if(!sess) return;
    await dbUpdate('bsessions', inv.sessionId, d=>{ d.invoiceId = inv.id; d.invoiceNumber = inv.number; d.finalizedAt = inv.date; d.status = invoiceBalance(inv)<=0 ? 'paid' : 'finalized'; delete d.deletedInvoiceNumber; delete d.cancelReason; delete d.cancelledAt; d.updatedAt = Date.now(); return true; });
    updateLiveCache(await dbGet('bsessions', inv.sessionId));
  });
  await step('daily totals', async()=>{ await admAdjustDaily(inv, +1); });
  await dbDel('deletedInvoices', id);
  await admAudit('invoice_restore', inv, { warnings });
  return inv;
}
/* Permanent deletion — only from the Deleted tab. Removes the archived copy; the audit log entry stays. */
async function purgeInvoiceCore(id, o){
  o = o||{}; await admAuthorize(o.pin);
  const rec = await dbGet('deletedInvoices', id); if(!rec) throw new Error('Deleted invoice not found.');
  await dbDel('deletedInvoices', id);
  const inv = rec.invoice||{};
  await admAudit('invoice_purge', { id:rec.id, number:rec.number, grandTotal:rec.amount, customerName:rec.customerName }, { reason:(o.reason||rec.reason||''), paid:rec.paidAtDelete, lines:(inv.lines||[]).length, invoiceDate:rec.invoiceDate, deletedAt:rec.deletedAt });
}

function admMatch(i){

async function adminDeleteModal(ids){
  if(!isAdmin()){ tell('Only an administrator can delete invoices.'); return; }
  ids = ids.filter(x=>x!==undefined && x!==null); if(!ids.length) return;
  const invs = []; for(const id of ids){ const i = await dbGet('invoices', id); if(i) invs.push(i); }
  if(!invs.length){ tell('Those invoices no longer exist.'); return; }
  const st = (await dbGet('settings','main')) || state.settings || {};
  const total = invs.reduce((a,i)=>a+i.grandTotal,0), paid = invs.reduce((a,i)=>a+Math.max(0,invoicePaid(i)),0);

async function confirmAdminDelete(){
  const g = id=>document.getElementById(id), ids = window.__admDelIds||[];
  const o = { pin:g('adPin')?g('adPin').value:'', reason:g('adReason').value, reverseAccounts:g('adAcc').checked, sessionMode:g('adSess').value, permanent:g('adPerm').checked };
  if(window.__admNeedType || o.permanent){ if(!g('adType') || g('adType').value.trim().toUpperCase()!=='DELETE'){ tell('Type DELETE in the box to confirm.'); return; } }
  if(window.__admNeedReason && !o.reason.trim()){ tell('Enter a reason — these invoices have payments recorded, and the reason is kept in the audit log.'); return; }
  try{ await admAuthorize(o.pin); }catch(e){ tell(e.message); return; }
  const btn = g('adGo'); if(btn){ btn.disabled = true; btn.textContent = 'Deleting…'; }
  let done = 0; const fails = [];
  for(const id of ids){
    try{ await deleteInvoiceCore(id, o); if(o.permanent) await purgeInvoiceCore(id, { pin:o.pin, reason:o.reason }); done++; }
    catch(e){ fails.push(e && e.message ? e.message : String(e)); }
  }
  closeModal(); state.adm.sel = {}; __admStale = true;
  if(state.screen==='invoiceView' && done) await goBack('invoices'); else await render();
  if(done) showToast(`${done} invoice${done>1?'s':''} ${o.permanent?'permanently deleted':'deleted'}`);
  if(fails.length) tell(fails.join('\n'));
}

async function creditAccount(payMethod, amount){
  const accName = PAY_TO_ACCOUNT[payMethod] || 'Other';
  const acc = (await dbGet('accounts', accName)) || {name:accName, balance:0};
  acc.balance += amount; await dbPut('accounts', acc);
}
async function debitAccount(payMethod, amount){
  const accName = PAY_TO_ACCOUNT[payMethod] || 'Other';
  const acc = (await dbGet('accounts', accName)) || {name:accName, balance:0};
  acc.balance -= amount; await dbPut('accounts', acc);
}

  ${logged.length? logged.map(e=>`<div class="list-item"><span>${e.category}<br><span class="muted">${e.desc||''} · ${new Date(e.date).toLocaleDateString('en-IN')}</span></span><span>${fmt(e.amount)}</span></div>`).join('') : '<div class="empty">No expenses recorded.</div>'}
  `;
}
async function addExpense(){
  const category = document.getElementById('expCat').value;
  const desc = document.getElementById('expDesc').value;
  const amount = Number(document.getElementById('expAmt').value);
  const payMethod = document.getElementById('expPay').value;
  const recurring = document.getElementById('expRecurring').checked;
  if(!amount) return tell('Enter a valid amount.');
  if(recurring){
    const freq = document.getElementById('expFreq').value;
    const next = new Date(); if(freq==='Monthly') next.setMonth(next.getMonth()+1); else next.setDate(next.getDate()+7);
    await dbPut('expenses', { category, desc, amount, frequency:freq, isTemplate:true, nextDue: next.getTime(), date: Date.now() });
  } else {
    await dbPut('expenses', { category, desc, amount, date:Date.now(), payMethod, vendor:(document.getElementById('expVendor')||{value:''}).value.trim(), receipt:(document.getElementById('expReceipt')||{value:''}).value.trim() });
    await debitAccount(payMethod, amount);
    await updateDailyRecord(dateKey(Date.now()));
  }
  render();
}
async function logRecurring(templateId){
  const t = await dbGet('expenses', templateId);
  await dbPut('expenses', { category:t.category, desc:t.desc+' (recurring)', amount:t.amount, date:Date.now(), payMethod:'Cash' });
  await debitAccount('Cash', t.amount);
  const next = new Date(t.nextDue); if(t.frequency==='Monthly') next.setMonth(next.getMonth()+1); else next.setDate(next.getDate()+7);
  t.nextDue = next.getTime(); await dbPut('expenses', t);
  await updateDailyRecord(dateKey(Date.now()));
  render();
}

function lineSvg(B, series, o){   // series:[{name,color,vals}]; handles negatives

function hbars(rows, o){   // rows:[{label,value,color,sub,tip}]

function setupChartTips(){
  const tip = document.createElement('div'); tip.id='chartTip'; tip.hidden=true; document.body.appendChild(tip);
  const show = (el, x, y)=>{ const parts = (el.getAttribute('data-tip')||'').split('|'); tip.innerHTML = '<b>'+esc(parts[0])+'</b>'+parts.slice(1).map(p=>'<div>'+esc(p)+'</div>').join(''); tip.hidden=false;
    const w=tip.offsetWidth, h=tip.offsetHeight; tip.style.left = Math.max(6,Math.min(innerWidth-w-6, x-w/2))+'px'; tip.style.top = Math.max(6, y-h-14)+'px'; };
  const find = e=>e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  document.addEventListener('pointerover', e=>{ if(e.pointerType!=='mouse') return; const el=find(e); if(el) show(el,e.clientX,e.clientY); else tip.hidden=true; });
  document.addEventListener('pointerdown', e=>{ const el=find(e); if(el) show(el,e.clientX,e.clientY); else tip.hidden=true; });
  document.addEventListener('focusin', e=>{ const el=find(e); if(el){ const b=el.getBoundingClientRect(); show(el,b.left+b.width/2,b.top); } });
  window.addEventListener('scroll', ()=>{ tip.hidden=true; }, {passive:true});
}

async function hashPin(p){
  try{ if(window.crypto && crypto.subtle){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lvl:'+p)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  let h=5381; const t='lvl:'+p; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return 'x'+(h>>>0).toString(16);
}

    <div class="muted" style="font-size:11px;margin-top:6px">${s.adminPinHash?'Admin mode needs the PIN.':'No Admin PIN is set — anyone can switch to Admin. Set a PIN below to protect it.'} This is a convenience lock on this device, not bank-grade security.</div></div>

async function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }
async function buildBackup(){
  const data = { __meta:{ app:'LVL Books', format:2, createdAt:Date.now(), counts:{} } };
  for(const store of BACKUP_STORES){
    let rows; try{ rows = await withTimeout(dbAllFresh(store), 8000); }catch(e){ rows = await dbAll(store); }   // full history when reachable, saved copy otherwise
    data[store] = rows; data.__meta.counts[store] = rows.length;
  }
  return data;
}
function backupFileName(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `LVL-Books-Backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; }
async function downloadBackup(){
  try{
    const data = await buildBackup(); const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=backupFileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
    await recordBackupTime(); showToast('Backup file downloaded'); if(state.screen==='backup') render();
  }catch(e){ console.error(e); tell('Backup failed: '+(e && e.message ? e.message : e)); }
}
async function shareBackup(){
  try{
    const data = await buildBackup(); const name = backupFileName(); const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'LVL Books Backup', text:'LVL Books backup'}); await recordBackupTime(); showToast('Backup shared'); if(state.screen==='backup') render(); return; }
      catch(e){ if(e && e.name==='AbortError') return; }   // cancelled: do nothing; anything else: fall back to a download
    }
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
    await recordBackupTime(); showToast('Backup file downloaded'); if(state.screen==='backup') render();
  }catch(e){ console.error(e); tell('Backup failed: '+(e && e.message ? e.message : e)); }
}
async function recordBackupTime(){ await patchSettings({ lastBackupAt: Date.now() }); state.showBackupReminder = false; renderNav(); }
async function maybeAutoBackup(){
  const s = state.settings;
  const TWO_WEEKS = 14*24*60*60*1000;
  state.showBackupReminder = !s.lastBackupAt || (Date.now() - s.lastBackupAt) >= TWO_WEEKS;
}
function dismissBackupReminder(){ state.showBackupReminder = false; renderNav(); render(); }
/* Validate a backup file before anything is touched. Returns { ok, error, data, counts, when }. */
function validateBackup(obj){
  if(!obj || typeof obj!=='object' || Array.isArray(obj)) return { ok:false, error:'This file is not an LVL Books backup.' };
  const counts = {}; let known = 0;
  for(const store of BACKUP_STORES){
    if(obj[store]===undefined) continue;
    if(!Array.isArray(obj[store])) return { ok:false, error:`The “${store}” section of this file is damaged.` };
    const kp = KEYPATH[store] || 'id';
    if(obj[store].some(r=>!r || typeof r!=='object' || r[kp]===undefined || r[kp]===null)) return { ok:false, error:`Some records in “${store}” are damaged (missing ${kp}).` };
    counts[store] = obj[store].length; known++;
  }
  if(!known) return { ok:false, error:'No LVL Books data was found in this file.' };
  return { ok:true, data:obj, counts, when:(obj.__meta && obj.__meta.createdAt) || null };
}
const BACKUP_LABELS = { customers:'Customers', bsessions:'Gaming sessions', invoices:'Invoices', products:'Items', stations:'Gaming setups', expenses:'Expenses', purchases:'Purchases', inventoryTx:'Old stock records (kept, unused)', vendors:'Vendors', employees:'Employees', accounts:'Cash & bank', settings:'Settings' };
async function previewRestore(){
  const box = document.getElementById('restorePreview'), btn = document.getElementById('restoreBtn'); window.__restore = null; btn.disabled = true;
  const file = document.getElementById('restoreFile').files[0]; if(!file){ box.textContent=''; return; }
  try{
    const v = validateBackup(JSON.parse(await file.text()));
    if(!v.ok){ box.innerHTML = `<span style="color:var(--red)">${esc(v.error)}</span>`; return; }
    window.__restore = v; btn.disabled = false;
    box.innerHTML = `<b style="color:var(--green,inherit)">Valid backup</b>${v.when?` · made ${new Date(v.when).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})}`:''}<br>` +
      Object.keys(BACKUP_LABELS).filter(k=>v.counts[k]!==undefined).map(k=>`${BACKUP_LABELS[k]}: ${v.counts[k]}`).join(' · ');
  }catch(e){ box.innerHTML = `<span style="color:var(--red)">Couldn't read this file — it isn't valid backup data.</span>`; }
}
async function doRestore(){
  const v = window.__restore; if(!v){ tell('Choose a valid backup file first.'); return; }
  const summary = Object.keys(BACKUP_LABELS).filter(k=>v.counts[k]!==undefined).map(k=>`${BACKUP_LABELS[k]} ${v.counts[k]}`).join(', ');
  if(!(await askConfirm(`Restore this backup${v.when?' from '+new Date(v.when).toLocaleString('en-IN'):''}?\n\nIt replaces ALL current data with: ${summary}.\n\nTip: download a backup of the current data first.`,'Restore',true))) return;
  const btn = document.getElementById('restoreBtn'); if(btn){ btn.disabled=true; btn.textContent='Restoring…'; }
  try{
    for(const store of BACKUP_STORES){ if(v.data[store]===undefined) continue; await dbClear(store); for(const row of v.data[store]) await dbPut(store, row); }
    await reseedCounters();
    await loadSettingsAndSeed(); await rebuildDailyRecords(); await maybeAutoBackup();
    window.__restore = null; tell('Data restored.'); go('dashboard');
  }catch(e){ console.error(e); tell('Restore stopped: '+(e && e.message ? e.message : e)+'\nSome data may be partly restored — run the restore again with the same file.'); if(btn){ btn.disabled=false; btn.textContent='Restore Data'; } }
}
async function reseedCounters(){   // so new invoice / session numbers continue after the restored ones
  const f = fb();
  for(const store of AUTOINC){
    try{
      const rows = await dbAllFresh(store); const kp = KEYPATH[store]||'id'; const max = rows.reduce((m,r)=>Math.max(m, Number(r[kp])||0), 0);
      const ref = f.doc(f.db,'counters',store); const snap = await f.getDoc(ref); const cur = snap.exists() ? (snap.data().n||0) : 0;
      if(max>cur) await writeAck(f.setDoc(ref,{n:max}));
    }catch(e){ console.warn('counter reseed', store, e); }
  }
}
async function doClearAll(){
  if(!(await askConfirm('This will permanently delete ALL data. Are you sure?'))) return;
  if(!(await askConfirm('Really sure? This cannot be undone.'))) return;
  for(const store of BACKUP_STORES){ await dbClear(store); }
  liveSessions=[]; await loadSettingsAndSeed(); go('dashboard');
}
