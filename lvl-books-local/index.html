<style>

@media (prefers-color-scheme: light){

    --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --line:#dde3f0;
    --neon:#0f8fae; --neon2:#7a3fd1; --pink:#d1216c; --green:#1f9d57; --amber:#b5790a; --red:#c23b3b;
    --text:#12151c; --muted:#5b6478;
  }
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --line:#dde3f0;
  --neon:#0f8fae; --neon2:#7a3fd1; --pink:#d1216c; --green:#1f9d57; --amber:#b5790a; --red:#c23b3b;

*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;

h1,h2,h3{margin:0 0 8px}
.app{max-width:520px;margin:0 auto;padding:10px 14px 8px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,#0b0d12 85%,transparent);display:flex;align-items:center;justify-content:space-between;margin:0 -14px 10px;padding:10px 14px 6px}

.brand span{color:var(--neon);text-shadow:0 0 12px rgba(75,232,255,.6)}
#installBtn{display:none;background:var(--panel2);border:1px solid var(--neon);color:var(--neon);border-radius:10px;padding:6px 10px;font-size:12px}

.col{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .v{font-size:19px;font-weight:800}
.stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px 14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%;min-height:46px}

.btn.primary{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#080a10;border:none}
.btn.pink{background:linear-gradient(135deg,var(--pink),var(--neon2));color:#080a10;border:none}

.btn.sm{padding:9px 10px;font-size:13px;width:auto;min-height:38px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;font-size:16px}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}

.pill.amber{background:rgba(255,200,87,.15);color:var(--amber)}
.pill.red{background:rgba(255,92,92,.15);color:var(--red)}

.list-item:last-child{border-bottom:none}

.navbtn{flex:1;text-align:center;padding:9px 2px;color:var(--muted);font-size:10.5px;background:none;border:none;min-height:52px}
.navbtn.active{color:var(--neon)}
.navbtn .ic{font-size:19px;display:block}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 6px}
.chip{display:inline-flex;padding:9px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);margin:4px 6px 4px 0;font-size:13px}
.chip.sel{border-color:var(--neon);color:var(--neon);box-shadow:0 0 0 1px var(--neon) inset}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}

.close{float:right;background:none;border:none;color:var(--muted);font-size:20px;min-height:30px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
.right{text-align:right}
.total-row{font-weight:800;font-size:16px}
.timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.bar-row{margin:6px 0}
.bar-track{background:var(--panel2);border-radius:8px;height:10px;overflow:hidden;margin-top:3px}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));border-radius:8px}

<body>
<div id="root" class="app"></div>

<script>
/* ============ IndexedDB ============ */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('lvlbooks', 3);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      const ensure = (name, opts)=>{ if(!d.objectStoreNames.contains(name)) d.createObjectStore(name, opts); };
      ensure('customers',{keyPath:'mobile'});
      ensure('sessions',{keyPath:'id',autoIncrement:true});
      ensure('invoices',{keyPath:'id',autoIncrement:true});
      ensure('products',{keyPath:'id',autoIncrement:true});
      ensure('expenses',{keyPath:'id',autoIncrement:true});
      ensure('settings',{keyPath:'key'});
      ensure('vendors',{keyPath:'id',autoIncrement:true});
      ensure('purchases',{keyPath:'id',autoIncrement:true});
      ensure('employees',{keyPath:'id',autoIncrement:true});
      ensure('employeeTx',{keyPath:'id',autoIncrement:true});
      ensure('accounts',{keyPath:'name'});
      ensure('dailyRecords',{keyPath:'date'});
    };
    r.onsuccess = e=>{db=e.target.result; res(db)};
    r.onerror = e=>rej(e);
  });
}
function tx(store,mode){ return db.transaction(store,mode).objectStore(store) }
function dbAll(store){ return new Promise((res,rej)=>{ const rq=tx(store,'readonly').getAll(); rq.onsuccess=()=>res(rq.result); rq.onerror=rej }) }
function dbGet(store,key){ return new Promise((res,rej)=>{ const rq=tx(store,'readonly').get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=rej }) }
function dbPut(store,val){ return new Promise((res,rej)=>{ const rq=tx(store,'readwrite').put(val); rq.onsuccess=()=>res(rq.result); rq.onerror=rej }) }
function dbDel(store,key){ return new Promise((res,rej)=>{ const rq=tx(store,'readwrite').delete(key); rq.onsuccess=()=>res(rq.result); rq.onerror=rej }) }
function dbClear(store){ return new Promise((res,rej)=>{ const rq=tx(store,'readwrite').clear(); rq.onsuccess=()=>res(); rq.onerror=rej }) }

/* ============ Static catalog / pricing data layer ============ */
const CONSOLE_CONFIGS = {

  PS5_55:   { console:'PS5',     tv:'55" 4K Neo QLED TV', rates:{1:[140,70], 2:[230,115], 3:[320,160], 4:[420,210]} },
  PS5_65:   { console:'PS5',     tv:'65" 4K QLED TV',     rates:{1:[160,80], 2:[270,135], 3:[380,190], 4:[500,250]} },
  PS5PRO_65:{ console:'PS5 Pro', tv:'65" 4K QLED TV',     rates:{1:[180,90], 2:[310,155], 3:[440,220], 4:[580,290]} },
};
const CONSOLE_OPTIONS = { PS4:['PS4_55'], PS5:['PS5_55','PS5_65'], 'PS5 Pro':['PS5PRO_65'] };
const DEFAULT_PRODUCTS = [
 {name:'Classic Fries',cat:'Veg Bites',price:95,stock:50,min:10},
 {name:'Peri Peri Fries',cat:'Veg Bites',price:100,stock:50,min:10},

 {name:'Chicken Loaded Fries',cat:'Non-Veg Delights',price:150,stock:30,min:10},

 {name:'Chicken Nuggets (8 pcs)',cat:'Non-Veg Delights',price:160,stock:30,min:10},

 {name:'Fanta',cat:'Beverages',price:20,stock:100,min:20},
 {name:'Pepsi',cat:'Beverages',price:20,stock:100,min:20},

];
const BEVERAGES = ['Sprite','Fanta','Pepsi','Mazza'];
const DEFAULT_SETTINGS = {
  businessName:'LVL Gaming Café', phone:'', address:'', gstin:'',
  invoicePrefix:'LVL-INV-', nextInvoiceNo:1,
  accompanyHourRate:50, accompanyHalfRate:25,
  taxEnabled:false, taxRate:0,
  footer:'Thank you for choosing LVL Gaming Café! See you again! 🎮'
};
const DEFAULT_ACCOUNTS = ['Cash','UPI','Bank','Card','Other'].map(n=>({name:n, balance:0}));
const PAY_TO_ACCOUNT = {'Cash':'Cash','UPI':'UPI','Card':'Card','Bank Transfer':'Bank','Other':'Other'};

/* ============ Billing math ============ */
function chargeFor(minutes, hourRate, halfRate){
  const hours = Math.floor(minutes/60); const rem = minutes % 60;
  return hours*hourRate + (rem===30 ? halfRate : 0);
}
function fmt(n){ return '₹' + Math.round(n||0).toLocaleString('en-IN') }
function fmtDur(mins){ const h=Math.floor(mins/60), m=mins%60; return (h?h+'h ':'') + (m?m+'m':'') || '0m'; }
function todayStr(){ return new Date().toDateString(); }
function isToday(ts){ return new Date(ts).toDateString()===todayStr(); }
function startOfWeek(){ const d=new Date(); const day=d.getDay(); d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d.getTime(); }
function startOfMonth(){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); }
function inRange(ts, range, custStart, custEnd){
  if(range==='today') return isToday(ts);
  if(range==='week') return ts>=startOfWeek();
  if(range==='month') return ts>=startOfMonth();
  if(range==='custom') return ts>=custStart && ts<=custEnd;
  return true;
}

/* ============ CSV export ============ */
function toCSV(rows){
  if(!rows || !rows.length) return 'no data\n';
  const headers = Object.keys(rows[0]);
  const esc = v=>{ if(v===undefined||v===null) return ''; v = typeof v==='object'? JSON.stringify(v): String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; };
  return [headers.join(','), ...rows.map(r=>headers.map(h=>esc(r[h])).join(','))].join('\n');
}
function downloadCSV(filename, rows){
  const blob = new Blob([toCSV(rows)], {type:'text/csv'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
}
async function exportAllCSV(){
  const stores = ['customers','sessions','invoices','products','expenses','vendors','purchases','employees'];
  for(const s of stores){ downloadCSV(`LVL-${s}.csv`, await dbAll(s)); await new Promise(r=>setTimeout(r,250)); }
}

/* ============ App state ============ */
let state = { screen:'dashboard', settings:null, custProfile:null, vendorId:null, reportRange:'today', reportStart:null, reportEnd:null };

async function boot(){
  initTheme();
  await openDB();
  if(navigator.storage && navigator.storage.persist){ try{ const granted = await navigator.storage.persist(); console.log('Persistent storage:', granted); }catch(e){} }
  let s = await dbGet('settings','main');
  if(!s){ s = {key:'main', ...DEFAULT_SETTINGS}; await dbPut('settings', s); }
  state.settings = s;
  const prods = await dbAll('products');
  if(prods.length===0){ for(const p of DEFAULT_PRODUCTS){ await dbPut('products', p); } }
  const accs = await dbAll('accounts');
  if(accs.length===0){ for(const a of DEFAULT_ACCOUNTS){ await dbPut('accounts', a); } }
  setupManifestAndInstall();
  render();
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('lvl_theme'); }catch(e){}
  const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('lvl_theme', next); }catch(e){}
  render();
}
function dateKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthKey(dateStr){ return dateStr.slice(0,7); } // YYYY-MM from a YYYY-MM-DD dailyRecords date
function weekKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
  return d.getFullYear()+'-W'+String(week).padStart(2,'0');
}
function aggregateDaily(records, keyFn, limit){
  const map = {};
  records.forEach(r=>{ const k=keyFn(r.date); if(!map[k]) map[k]={key:k, sales:0, expenses:0}; map[k].sales+=r.sales; map[k].expenses+=r.expenses; });
  return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key)).slice(-limit);
}
async function updateDailyRecord(dateStr){
  const invoices = (await dbAll('invoices')).filter(i=>dateKey(i.date)===dateStr);
  const expenses = (await dbAll('expenses')).filter(e=>!e.isTemplate && dateKey(e.date)===dateStr);
  const sales = invoices.reduce((s,i)=>s+i.grandTotal,0);
  const exp = expenses.reduce((s,e)=>s+e.amount,0);
  const gamingRev = invoices.reduce((s,i)=>s+i.gamingAmount+i.accompanyAmount,0);
  const foodRev = invoices.reduce((s,i)=>s+i.foodAmount,0);
  await dbPut('dailyRecords', { date: dateStr, sales, expenses:exp, net: sales-exp, gamingRev, foodRev, invoiceCount: invoices.length, expenseCount: expenses.length, updatedAt: Date.now() });
}
async function rebuildDailyRecords(){
  const invoices = await dbAll('invoices'); const expenses = await dbAll('expenses');
  const days = new Set([...invoices.map(i=>dateKey(i.date)), ...expenses.filter(e=>!e.isTemplate).map(e=>dateKey(e.date))]);
  for(const d of days){ await updateDailyRecord(d); }
}
async function exportDayDetail(dateStr){
  const invoices = (await dbAll('invoices')).filter(i=>dateKey(i.date)===dateStr);
  const expenses = (await dbAll('expenses')).filter(e=>!e.isTemplate && dateKey(e.date)===dateStr);
  const sessions = (await dbAll('sessions')).filter(s=>dateKey(s.startTime)===dateStr);
  const blob = new Blob([JSON.stringify({date:dateStr, invoices, expenses, sessions}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `LVL-Books-Day-${dateStr}.json`; a.click();
}
function setupManifestAndInstall(){
  // manifest.json and icons are linked as real static files in <head> for this local/production build.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('Service worker registration failed:', err));
  }
  window.deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); window.deferredInstallPrompt=e; const b=document.getElementById('installBtn'); if(b) b.style.display='inline-block'; });
}
async function triggerInstall(){
  if(window.deferredInstallPrompt){ window.deferredInstallPrompt.prompt(); window.deferredInstallPrompt=null; document.getElementById('installBtn').style.display='none'; }
  else alert('On iPhone/iPad: tap the Share icon in Safari, then "Add to Home Screen".\nOn Android Chrome: tap the ⋮ menu, then "Add to Home Screen" / "Install app".');
}

/* ============ Navigation ============ */
const NAV = [
  {id:'dashboard', ic:'🏠', label:'Dashboard'},
  {id:'gaming', ic:'🎮', label:'Gaming'},
  {id:'inventory', ic:'📦', label:'Inventory'},
  {id:'invoices', ic:'🧾', label:'Invoices'},
  {id:'more', ic:'⋯', label:'More'},
];
function renderNav(){
  document.getElementById('navbar').innerHTML = NAV.map(n=>`
    <button class="navbtn ${state.screen===n.id?'active':''}" onclick="go('${n.id}')"><span class="ic">${n.ic}</span>${n.label}</button>`).join('');
}
function go(screen){ state.screen=screen; render(); }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(html){ document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }

async function render(){
  renderNav();
  const root = document.getElementById('root');
  root.innerHTML = `<div class="topbar"><div class="brand">LVL <span>BOOKS</span></div><div class="topbar-actions"><button id="installBtn" style="display:none" onclick="triggerInstall()">⬇️ Install</button><button id="themeBtn" onclick="toggleTheme()">${document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️'}</button></div></div>`;
  const map = { dashboard:screenDashboard, gaming:screenGaming, inventory:screenInventory, invoices:screenInvoices, more:screenMore,
    customers:screenCustomers, customerProfile:screenCustomerProfile, expenses:screenExpenses, settings:screenSettings, backup:screenBackup,
    vendors:screenVendors, vendorProfile:screenVendorProfile, purchases:screenPurchases, employees:screenEmployees, employeeProfile:screenEmployeeProfile,
    cashbank:screenCashBank, reports:screenReports };
  const fn = map[state.screen] || screenDashboard;
  root.innerHTML += await fn();
  if(window.deferredInstallPrompt) document.getElementById('installBtn').style.display='inline-block';
}

/* ============ Dashboard ============ */
async function screenDashboard(){
  const invoices = await dbAll('invoices');
  const expenses = (await dbAll('expenses')).filter(e=>!e.isTemplate);
  const sessions = await dbAll('sessions');
  const todayInv = invoices.filter(i=>isToday(i.date));
  const todayExp = expenses.filter(e=>isToday(e.date));
  const gamingRev = todayInv.reduce((s,i)=>s+i.gamingAmount+i.accompanyAmount,0);
  const foodRev = todayInv.reduce((s,i)=>s+i.foodAmount,0);
  const salesTotal = todayInv.reduce((s,i)=>s+i.grandTotal,0);
  const expTotal = todayExp.reduce((s,e)=>s+e.amount,0);
  const active = sessions.filter(s=>s.status==='active');
  const lowStock = (await dbAll('products')).filter(p=>p.combo===undefined && p.stock<=p.min);
  const recTemplates = (await dbAll('expenses')).filter(e=>e.isTemplate && e.nextDue<=Date.now());

  return `
  <div class="section-title">Today's Summary</div>
  <div class="grid2">
    <div class="stat"><div class="v">${fmt(salesTotal)}</div><div class="l">Sales</div></div>
    <div class="stat"><div class="v">${fmt(expTotal)}</div><div class="l">Expenses</div></div>
    <div class="stat"><div class="v">${fmt(salesTotal-expTotal)}</div><div class="l">Net</div></div>
    <div class="stat"><div class="v">${fmt(gamingRev)}</div><div class="l">Gaming Revenue</div></div>
    <div class="stat"><div class="v">${fmt(foodRev)}</div><div class="l">Food & Beverage</div></div>
    <div class="stat"><div class="v">${active.length}</div><div class="l">Active Sessions</div></div>
  </div>
  <div class="section-title">Quick Actions</div>
  <div class="qa">
    <button class="btn primary" onclick="startGamingFlow()">🎮 Start Gaming</button>
    <button class="btn" onclick="go('expenses')">💸 Add Expense</button>
    <button class="btn" onclick="go('customers')">👤 Customers</button>

/* ---- Live countdown ticker + expiry alert ---- */
const expiredAlerted = {};
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<3;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i*0.35;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
      o.start(t); o.stop(t+0.32);
    }
    setTimeout(()=>ctx.close(), 1200);
  }catch(e){}
}
function fmtClock(totalSec){
  const neg = totalSec<0; const a = Math.abs(totalSec);
  const m = Math.floor(a/60), sec = a%60;
  return (neg?'-':'') + String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function showExpiryBanner(sessionId, cfg){
  if(document.getElementById('expiryBanner-'+sessionId)) return;
  const el = document.createElement('div');
  el.id = 'expiryBanner-'+sessionId;
  el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:linear-gradient(135deg,var(--pink),var(--neon2));color:#080a10;padding:14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:492px;margin:0 auto';
  el.innerHTML = `<b>⏰ Time's up — ${cfg.console} ${cfg.tv}</b><div style="margin-top:8px;display:flex;gap:8px">
    <button class="btn sm" style="flex:1;background:#0009;color:#fff;border:none" onclick="extendSession(${sessionId},30); document.getElementById('expiryBanner-${sessionId}').remove()">+30 MIN</button>
    <button class="btn sm" style="flex:1;background:#0009;color:#fff;border:none" onclick="extendSession(${sessionId},60); document.getElementById('expiryBanner-${sessionId}').remove()">+1 HOUR</button>
    <button class="btn sm" style="flex:1;background:#0009;color:#fff;border:none" onclick="document.getElementById('expiryBanner-${sessionId}').remove(); endSession(${sessionId})">END</button>
  </div>`;
  document.body.appendChild(el);
}
async function tickSessions(){
  let sessions;
  try{ sessions = (await dbAll('sessions')).filter(s=>s.status==='active'); }catch(e){ return; }
  sessions.forEach(s=>{
    const el = document.getElementById('timerText-'+s.id);
    if(!el) return;
    const elapsedSec = Math.floor((Date.now()-s.startTime)/1000);
    const remaining = s.billableMinutes*60 - elapsedSec;
    if(remaining >= 0){
      el.innerHTML = `Time Left: <b>${fmtClock(remaining)}</b> &nbsp;|&nbsp; Billed: ${fmtDur(s.billableMinutes)}`;
      el.style.color = remaining<120 ? 'var(--amber)' : '';
      delete expiredAlerted[s.id];
    } else {
      el.innerHTML = `<span style="color:var(--red);font-weight:800">OVERTIME ${fmtClock(remaining)}</span> &nbsp;|&nbsp; Billed: ${fmtDur(s.billableMinutes)}`;
      if(!expiredAlerted[s.id]){
        expiredAlerted[s.id] = true;
        beep();
        showExpiryBanner(s.id, CONSOLE_CONFIGS[s.configKey]);
      }
    }
  });
  document.querySelectorAll('[id^="expiryBanner-"]').forEach(b=>{
    const id = Number(b.id.replace('expiryBanner-',''));
    if(!sessions.find(s=>s.id===id)) b.remove();
  });
}

async function completePayment(sessionId){
  const form = window.__checkoutForm();
  const s = await dbGet('sessions', sessionId);
  const cfg = CONSOLE_CONFIGS[s.configKey];
  const settings = state.settings;
  const name = form.name.trim(), mobile = form.mobile.trim();
  if(!name || mobile.length!==10){ alert('Enter valid name and 10-digit mobile number.'); return; }
  const accompanyVal = Number(form.accompany)||0, discountVal = Number(form.discount)||0, parentChild = !!form.parentChild, payMethod = form.payMethod;

  const gamingAmt = chargeFor(s.billableMinutes, cfg.rates[s.players][0], cfg.rates[s.players][1]);
  const foodAmt = s.items.reduce((sum,it)=>sum+it.price*it.qty,0);
  const accAmt = parentChild ? 0 : chargeFor(s.billableMinutes, settings.accompanyHourRate, settings.accompanyHalfRate) * accompanyVal;
  const subtotal = gamingAmt + accAmt + foodAmt;
  const tax = settings.taxEnabled ? (subtotal-discountVal)*settings.taxRate/100 : 0;
  const grand = subtotal - discountVal + tax;

  let cust = await dbGet('customers', mobile);
  const nowIso = new Date().toISOString();
  if(!cust){ cust = { mobile, name, email:'', address:'', joined:nowIso, visits:0, gamingSessions:0, gamingHours:0, gamingSpend:0, foodSpend:0, totalSpend:0, lastVisit:nowIso, invoiceIds:[] }; }
  cust.name = name; cust.visits += 1; cust.gamingSessions += 1; cust.gamingHours += s.billableMinutes/60;
  cust.gamingSpend += gamingAmt + accAmt; cust.foodSpend += foodAmt; cust.totalSpend += grand; cust.lastVisit = nowIso;

  for(const item of s.items){ if(item.productId){ const p = await dbGet('products', item.productId); if(p && p.combo===undefined){ p.stock = Math.max(0, p.stock - item.qty); await dbPut('products', p); } } }

  const invNo = settings.invoicePrefix + String(settings.nextInvoiceNo).padStart(6,'0');
  settings.nextInvoiceNo += 1; await dbPut('settings', settings); state.settings = settings;

  const invoice = { number: invNo, date: Date.now(), customerName:name, customerMobile:mobile,
    console:cfg.console, tv:cfg.tv, players:s.players, durationMins:s.billableMinutes,
    gamingAmount: gamingAmt, accompanyAmount: accAmt, accompanyCount: accompanyVal,
    foodAmount: foodAmt, items: s.items, subtotal, discount: discountVal, tax, grandTotal: grand, paymentMethod: payMethod };
  const invId = await dbPut('invoices', invoice);
  cust.invoiceIds.push(invId); await dbPut('customers', cust);

  s.status='completed'; s.endTime=Date.now(); await dbPut('sessions', s);
  await creditAccount(payMethod, grand);
  await updateDailyRecord(dateKey(invoice.date));

  closeModal();
  showInvoiceSuccess({...invoice, id:invId});
}
async function creditAccount(payMethod, amount){
  const accName = PAY_TO_ACCOUNT[payMethod] || 'Other';
  const acc = await dbGet('accounts', accName) || {name:accName, balance:0};
  acc.balance += amount; await dbPut('accounts', acc);
}
async function debitAccount(payMethod, amount){
  const accName = PAY_TO_ACCOUNT[payMethod] || 'Other';
  const acc = await dbGet('accounts', accName) || {name:accName, balance:0};
  acc.balance -= amount; await dbPut('accounts', acc);
}

async function addExpense(){
  const category = document.getElementById('expCat').value;
  const desc = document.getElementById('expDesc').value;
  const amount = Number(document.getElementById('expAmt').value);
  const payMethod = document.getElementById('expPay').value;
  const recurring = document.getElementById('expRecurring').checked;
  if(!amount) return alert('Enter a valid amount.');
  if(recurring){
    const freq = document.getElementById('expFreq').value;
    const next = new Date(); if(freq==='Monthly') next.setMonth(next.getMonth()+1); else next.setDate(next.getDate()+7);
    await dbPut('expenses', { category, desc, amount, frequency:freq, isTemplate:true, nextDue: next.getTime(), date: Date.now() });
  } else {
    await dbPut('expenses', { category, desc, amount, date:Date.now(), payMethod });
    await debitAccount(payMethod, amount);
    await updateDailyRecord(dateKey(Date.now()));
  }
  render();
}
async function logRecurring(templateId){
  const t = await dbGet('expenses', templateId);
  await dbPut('expenses', { category:t.category, desc:t.desc+' (recurring)', amount:t.amount, date:Date.now(), payMethod:'Cash' });
  await debitAccount('Cash', t.amount);
  const next = new Date(t.nextDue); if(t.frequency==='Monthly') next.setMonth(next.getMonth()+1); else next.setDate(next.getDate()+7);
  t.nextDue = next.getTime(); await dbPut('expenses', t);
  await updateDailyRecord(dateKey(Date.now()));
  render();
}

async function savePurchase(){
  if(!purchaseCart.length) return alert('Add at least one item.');
  const vendorId = Number(document.getElementById('pVendor').value);
  const invoiceNo = document.getElementById('pInvNo').value || ('PUR-'+Date.now());
  const tax = Number(document.getElementById('pTax').value)||0;
  const paymentStatus = document.getElementById('pStatus').value;
  const payMethod = document.getElementById('pPayMethod').value;
  const subtotal = purchaseCart.reduce((s,i)=>s+i.qty*i.rate,0);
  const total = subtotal + subtotal*tax/100;
  for(const item of purchaseCart){ const p = await dbGet('products', item.productId); p.stock += item.qty; await dbPut('products', p); }
  await dbPut('purchases', { vendorId, invoiceNo, date:Date.now(), items:purchaseCart, subtotal, tax, total, paymentStatus });
  if(paymentStatus==='Paid') await debitAccount(payMethod, total);
  purchaseCart = [];
  render();
}

async function screenReports(){
  const range = state.reportRange;
  const invoicesAll = await dbAll('invoices');
  const expensesAll = (await dbAll('expenses')).filter(e=>!e.isTemplate);
  const invoices = invoicesAll.filter(i=>inRange(i.date, range, state.reportStart, state.reportEnd));
  const expenses = expensesAll.filter(e=>inRange(e.date, range, state.reportStart, state.reportEnd));
  const salesTotal = invoices.reduce((s,i)=>s+i.grandTotal,0);
  const expTotal = expenses.reduce((s,e)=>s+e.amount,0);
  const gamingRev = invoices.reduce((s,i)=>s+i.gamingAmount+i.accompanyAmount,0);
  const foodRev = invoices.reduce((s,i)=>s+i.foodAmount,0);
  const netProfit = salesTotal - expTotal;

  const expByCat = {}; expenses.forEach(e=>{ expByCat[e.category]=(expByCat[e.category]||0)+e.amount; });
  const consoleRev = {}; invoices.forEach(i=>{ consoleRev[i.console]=(consoleRev[i.console]||0)+i.gamingAmount; });
  const playerRev = {}; invoices.forEach(i=>{ playerRev[i.players+'P']=(playerRev[i.players+'P']||0)+i.gamingAmount; });
  const gamingHours = invoices.reduce((s,i)=>s+i.durationMins,0)/60;

  const foodQty = {}; invoices.forEach(i=>i.items.forEach(it=>{ foodQty[it.name]=(foodQty[it.name]||0)+it.qty; }));
  const bestSellers = Object.entries(foodQty).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const products = await dbAll('products');
  const invValue = products.filter(p=>p.combo===undefined).reduce((s,p)=>s+p.stock*p.price,0);
  const lowStock = products.filter(p=>p.combo===undefined && p.stock<=p.min);

  const bar = (obj, total)=>Object.entries(obj).map(([k,v])=>`<div class="bar-row"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${k}</span><span>${fmt(v)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${total?Math.round(v/total*100):0}%"></div></div></div>`).join('');

  const dailyRecords = (await dbAll('dailyRecords')).sort((a,b)=>b.date.localeCompare(a.date));
  const monthly = aggregateDaily(dailyRecords, r=>monthKey(r.date), 12);
  const weekly = aggregateDaily(dailyRecords, r=>weekKey(r.date), 12);
  const periodBars = (periods)=>{
    if(!periods.length) return '<div class="muted">Not enough history yet — this fills in as you record sales and expenses each day.</div>';
    const max = Math.max(1, ...periods.map(p=>Math.max(p.sales,p.expenses)));
    return periods.map(p=>`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px"><b>${p.key}</b><span>Income ${fmt(p.sales)} · Expense ${fmt(p.expenses)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(p.sales/max*100)}%;background:linear-gradient(90deg,var(--green),#1c8f52)"></div></div>
      <div class="bar-track" style="margin-top:3px"><div class="bar-fill" style="width:${Math.round(p.expenses/max*100)}%;background:linear-gradient(90deg,var(--red),#a33)"></div></div>
    </div>`).join('');
  };
  const revenueBars = (periods)=>{
    if(!periods.length) return '<div class="muted">No revenue history yet.</div>';
    const max = Math.max(1, ...periods.map(p=>p.sales));
    return periods.map(p=>`<div class="bar-row"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${p.key}</span><span>${fmt(p.sales)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(p.sales/max*100)}%"></div></div></div>`).join('');
  };

  return `<h2>Reports</h2>
  <div style="margin-bottom:10px">
    ${['today','week','month','custom'].map(r=>`<span class="chip ${range===r?'sel':''}" onclick="setReportRange('${r}')">${r[0].toUpperCase()+r.slice(1)}</span>`).join('')}
  </div>
  ${range==='custom'?`<div class="card"><label>Start</label><input type="date" id="rStart" onchange="setCustomRange()"><label>End</label><input type="date" id="rEnd" onchange="setCustomRange()"></div>`:''}

    <div class="stat"><div class="v">${invoices.length}</div><div class="l">Invoices</div></div>
  </div>

  <div class="section-title">Profit & Loss</div>
  <div class="card"><table>
    <tr><td>Revenue</td><td class="right">${fmt(salesTotal)}</td></tr>
    <tr><td>Expenses</td><td class="right">-${fmt(expTotal)}</td></tr>
    <tr class="total-row"><td>Net Profit</td><td class="right">${fmt(netProfit)}</td></tr>
  </table></div>

  <div class="section-title">Monthly Income vs Expense</div>
  <div class="card">${periodBars(monthly)}</div>

  <div class="section-title">Weekly Revenue</div>
  <div class="card">${revenueBars(weekly)}</div>

  <div class="section-title">Monthly Revenue</div>
  <div class="card">${revenueBars(monthly)}</div>

  <div class="section-title">Expense Report</div>
  <div class="card">${Object.keys(expByCat).length?bar(expByCat, expTotal):'<div class="muted">No expenses in this range.</div>'}</div>

  <div class="section-title">Gaming Report</div>
  <div class="card">
    <div class="grid2" style="margin-bottom:10px">
      <div class="stat"><div class="v">${invoices.length}</div><div class="l">Sessions Billed</div></div>
      <div class="stat"><div class="v">${gamingHours.toFixed(1)}h</div><div class="l">Gaming Hours</div></div>
      <div class="stat"><div class="v">${fmt(gamingRev)}</div><div class="l">Gaming Revenue</div></div>
      <div class="stat"><div class="v">${fmt(foodRev)}</div><div class="l">Food Revenue</div></div>
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:4px">Revenue by Console</div>${bar(consoleRev, gamingRev)}
    <div class="muted" style="font-size:12px;margin:10px 0 4px">Revenue by Player Count</div>${bar(playerRev, gamingRev)}
  </div>

  <div class="section-title">Food Report — Best Sellers</div>
  <div class="card">${bestSellers.length? bestSellers.map(([n,q])=>`<div class="list-item"><span>${n}</span><span>${q} sold</span></div>`).join('') : '<div class="muted">No food sales in this range.</div>'}</div>

  <div class="section-title">Inventory Report</div>
  <div class="card"><div class="list-item"><span>Inventory Value</span><span>${fmt(invValue)}</span></div>
  <div class="list-item"><span>Low Stock Items</span><span>${lowStock.length}</span></div></div>

  <div class="section-title">Daily Backup Log</div>
  <div class="card">${dailyRecords.length ? dailyRecords.slice(0,60).map(r=>`
    <div class="list-item"><div><b>${r.date}</b><br><span class="muted">${r.invoiceCount} invoice(s) · ${r.expenseCount||0} expense(s)</span></div>
    <div class="right">${fmt(r.sales)} / -${fmt(r.expenses)}<br><button class="btn sm" style="margin-top:4px" onclick="exportDayDetail('${r.date}')">Export Day</button></div></div>
  `).join('') : '<div class="muted">No daily records yet — these build up automatically as you take payments.</div>'}</div>

  <button class="btn primary" style="margin:12px 0" onclick="exportAllCSV()">⬇️ Export All Data (CSV)</button>
  `;
}
function setReportRange(r){ state.reportRange=r; render(); }
function setCustomRange(){
  const s = document.getElementById('rStart')?.value, e = document.getElementById('rEnd')?.value;
  if(s) state.reportStart = new Date(s).getTime();
  if(e) state.reportEnd = new Date(e).setHours(23,59,59,999);
  render();
}

/* ============ Backup & Restore ============ */
function screenBackup(){
  return `<button class="btn ghost" style="width:auto;margin-bottom:8px" onclick="go('more')">← Back</button>
  <h2>Backup & Restore</h2>
  <div class="card">
    <button class="btn primary" onclick="doBackup()">⬇️ Backup Data</button>
    <p class="muted" style="font-size:12px;margin-top:6px">On Android/iPhone this opens your Share menu — pick Google Drive, Files, or email to save it off your phone. If sharing isn't available it downloads the file directly.</p>
    <label style="margin-top:14px">Restore from File</label>
    <input type="file" id="restoreFile" accept=".json">
    <button class="btn" style="margin-top:8px" onclick="doRestore()">Restore Data</button>
    <button class="btn" style="margin-top:14px;border-color:var(--red);color:var(--red)" onclick="doClearAll()">🗑️ Clear All Data</button>
  </div>
  <div class="card">
    <div class="section-title">Keeping data for years</div>
    <p class="muted" style="font-size:13px">This app stores everything on your phone's browser storage, and it requests "persistent" storage so Android/iOS is less likely to clear it automatically. Even so, no on-device storage is 100% permanent — back up weekly (or daily using the export below) and keep a copy in Google Drive or email so nothing is ever lost.</p>
  </div>`;
}
async function doBackup(){
  const data = {};
  for(const store of ['customers','sessions','invoices','products','expenses','settings','vendors','purchases','employees','employeeTx','accounts','dailyRecords']){ data[store] = await dbAll(store); }
  const json = JSON.stringify(data,null,2);
  const d = new Date().toISOString().slice(0,10);
  const filename = `LVL-Books-Backup-${d}.json`;
  const blob = new Blob([json], {type:'application/json'});
  try{
    const file = new File([blob], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'LVL Books Backup', text:`LVL Books backup — ${d}`});
      return;
    }
  }catch(e){ /* user cancelled share or share unsupported — fall back to direct download below */ }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
}
async function doRestore(){
  const file = document.getElementById('restoreFile').files[0];
  if(!file) return alert('Choose a backup file first.');
  if(!confirm('This will replace all current data. Continue?')) return;
  const data = JSON.parse(await file.text());
  for(const store of Object.keys(data)){ await dbClear(store); for(const row of data[store]){ await dbPut(store, row); } }
  state.settings = await dbGet('settings','main');
  await rebuildDailyRecords();
  alert('Data restored.'); go('dashboard');
}
async function doClearAll(){
  if(!confirm('This will permanently delete ALL data. Are you sure?')) return;
  if(!confirm('Really sure? This cannot be undone.')) return;
  for(const store of ['customers','sessions','invoices','expenses','vendors','purchases','employees','employeeTx','dailyRecords']){ await dbClear(store); }
  await dbClear('products'); for(const p of DEFAULT_PRODUCTS){ await dbPut('products', p); }
  await dbClear('accounts'); for(const a of DEFAULT_ACCOUNTS){ await dbPut('accounts', a); }
  await dbClear('settings'); state.settings = {key:'main', ...DEFAULT_SETTINGS}; await dbPut('settings', state.settings);
  go('dashboard');
}
